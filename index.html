<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode Scanner and Search</title>
  <style>
    /* CSS */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      background-color: #f5f5f5;
    }

    #scanner-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
      border: 2px solid #ccc;
      border-radius: 10px;
      overflow: hidden;
      display: none; /* إخفاء الفيديو بشكل افتراضي */
    }

    #scanner-container video {
      width: 100%;
      height: auto;
    }

    .container {
      margin-top: 20px;
    }

    input[type="text"] {
      width: 80%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #007BFF;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }

    #status-message {
      margin-top: 10px;
      font-weight: bold;
    }

    .popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .popup h2 {
      margin: 0 0 10px;
    }

    .close-btn {
      background: #f44336;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px;
      cursor: pointer;
    }

    .close-btn:hover {
      background: #d32f2f;
    }
  </style>
</head>
<body>

  <div id="scanner-container">
    <div id="interactive" class="viewport"></div>
  </div>

  <div class="container">
    <h1>بحث المنتجات باستخدام الباركود</h1>

    <form id="barcode-form">
      <input type="text" id="barcode-input" placeholder="أدخل الباركود" required>
      <input type="submit" value="بحث">
    </form>
  </div>

  <div class="popup" id="result-popup">
    <h2>نتائج البحث:</h2>
    <div class="detail-box">
      <strong>الاسم:</strong> <span id="product-name-result">-</span>
    </div>
    <div class="price-box">
      <strong>السعر:</strong> <span id="product-price-result">-</span>
    </div>
    <div class="detail-box">
      <strong>الباركود:</strong> <span id="product-barcode-result">-</span>
    </div>
    <button class="close-btn" onclick="closePopup()">إغلاق</button>
  </div>

  <button id="start-scanner">Start Scanner</button>
  <p id="status-message"></p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <script>
const scannerContainer = document.getElementById('scanner-container');
const statusMessage = document.getElementById('status-message');
const barcodeInput = document.getElementById('barcode-input');
const startScannerButton = document.getElementById('start-scanner');

let isProcessing = false;
let scannerActive = false;
let retryCounter = 0;
const maxRetries = 3; // عدد المحاولات القصوى لإعادة قراءة الباركود

// إعداد مكتبة Quagga.js
function initializeScanner() {
    if (scannerActive) {
        stopScanner(); // إعادة التهيئة إذا كانت الكاميرا تعمل
    }

    scannerContainer.style.display = 'block'; // إظهار الكاميرا
    startScannerButton.disabled = true;
    statusMessage.textContent = "جاري تشغيل الكاميرا...";

    Quagga.init(
        {
            inputStream: {
                name: "Live",
                type: "LiveStream",
                target: document.querySelector("#interactive"),
                constraints: {
                    facingMode: "environment", // استخدام الكاميرا الخلفية
                    width: { ideal: 1920 },
                    height: { ideal: 1080 },
                    aspectRatio: { ideal: 16 / 9 },
                    advanced: [{ focusMode: "continuous" }], // تحسين التركيز
                },
            },
            decoder: {
                readers: [
                    "code_128_reader",
                    "ean_reader",
                    "ean_8_reader",
                    "upc_reader",
                ],
            },
            locate: true, // تمكين تحديد المواقع
            numOfWorkers: navigator.hardwareConcurrency || 4, // تحسين الأداء
        },
        function (err) {
            if (err) {
                console.error("خطأ أثناء تشغيل الكاميرا:", err);
                statusMessage.textContent = "فشل تشغيل الكاميرا.";
                startScannerButton.disabled = false;
                return;
            }
            Quagga.start();
            scannerActive = true;
            statusMessage.textContent = "جاري البحث عن الباركود...";
        }
    );

    Quagga.onDetected(processBarcode);
    Quagga.onProcessed(handleFrameProcessed);
}

// عند اكتشاف الإطار (لتحليل البيانات)
function handleFrameProcessed(result) {
    if (result && result.boxes) {
        const ctx = Quagga.canvas.ctx.overlay;
        const canvas = Quagga.canvas.dom.overlay;

        ctx.clearRect(0, 0, canvas.width, canvas.height); // مسح الإطار السابق

        result.boxes
            .filter(box => box !== result.box) // تجنب رسم الإطار الأساسي
            .forEach(box => Quagga.ImageDebug.drawPath(box, { x: 0, y: 1 }, ctx, { color: "blue", lineWidth: 2 }));

        if (result.box) {
            Quagga.ImageDebug.drawPath(result.box, { x: 0, y: 1 }, ctx, { color: "green", lineWidth: 2 });
        }
    }
}

// معالجة البيانات عند اكتشاف باركود
function processBarcode(data) {
    if (isProcessing) return;

    const code = data.codeResult.code;

    if (isValidBarcode(code)) {
        isProcessing = true;

        setTimeout(() => {
            barcodeInput.value = code; // تعبئة الحقل بالباركود
            stopScanner(); // إيقاف الكاميرا بعد نجاح القراءة
            document.getElementById('barcode-form').dispatchEvent(new Event('submit')); // بدء البحث تلقائيًا
        }, 500);
    } else {
        retryCounter++;
        if (retryCounter >= maxRetries) {
            statusMessage.textContent = "فشل قراءة الباركود. الرجاء المحاولة مرة أخرى.";
            retryCounter = 0; // إعادة تعيين العداد
            stopScanner();
        }
    }
}

// التحقق من صحة الباركود
function isValidBarcode(code) {
    // شرط للتأكد من أن الكود ليس فارغًا وأن طوله مناسب
    return !!code && code.length >= 6 && /^\d+$/.test(code); // باركود يجب أن يحتوي فقط على أرقام
}

// إيقاف الكاميرا
function stopScanner() {
    if (scannerActive) {
        Quagga.stop();
        scannerActive = false;
        scannerContainer.style.display = 'none'; // إخفاء الفيديو
        startScannerButton.disabled = false;
        statusMessage.textContent = "تم إيقاف الكاميرا.";
    }
}

// تشغيل الكاميرا عند الضغط على الزر
startScannerButton.addEventListener("click", initializeScanner);

// تنظيف النصوص عند إعادة التشغيل
startScannerButton.addEventListener("click", () => {
    barcodeInput.value = "";
    statusMessage.textContent = "جاري تشغيل الكاميرا...";
});
  </script>
</body>
</html>
