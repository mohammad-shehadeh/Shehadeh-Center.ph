  <style>
/* General Styles */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #000000, #000000, #8e0e0e);
  margin: 0;
  padding: 0;
  text-align: center;
  color: #333;
  position: relative;
  overflow: hidden;
  animation: backgroundMove 30s linear infinite; /* حركة للخلفية */
}

/* تأثير الشلال المائي */
@keyframes waterfall {
  0% { top: -100%; opacity: 0; }
  50% { top: 50%; opacity: 0.5; }
  100% { top: 100%; opacity: 1; }
}

.waterfall {
  position: absolute;
  top: -100%;
  left: 0;
  width: 100%;
  height: 150px;
  background: rgba(255, 255, 255, 0.5);
  animation: waterfall 3s infinite;
  opacity: 0.8;
  z-index: -1;
}

/* تأثير الأمواج */
@keyframes waves {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.wave {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background: rgba(255, 255, 255, 0.6);
  background-image: url('https://www.transparenttextures.com/patterns/waves.png'); /* يمكنك تغيير الرابط إلى صورة أمواج أخرى */
  animation: waves 5s linear infinite;
  z-index: -2;
}

/* حركة مستمرة للخلفية */
@keyframes backgroundMove {
  0% { background-position: 0 0; }
  50% { background-position: 100% 100%; }
  100% { background-position: 0 0; }
}

/* تحسين مظهر النص */
h1, p {
  color: white;
  text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
}

/* تحسين الأزرار */
button {
  padding: 10px 20px;
  font-size: 18px;
  background-color: #ff6f61;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color 0.3s;
}

button:hover {
  background-color: #ff3e1d;
}

/* تحسين التباين */
.container {
  padding: 30px;
  max-width: 1200px;
  margin: 0 auto;
  background: url('https://cdn.dribbble.com/users/1585453/screenshots/7254661/media/34d38558c8177f52debd9d1f83295001.gif') center/cover no-repeat; /* الصورة كخلفية */
  border-radius: 20px;
  box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2); /* ظل الحاوية */
  animation: float 3s infinite ease-in-out;
}

/* تأثير طفو خفيف */
@keyframes float {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
}

/* تحسين التوافق مع الأجهزة المحمولة */
@media (max-width: 768px) {
  body {
    text-align: left;
    padding: 10px;
  }

  h1 {
    font-size: 22px;
  }

  p {
    font-size: 14px;
  }

  button {
    font-size: 14px;
    padding: 8px 12px;
  }
}

h1 {
  color: #fff; /* نص أبيض لتباين أفضل مع الخلفية */
  font-size: 2.8rem;
  text-shadow: 2px 2px 15px rgba(0, 0, 0, 0.8); /* ظلال لتحسين وضوح النص */
  margin-top: 30px;
  animation: fadeIn 2s ease-in-out;
}

/* Fade-in animation for h1 */
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

/* تحسين النصوص الأخرى */
p, button {
  color: #fff;
  text-shadow: 1px 1px 10px rgba(0, 0, 0, 0.6); /* ظلال خفيفة لتحسين الوضوح */
}

/* Slide-in animation for container */
@keyframes slideIn {
  from {
    transform: translateY(20px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

/* تصميم حديث للماسح */
#scanner-container {
  position: relative;
  width: 100%;
  height: 250px;
  border-radius: 15px;
  overflow: hidden;
  background: linear-gradient(145deg, #000000, #1a1a1a);
  box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.4), inset 0px -2px 8px rgba(255, 255, 255, 0.1);
  animation: scaleUp 0.8s ease-in-out;
}

/* تأثير الذكاء الصناعي على الماسح */
#scanner-container::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 255, 255, 0.1);
  border-radius: 15px;
  box-shadow: 0px 0px 20px rgba(0, 255, 255, 0.6), inset 0px 0px 10px rgba(0, 255, 255, 0.3);
  animation: scannerLight 1.5s infinite ease-in-out;
}

/* تأثير مسح بالضوء */
@keyframes scannerLight {
  0% {
    background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.3), transparent);
    opacity: 0;
  }
  50% {
    opacity: 1;
  }
  100% {
    background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.1), transparent);
    opacity: 0;
  }
}

/* تحسين شكل الأزرار */
button {
  font-size: 16px;
  padding: 10px 20px;
  color: #ffffff;
  background: linear-gradient(145deg, #2196f3, #42a5f5);
  border: none;
  border-radius: 10px;
  box-shadow: 0px 5px 15px rgba(33, 150, 243, 0.3);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

button:hover {
  transform: scale(1.1);
  box-shadow: 0px 8px 20px rgba(33, 150, 243, 0.5);
}

#scanner-container video {
  width: 100%;
  height: auto;
  border-radius: 15px;
  opacity: 0.9;
}

/* Input and Button Styles */
input[type="text"] {
  width: 100%;
  max-width: 100%; /* لضمان أن العرض لا يتجاوز العرض الكامل */
  padding: 12px;
  font-size: 18px;
  border: 2px solid #ff0000cd;
  border-radius: 10px;
  margin-top: 20px;
  outline: none;
  transition: border 0.3s ease, box-shadow 0.3s ease;
  box-sizing: border-box; /* لتضمين الحدود والمسافات الداخلية ضمن العرض الكلي */
}

/* تحسين التوافق مع الأجهزة المحمولة */
@media (max-width: 768px) {
  input[type="text"] {
    font-size: 16px; /* تصغير الخط في الشاشات الصغيرة */
    padding: 10px; /* تقليل المسافات الداخلية لتناسب الشاشة الصغيرة */
  }
}

input[type="text"]:focus {
  border-color: #ff9900;
  box-shadow: 0 0 10px rgba(255, 136, 0, 0.5);
}

button {
  margin-top: 20px;
  padding: 14px 40px;
  font-size: 18px;
  font-weight: bold;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: 2px;
  text-shadow: 
    0 0 5px #fff, 
    0 0 10px #ffae00, 
    0 0 20px #ff5700, 
    0 0 30px #0056b3, 
    0 0 40px #0056b3, 
    0 0 50px #ff5700, 
    0 0 60px #ffae00;
  background: linear-gradient(90deg, #ffae00, #ff5700, #ffae00, #ffae00);
  background-size: 300% 300%;
  border: none;
  border-radius: 15px;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(255, 87, 0, 0.3), inset 0 0 10px rgba(255, 255, 255, 0.5);
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
  animation: rotateColors 3s linear infinite, glowing 2s infinite ease-in-out;
}

@keyframes rotateColors {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

@keyframes glowing {
  0% {
    box-shadow: 0 0 10px rgba(255, 87, 0, 0.5), 0 0 20px rgba(255, 87, 0, 0.4), 0 0 30px rgba(255, 87, 0, 0.3);
  }
  50% {
    box-shadow: 0 0 20px rgba(255, 87, 0, 0.7), 0 0 40px rgba(255, 87, 0, 0.6), 0 0 60px rgba(255, 87, 0, 0.5);
  }
  100% {
    box-shadow: 0 0 10px rgba(255, 87, 0, 0.5), 0 0 20px rgba(255, 87, 0, 0.4), 0 0 30px rgba(255, 87, 0, 0.3);
  }
}

button::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 300%;
  height: 300%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0) 70%);
  transform: translate(-50%, -50%) scale(0);
  transition: transform 0.5s ease;
  opacity: 0.5;
  z-index: 1;
}

button:hover::before {
  transform: translate(-50%, -50%) scale(1);
}

button:hover {
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 8px 25px rgba(255, 87, 0, 0.5), 0 0 40px rgba(255, 87, 0, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.7);
}

button:active {
  transform: translateY(-1px) scale(0.98);
  box-shadow: 0 3px 10px rgba(255, 87, 0, 0.5), 0 0 20px rgba(255, 87, 0, 0.6), inset 0 0 5px rgba(255, 255, 255, 0.4);
}

button:disabled {
  background-color: #aaa;
  cursor: not-allowed;
}

/* Submit Button Style */
input[type="submit"] {
  width: 90%;
  padding: 12px 0;
  font-size: 18px;
  color: white;
  background-color: #fa0202b8;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: background-color 0.3s ease;
  margin-top: 20px;
}

input[type="submit"]:hover {
  background-color: #047bca;
  transform: translateY(-3px);
}

input[type="submit"]:disabled {
  background-color: #aaa;
  cursor: not-allowed;
}

/* Status Message */
#status-message {
  margin-top: 10px;
  font-weight: bold;
}

.success {
  color: #28a745;
}

.error {
  color: #dc3545;
}

/* Responsive Design */
@media screen and (max-width: 768px) {
  .container {
    padding: 15px;
  }

  h1 {
  font-size: 1.2rem;
  text-align: center; /* لمحاذاة النص أفقيًا */
  display: flex; /* استخدام flexbox */
  align-items: center; /* محاذاة النص عموديًا */
  justify-content: center; /* محاذاة النص في المنتصف أفقياً وعمودياً */

  }
}

/* Popup Styles */
.popup {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #fff;
  border-radius: 16px;
  padding: 30px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
  z-index: 9999;
  width: 400px;
  animation: popupAnimation 0.5s ease-out;
  overflow: hidden;
}

@keyframes popupAnimation {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.8);
  }
  100% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}

/* Content Frame */
.popup .content-frame {
  border: 2px solid #ddd;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  background: linear-gradient(145deg, #ffffff, #f3f3f3);
  box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.1), -5px -5px 15px rgba(255, 255, 255, 0.9);
}

/* Heading Styles */
.popup h2 {
  font-size: 1.8rem;
  color: #333;
  font-weight: bold;
  margin-bottom: 15px;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 1px;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
}

/* Detail Box */
.detail-box {
  font-size: 1.1rem;
  color: #444;
  margin-bottom: 15px;
  text-align: center;
  line-height: 1.6;
}

/* Price Frame */
.price-frame {
  border: 3px solid #2196F3;
  border-radius: 12px;
  padding: 15px;
  background: linear-gradient(145deg, #2196F3, #1e88e5);
  box-shadow: 0 8px 15px rgba(33, 150, 243, 0.5), inset 0 2px 10px rgba(255, 255, 255, 0.3);
  text-align: center;
  margin-top: 15px;
}

.price-frame .price {
  font-size: 2rem;
  font-weight: bold;
  color: #fff;
  text-shadow: 0 0 15px rgba(33, 150, 243, 0.8), 0 0 20px rgba(0, 100, 255, 0.5);
}

/* Barcode Frame */
.barcode-frame {
  border: 2px solid #4CAF50;
  border-radius: 12px;
  padding: 15px;
  background: linear-gradient(145deg, #e8f5e9, #c8e6c9);
  box-shadow: 0 8px 15px rgba(76, 175, 80, 0.4), inset 0 2px 5px rgba(255, 255, 255, 0.5);
  margin-top: 20px;
  text-align: center;
}

.barcode-frame img {
  width: 100%;
  max-width: 250px;
  display: block;
  margin: 0 auto;
  filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.2));
}

/* Close Button */
.close-btn {
  background: linear-gradient(145deg, #FF5722, #E64A19);
  color: white;
  border: none;
  border-radius: 12px;
  padding: 12px 25px;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2), inset 0 2px 5px rgba(255, 255, 255, 0.3);
  margin-top: 20px;
  display: block;
  width: 100%;
  text-transform: uppercase;
}

.close-btn:hover {
  background: linear-gradient(145deg, #E64A19, #FF5722);
  transform: scale(1.05);
  box-shadow: 0 6px 15px rgba(255, 87, 34, 0.4);
}

.close-btn:active {
  transform: scale(0.98);
}

/* Mobile Responsiveness */
@media (max-width: 768px) {
  .popup {
    width: 90%;
    padding: 20px;
    text-align: center; /* توسيط النصوص داخل الحاوية */
  }

  .popup h2 {
    font-size: 1.5rem;
    text-align: center; /* توسيط العنوان */
  }

  .detail-box {
    font-size: 1rem;
    text-align: center; /* توسيط النصوص */
  }

  .price-frame .price {
    font-size: 1.4rem;
    text-align: center; /* توسيط النص */
  }

  .barcode-frame img {
    max-width: 200px;
    display: block; /* لجعل الصورة عنصر بلوك */
    margin: 0 auto; /* لتوسيط الصورة أفقياً */
  }

  .close-btn {
    padding: 10px 20px;
    font-size: 0.9rem;
    display: block; /* جعل الزر عنصر بلوك */
    margin: 10px auto; /* لتوسيط الزر أفقياً */
    text-align: center; /* توسيط النص داخل الزر */
  }
}
.footer {
      background-color: #01080800; /* خلفية سوداء */
      color: #fff; /* النص باللون الأبيض */
      text-align: center; /* توسيط النص */
      padding: 20px; /* مسافة داخلية من الأعلى والأسفل */
      font-family: Arial, sans-serif; /* خط النص */
      font-size: 10px; /* حجم النص */
      line-height: 1.5; /* تباعد بين الأسطر */
    }
    .footer .line {
      margin: 5px 0; /* مسافة صغيرة بين الأسطر */
    }

    #barcode-input {
    transform: translateY(-13.5px);
}
    .image-container {
    display: flex; /* استخدام Flexbox */
    justify-content: center; /* توسيط أفقي فقط */
}

.image-container img {
    width: 120px; /* حجم الصورة */
    filter: drop-shadow(0 0 5px #FFA07A); /* بداية بتوهج خفيف بلون برتقالي فاتح */
    animation: glow 5s infinite ease-in-out; /* حركة التوهج مع تحسين الأداء */
}

@keyframes glow {
    0% {
        filter: drop-shadow(0 0 5px #FFA07A); /* توهج خفيف بلون برتقالي فاتح */
    }
    10% {
        filter: drop-shadow(0 0 7px #FF8C00); /* درجة توهج 2 بلون برتقالي داكن */
    }
    20% {
        filter: drop-shadow(0 0 12px #FF7F50); /* درجة توهج 3 بلون شعاب مرجانية */
    }
    30% {
        filter: drop-shadow(0 0 16px #FF6347); /* درجة توهج 4 بلون طماطم */
    }
    40% {
        filter: drop-shadow(0 0 20px #FF4500); /* درجة توهج 5 بلون أحمر برتقالي */
    }
    50% {
        filter: drop-shadow(0 0 24px #FF0000); /* درجة توهج 6 بلون أحمر */
    }
    60% {
        filter: drop-shadow(0 0 28px #D70000); /* درجة توهج 7 بلون أحمر داكن */
    }
    70% {
        filter: drop-shadow(0 0 40px #B22222); /* درجة توهج 8 بلون حجر نار */
    }
    80% {
        filter: drop-shadow(0 0 30px #8B0000); /* درجة توهج 9 بلون أحمر غامق */
    }
    90% {
        filter: drop-shadow(0 0 20px #800000); /* درجة توهج 10 بلون بني محمر (تم تصحيح اللون هنا) */
    }
    100% {
        filter: drop-shadow(0 0 5px #FFA07A); /* العودة إلى التوهج الخفيف بلون برتقالي فاتح */
    }
}

<body>

  <div class="container">
    <h1>بحث المنتجات باستخدام الباركود</h1>

    <form id="barcode-form">
      <input type="text" id="barcode-input" placeholder=" Start Scanner أدخل الباركود يدويا أو استخدم " required>
      <input type="submit" value="بحث">
    </form>
  </div>

  <div id="zoom-control">
    <label for="zoom-slider">ضبط التكبير:</label>
    <input type="range" id="zoom-slider" min="0" max="1" step="0.01" value="0">
  </div>
  
  <div class="popup" id="result-popup">
    <h2>نتائج البحث:</h2>
    <div class="detail-box" id="product-name">
      <strong>الاسم:</strong> <span id="product-name-result">-</span>
    </div>
    <div class="price-box" id="product-price">
      <strong>السعر:</strong> <span id="product-price-result">-</span>
    </div>
    <div class="detail-box" id="product-barcode">
      <strong>الباركود:</strong> <span id="product-barcode-result">-</span>
    </div>
    <button class="close-btn" onclick="closePopup()">إغلاق</button>
  </div>

  <div id="scanner-container">
    <div id="interactive" class="viewport"></div>
  </div>

  <button id="start-scanner">✨AI Scanner</button>
  <p id="status-message"></p>

  <div class="footer">
    <div class="line">تصميم وتطوير بواسطة محمد شحادة | Designed and Developed by Mohammed Shehadeh</div>
  </div>
  
    <div class="image-container">
        <img src="https://i.imgur.com/UxQBHtU.png" alt="Wolf Logo">
    </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <script>
    const barcodeInput = document.getElementById('barcode-input');
    const popup = document.getElementById('result-popup');
    const startScannerButton = document.getElementById('start-scanner');
    const statusMessage = document.getElementById('status-message');
    const scannerContainer = document.getElementById('scanner-container');
    const form = document.getElementById('barcode-form');
  
    let lastReadValues = [];
    let isProcessing = false;
    let scannerActive = false;
  
    document.addEventListener('DOMContentLoaded', () => {
      scannerContainer.style.display = 'none'; // إخفاء واجهة الماسح عند تحميل الصفحة
    });
  
// بدء الماسح
function startScanner() {
    startScannerButton.disabled = true;
    statusMessage.textContent = '';

    scannerContainer.style.display = 'block';

    // دالة لاختيار أفضل كاميرا متاحة باستخدام enumerateDevices
    function configureCamera() {
        return navigator.mediaDevices.enumerateDevices().then(devices => {
            let videoDevices = devices.filter(device => device.kind === 'videoinput');
            // إعدادات القيود الافتراضية
            let constraints = {
                facingMode: 'environment',
                width: { ideal: 1920 },
                height: { ideal: 1080 },
                aspectRatio: { ideal: 16 / 9 },
                advanced: [
                    { focusMode: 'continuous' },
                    { torch: true }
                ]
            };

            // إذا كان هناك أكثر من كاميرا، نجرب اختيار الكاميرا الأخيرة (قد تكون عدسة الزوم)
            if (videoDevices.length > 1) {
                constraints.deviceId = { exact: videoDevices[videoDevices.length - 1].deviceId };
            }
            return constraints;
        });
    }

    // دالة لضبط التكبير بناءً على القيمة المحددة يدويًا من المستخدم
    async function setZoom(videoTrack, zoomValue) {
        const capabilities = videoTrack.getCapabilities();
        if (capabilities.zoom) {
            // التأكد من أن القيمة المطلوبة ضمن حدود التكبير
            const clampedZoom = Math.min(Math.max(zoomValue, capabilities.zoom.min), capabilities.zoom.max);
            try {
                await videoTrack.applyConstraints({ advanced: [{ zoom: clampedZoom }] });
                console.log(`تم ضبط التكبير على: ${clampedZoom}`);
            } catch (err) {
                console.error("فشل ضبط التكبير:", err);
            }
        } else {
            console.warn("خاصية التكبير غير مدعومة من هذه الكاميرا.");
        }
    }

    // دالة لمراقبة جودة الصورة (تم الاحتفاظ بها دون تعديل التكبير تلقائيًا)
    function monitorVideoQuality(videoTrack) {
        const videoElement = document.querySelector('#interactive video');
        if (!videoElement) return;
        function analyzeFrame() {
            if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
                // يمكن تطوير هذه الدالة لتحليل وضوح الصورة
                // في هذا المثال لا يتم تغيير الزوم تلقائيًا
            }
            setTimeout(analyzeFrame, 1000);
        }
        analyzeFrame();
    }

    // دالة لإعادة تشغيل الماسح في حالة توقف الكاميرا
    function restartScanner() {
        Quagga.stop();
        setTimeout(startScanner, 500);
    }

    configureCamera().then(constraints => {
        Quagga.init(
            {
                inputStream: {
                    name: 'Live',
                    type: 'LiveStream',
                    target: document.querySelector('#interactive'),
                    constraints: constraints,
                },
                locator: {
                    patchSize: 'medium', // تقليل حجم الرقع لتحسين الأداء
                    halfSample: true,    // تحسين الأداء باستخدام نصف الدقة
                },
                decoder: {
                    readers: ['code_128_reader', 'ean_reader', 'ean_8_reader'],
                    multiple: false, // تعطيل قراءة متعددة لتقليل الالتباس
                },
                locate: true,
                numOfWorkers: navigator.hardwareConcurrency || 4, // ضبط عدد العمال بناءً على الجهاز
                frequency: 10, // تقليل التردد لتحسين الأداء
            },
            function (err) {
                if (err) {
                    console.error('Error initializing Quagga:', err);
                    statusMessage.textContent = 'خطأ في تشغيل الماسح.';
                    startScannerButton.disabled = false;
                    return;
                }
                Quagga.start();
                scannerActive = true;

                // محاولة الحصول على التيار (stream) وتحليل جودة الفيديو
                const videoElement = document.querySelector('#interactive video');
                if (videoElement && videoElement.srcObject) {
                    const videoTrack = videoElement.srcObject.getVideoTracks()[0];
                    monitorVideoQuality(videoTrack);

                    // إضافة مستمع لتغيير التكبير يدويًا من شريط التمرير
                    const zoomSlider = document.getElementById('zoom-slider');
                    if (zoomSlider) {
                        // ضبط قيمة الشريط بناءً على الحد الأدنى للتكبير
                        const capabilities = videoTrack.getCapabilities();
                        zoomSlider.min = capabilities.zoom ? capabilities.zoom.min : 0;
                        zoomSlider.max = capabilities.zoom ? capabilities.zoom.max : 1;
                        zoomSlider.step = capabilities.zoom ? 0.01 : 0.01;
                        zoomSlider.value = videoTrack.getSettings().zoom || capabilities.zoom.min;

                        zoomSlider.addEventListener('input', () => {
                            const zoomValue = parseFloat(zoomSlider.value);
                            setZoom(videoTrack, zoomValue);
                        });
                    }
                }
            }
        );

        Quagga.onDetected(function (data) {
            const code = data.codeResult.code;
            if (isValidBarcode(code)) {
                processBarcode(code);
            } else {
                console.warn('Invalid barcode detected, attempting OCR.');
                readBarcodeWithOCR();
            }
        });

        // إعادة التشغيل التلقائي عند توقف الكاميرا أو اختفاء الإشارة
        Quagga.onProcessed(function (result) {
            if (!result || !result.boxes) {
                restartScanner();
            }
        });
    });
}


// التحقق من صحة الباركود
function isValidBarcode(code) {
    if (!code) return false;

    // استخدام خوارزمية checksum إذا كان الباركود يحتوي على معيار يدعم ذلك
    if (code.length === 13 && !isValidEAN13Checksum(code)) return false;

    lastReadValues.push(code);
    if (lastReadValues.length > 3) lastReadValues.shift();

    return lastReadValues.every((val) => val === code);
}

function isValidEAN13Checksum(code) {
    let sum = 0;
    for (let i = 0; i < 12; i++) {
        sum += (i % 2 === 0 ? 1 : 3) * parseInt(code[i]);
    }
    const checksum = (10 - (sum % 10)) % 10;
    return checksum === parseInt(code[12]);
}

// معالجة الباركود
function processBarcode(code) {
    if (isProcessing) return;
    isProcessing = true;

    // تأكيد أن الحقل فارغ أو يحتوي على قيمة مختلفة قبل التحديث
    if (barcodeInput.value !== code) {
        barcodeInput.value = code; // إدخال الباركود في الحقل
    }

    // عرض رسالة حالة للمستخدم
    statusMessage.textContent = `باركود مكتشف: ${code}`;

    // تنفيذ الضغط على زر البحث تلقائيًا بعد تأخير قصير لتجنب التكرار
    setTimeout(() => {
        stopScanner(); // إيقاف الماسح
        if (form.querySelector('input[type="submit"]')) {
            form.querySelector('input[type="submit"]').click();
        } else {
            console.error('زر الإرسال غير موجود في النموذج.');
        }
        statusMessage.textContent = ''; // إعادة تعيين رسالة الحالة
        isProcessing = false;
    }, 300);
}

// التحقق من صحة الباركود
function isValidBarcode(code) {
    if (!code) return false;

    // تحقق من أن الباركود كامل وغير مغطى
    if (!isCompleteBarcode(code)) {
        console.warn('الباركود غير مكتمل أو مغطى');
        return false;
    }

    // استخدام خوارزمية checksum إذا كان الباركود يحتوي على معيار يدعم ذلك
    if (code.length === 13 && !isValidEAN13Checksum(code)) return false;

    lastReadValues.push(code);
    if (lastReadValues.length > 3) lastReadValues.shift();

    return lastReadValues.every((val) => val === code);
}

// التحقق من أن الباركود كامل وغير مغطى
function isCompleteBarcode(code) {
    // تحقق من أن الباركود يحتوي على الحد الأدنى من الطول
    const minLength = 8; // الطول الأدنى المسموح به للباركود
    const maxLength = 13; // الطول الأقصى للباركود (مثال ل EAN-13)
    
    if (code.length < minLength || code.length > maxLength) {
        return false; // الباركود غير مكتمل أو غير صحيح
    }

    // هنا يمكنك إضافة فحص آخر مثل التحقق من جودة الصورة أو فحص الرموز المشوهة إذا كان لديك معالجة أكثر تقدمًا
    return true;
}

function isValidEAN13Checksum(code) {
    let sum = 0;
    for (let i = 0; i < 12; i++) {
        sum += (i % 2 === 0 ? 1 : 3) * parseInt(code[i]);
    }
    const checksum = (10 - (sum % 10)) % 10;
    return checksum === parseInt(code[12]);
}

    isProcessing = true;

    // تأكيد أن الحقل فارغ أو يحتوي على قيمة مختلفة قبل التحديث

    }

    statusMessage.textContent = `باركود مكتشف: ${code}`;

            form.querySelector('input[type="submit"]').click();
        } else {
            console.error('زر الإرسال غير موجود في النموذج.');
        }
        statusMessage.textContent = ''; // إعادة تعيين رسالة الحالة
        isProcessing = false;
    }, 300);
}
function stopScanner() {
    if (scannerActive) {
        Quagga.stop();
        scannerActive = false;
        lastReadValues = [];
        startScannerButton.disabled = false;
    }
}
// قراءة النصوص أسفل الباركود باستخدام Tesseract.js
function readBarcodeWithOCR() {
    const videoElement = document.querySelector('#interactive video');
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    const width = videoElement.videoWidth;
    const height = videoElement.videoHeight;

    canvas.width = width;
    canvas.height = height;

    // رسم الإطار الحالي للكاميرا على الـ canvas
    context.drawImage(videoElement, 0, 0, width, height);

    // استخدام Tesseract.js لقراءة النصوص من الصورة
    Tesseract.recognize(
        canvas.toDataURL(),
        'eng', // تحديد اللغة (يمكنك إضافة المزيد من اللغات هنا)
        {
            logger: (m) => console.log(m), // لعرض التقدم
        }
    ).then(({ data: { text } }) => {
        const extractedText = text.replace(/\s+/g, '').trim();
        if (extractedText) {
            // إضافة الرقم المستخرج في حال وجوده
            console.log('النص المستخرج باستخدام OCR:', extractedText);
            if (isValidBarcode(extractedText)) {
                processBarcode(extractedText); // إذا كان النص المستخرج هو باركود صحيح، يعالجونه
            }
        }
    });
}

// البحث عن المنتج
form.addEventListener('submit', function (e) {
    e.preventDefault();
    const barcodeValue = barcodeInput.value.trim();
    if (!barcodeValue) {
        alert('الرجاء إدخال الباركود.');
        return;
    }

    fetch('test.txt')
        .then((response) => {
            if (!response.ok) {
                throw new Error('فشل تحميل ملف البيانات.');
            }
            return response.text();
        })
        .then((data) => {
            const lines = data.split('\n');
            let found = false;

            for (let line of lines) {
                const [productName, productPrice, barcode] = line.split('/');
                if (barcode && barcode.trim() === barcodeValue) {
                    document.getElementById('product-name-result').textContent = productName;
                    document.getElementById('product-price-result').textContent = productPrice;
                    document.getElementById('product-barcode-result').textContent = barcode;
                    found = true;
                    break;
                }
            }

            if (!found) {
                document.getElementById('product-name-result').textContent = 'المنتج غير موجود';
                document.getElementById('product-price-result').textContent = '-';
                document.getElementById('product-barcode-result').textContent = '-';
            }

            openPopup();
            scannerContainer.style.display = 'none'; // إخفاء واجهة الماسح بعد البحث
        })
        .catch((error) => {
            alert(error.message);
        });
});
