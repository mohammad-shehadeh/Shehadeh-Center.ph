<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode Scanner and Search</title>
  <style>
/* General Styling */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f5f5f5;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
}

/* Scanner Container */
#scanner-container {
  position: relative;
  width: 100%;
  max-width: 600px;
  margin: 20px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
  background: #fff;
}

#scanner-container video {
  width: 100%;
  height: auto;
  border-radius: 12px;
}

/* Form Container */
.container {
  width: 100%;
  max-width: 600px;
  margin-top: 20px;
  padding: 20px;
  background-color: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

h1 {
  color: #007BFF;
  font-size: 24px;
  margin-bottom: 20px;
}

form {
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
}

input[type="text"] {
  width: 70%;
  padding: 12px;
  font-size: 18px;
  border-radius: 8px;
  border: 2px solid #007BFF;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  outline: none;
  transition: border 0.3s ease;
}

input[type="text"]:focus {
  border-color: #0056b3;
}

input[type="submit"] {
  padding: 12px 24px;
  font-size: 16px;
  color: white;
  background-color: #007BFF;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

input[type="submit"]:hover {
  background-color: #0056b3;
}

/* Button Styling */
#start-scanner {
  padding: 15px 40px;
  font-size: 18px;
  font-weight: bold;
  color: #fff;
  background-color: #4CAF50;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
  transition: all 0.3s ease;
  margin-top: 20px; /* Add margin to push it down */
}

#start-scanner:hover {
  background-color: #45a049;
  transform: scale(1.05);
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
}

#start-scanner:active {
  background-color: #388e3c;
  transform: scale(0.98);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

/* Popup Styling */
.popup {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #fff;
  border-radius: 12px;
  padding: 30px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  max-width: 400px;
  width: 100%;
}

.popup h2 {
  margin: 0 0 20px;
  font-size: 24px;
  color: #333;
}

.detail-box {
  margin-bottom: 15px;
  font-size: 18px;
  text-align: left;
  color: #555;
}

.close-btn {
  background: #f44336;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 12px 20px;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.close-btn:hover {
  background: #d32f2f;
}

/* Status message Styling */
#status-message {
  margin-top: 15px;
  font-weight: bold;
  font-size: 18px;
  color: #28a745;
}

.error {
  color: #dc3545;
}

/* Responsive Styling */
@media (max-width: 768px) {
  h1 {
    font-size: 20px;
  }

  input[type="text"] {
    width: 60%;
  }

  .container {
    padding: 15px;
  }

  .popup {
    width: 80%;
  }
}
    
  </style>
</head>
<body>

  <div id="scanner-container">
    <div id="interactive" class="viewport"></div>
  </div>

  <div class="container">
    <h1>بحث المنتجات باستخدام الباركود</h1>

    <form id="barcode-form">
      <input type="text" id="barcode-input" placeholder="أدخل الباركود" required>
      <input type="submit" value="بحث">
    </form>
    <div id="status-message" class="error">الرجاء إدخال الباركود للبحث</div>
  </div>

  <div class="popup" id="result-popup">
    <h2>نتائج البحث:</h2>
    <div class="detail-box" id="product-name">
      <strong>الاسم:</strong> <span id="product-name-result">-</span>
    </div>
    <div class="price-box" id="product-price">
      <strong>السعر:</strong> <span id="product-price-result">-</span>
    </div>
    <div class="detail-box" id="product-barcode">
      <strong>الباركود:</strong> <span id="product-barcode-result">-</span>
    </div>
    <button class="close-btn" onclick="closePopup()">إغلاق</button>
  </div>

  <button id="start-scanner">Start Scanner</button>
  <p id="status-message"></p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <script>
    const barcodeInput = document.getElementById('barcode-input');
    const popup = document.getElementById('result-popup');
    const startScannerButton = document.getElementById('start-scanner');
    const statusMessage = document.getElementById('status-message');
    const scannerContainer = document.getElementById('scanner-container'); // العنصر الذي يحتوي على الفيديو
    const form = document.getElementById('barcode-form');
  
    let lastReadValues = [];
    let isProcessing = false;
    let scannerActive = false;
  
    // إخفاء واجهة الماسح عند تحميل الصفحة
    document.addEventListener('DOMContentLoaded', () => {
      barcodeInput.focus();
      scannerContainer.style.display = 'none'; // إخفاء واجهة الماسح عند تحميل الصفحة
    });
  
    // بدء الماسح
    function startScanner() {
      startScannerButton.disabled = true;
      statusMessage.textContent = '';
  
      // إظهار واجهة الماسح (scanner-container) عند بدء القراءة
      scannerContainer.style.display = 'block';
  
      Quagga.init(
        {
          inputStream: {
            name: 'Live',
            type: 'LiveStream',
            target: document.querySelector('#interactive'),
            constraints: {
              facingMode: 'environment',
              width: { ideal: 1920 },
              height: { ideal: 1080 },
              aspectRatio: { ideal: 16 / 9 },
              advanced: [{ focusMode: 'continuous' }],
            },
          },
          decoder: {
            readers: ['code_128_reader', 'ean_reader', 'ean_8_reader'],
          },
          locate: true,
          numOfWorkers: navigator.hardwareConcurrency || 4,
          frequency: 10,
        },
        function (err) {
          if (err) {
            console.error('Error initializing Quagga:', err);
            statusMessage.textContent = 'خطأ في تشغيل الماسح.';
            startScannerButton.disabled = false;
            return;
          }
          Quagga.start();
          scannerActive = true;
        }
      );
  
      Quagga.onDetected(function (data) {
        const code = data.codeResult.code;
        if (isValidBarcode(code)) {
          processBarcode(code);
        }
      });
    }
  
    // التحقق من صحة الباركود
    function isValidBarcode(code) {
      if (!code) return false;
  
      lastReadValues.push(code);
      if (lastReadValues.length > 3) lastReadValues.shift();
  
      return lastReadValues.every((val) => val === code);
    }
  
    // معالجة الباركود
    function processBarcode(code) {
      if (isProcessing) return;
      isProcessing = true;
  
      setTimeout(() => {
        barcodeInput.value = code; // إدخال الباركود في الحقل
        stopScanner();
        form.querySelector('input[type="submit"]').click(); // تنفيذ الضغط على زر البحث تلقائيًا
        isProcessing = false;
      }, 500);
    }
  
    // إيقاف الماسح
    function stopScanner() {
      if (scannerActive) {
        Quagga.stop();
        scannerActive = false;
        lastReadValues = [];
        startScannerButton.disabled = false;
      }
    }
  
    // البحث عن المنتج
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const barcodeValue = barcodeInput.value.trim();
      if (!barcodeValue) {
        alert('الرجاء إدخال الباركود.');
        return;
      }
  
      fetch('test.txt')
        .then((response) => {
          if (!response.ok) {
            throw new Error('فشل تحميل ملف البيانات.');
          }
          return response.text();
        })
        .then((data) => {
          const lines = data.split('\n');
          let found = false;
  
          for (let line of lines) {
            const [productName, productPrice, barcode] = line.split('/');
            if (barcode && barcode.trim() === barcodeValue) {
              document.getElementById('product-name-result').textContent = productName;
              document.getElementById('product-price-result').textContent = productPrice;
              document.getElementById('product-barcode-result').textContent = barcode;
              found = true;
              break;
            }
          }
  
          if (!found) {
            document.getElementById('product-name-result').textContent = 'المنتج غير موجود';
            document.getElementById('product-price-result').textContent = '-';
            document.getElementById('product-barcode-result').textContent = '-';
          }
  
          openPopup();
          scannerContainer.style.display = 'none'; // إخفاء واجهة الماسح بعد البحث
        })
        .catch((error) => {
          alert(error.message);
        });
    });
  
    // عرض النافذة المنبثقة
    function openPopup() {
      popup.style.display = 'block';
    }
  
    // إغلاق النافذة المنبثقة
    function closePopup() {
      popup.style.display = 'none';
      barcodeInput.focus();
    }
  
    // إضافة مستمع لزر بدء الماسح
    startScannerButton.addEventListener('click', startScanner);
  </script>
    </body>
</html>
