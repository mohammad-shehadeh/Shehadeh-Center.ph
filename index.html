<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الأصناف - البحث بالباركود</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #4cc9f0;
            --warning-color: #f72585;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: var(--dark-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px 0;
            text-align: center;
            border-radius: var(--border-radius);
            margin-bottom: 30px;
            box-shadow: var(--box-shadow);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .search-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background-color: white;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            margin-bottom: 30px;
        }

        .search-tabs {
            display: flex;
            border-bottom: 2px solid #eee;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 12px 25px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            color: #666;
            position: relative;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: var(--primary-color);
            font-weight: 700;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--primary-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #6c757d;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .btn-danger {
            background-color: var(--warning-color);
        }

        .btn-danger:hover {
            background-color: #d1145a;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .scanner-container {
            display: none;
            position: relative;
            margin: 20px 0;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--box-shadow);
        }

        #interactive {
            position: relative;
            width: 100%;
            height: auto;
        }

        #interactive video {
            width: 100%;
            height: auto;
            display: block;
        }

        .scanner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .scanner-frame {
            width: 80%;
            max-width: 400px;
            height: 150px;
            border: 3px solid var(--accent-color);
            border-radius: 8px;
            position: relative;
        }

        .scanner-frame::before, .scanner-frame::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: var(--accent-color);
            border-style: solid;
            border-width: 0;
        }

        .scanner-frame::before {
            top: 0;
            left: 0;
            border-top-width: 3px;
            border-left-width: 3px;
            border-top-left-radius: 5px;
        }

        .scanner-frame::after {
            top: 0;
            right: 0;
            border-top-width: 3px;
            border-right-width: 3px;
            border-top-right-radius: 5px;
        }

        .scanner-zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 20;
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.8);
            color: var(--dark-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
        }

        .zoom-btn:hover {
            background-color: white;
            transform: scale(1.1);
        }

        .status-message {
            padding: 10px;
            margin: 10px 0;
            border-radius: var(--border-radius);
            text-align: center;
            font-weight: 500;
        }

        .success {
            background-color: rgba(76, 201, 240, 0.2);
            color: #0d6efd;
        }

        .error {
            background-color: rgba(247, 37, 133, 0.2);
            color: var(--warning-color);
        }

        .result-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .popup-content {
            background-color: white;
            width: 90%;
            max-width: 500px;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: popupFadeIn 0.3s ease;
        }

        @keyframes popupFadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .popup-title {
            font-size: 1.5rem;
            color: var(--primary-color);
            font-weight: 700;
        }

        .close-popup {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
            transition: color 0.2s;
        }

        .close-popup:hover {
            color: var(--warning-color);
        }

        .product-info {
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-label {
            font-weight: 500;
            color: #555;
        }

        .info-value {
            font-weight: 600;
            color: var(--dark-color);
        }

        .product-price .info-value {
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        .not-found {
            text-align: center;
            padding: 20px;
            color: var(--warning-color);
            font-weight: 500;
        }

        .history-section {
            background-color: white;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }

        .history-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--primary-color);
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        .history-list {
            list-style: none;
        }

        .history-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
        }

        .history-item:hover {
            background-color: #f8f9fa;
        }

        .history-item-info {
            flex: 1;
        }

        .history-item-name {
            font-weight: 500;
            margin-bottom: 5px;
        }

        .history-item-details {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            color: #666;
        }

        .history-item-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .action-btn:hover {
            color: var(--primary-color);
        }

        .action-btn.delete:hover {
            color: var(--warning-color);
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .search-section {
                padding: 15px;
            }
            
            .tab-btn {
                padding: 10px 15px;
                font-size: 0.9rem;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
            
            .scanner-frame {
                width: 90%;
                height: 120px;
            }
            
            .popup-content {
                width: 95%;
                padding: 15px;
            }
            
            .info-row {
                flex-direction: column;
                gap: 5px;
            }
        }

        /* Animation for barcode scan */
        @keyframes scanAnimation {
            0% {
                top: 0;
            }
            100% {
                top: calc(100% - 4px);
            }
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: rgba(72, 149, 239, 0.8);
            box-shadow: 0 0 10px rgba(72, 149, 239, 0.8);
            animation: scanAnimation 2s infinite linear;
            z-index: 15;
        }

        /* Dark mode */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
                color: #e0e0e0;
            }
            
            .search-section, .history-section, .popup-content {
                background-color: #1e1e1e;
                color: #e0e0e0;
            }
            
            input[type="text"], input[type="number"] {
                background-color: #2d2d2d;
                color: #e0e0e0;
                border-color: #444;
            }
            
            .info-label, .tab-btn:not(.active), .action-btn {
                color: #aaa;
            }
            
            .info-value {
                color: #e0e0e0;
            }
            
            .history-item:hover {
                background-color: #2a2a2a;
            }
            
            .popup-header, .history-title {
                border-bottom-color: #444;
            }
            
            .info-row, .history-item {
                border-bottom-color: #444;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-barcode"></i> نظام إدارة الأصناف</h1>
            <p>ابحث عن الأصناف باستخدام الباركود أو اسم المنتج</p>
        </header>

        <section class="search-section">
            <div class="search-tabs">
                <button class="tab-btn active" data-tab="barcode-tab"><i class="fas fa-barcode"></i> البحث بالباركود</button>
                <button class="tab-btn" data-tab="name-tab"><i class="fas fa-search"></i> البحث بالاسم</button>
            </div>

            <div id="barcode-tab" class="tab-content active">
                <!-- محتوى تبويب الباركود -->
            </div>

            <div id="name-tab" class="tab-content">
                <!-- محتوى تبويب الاسم -->
            </div>
        </section>

        <section class="history-section">
            <h2 class="history-title"><i class="fas fa-history"></i> سجل البحث</h2>
            <ul class="history-list" id="search-history">
                <!-- سيتم ملؤه بالنتائج السابقة -->
            </ul>
        </section>
    </div>

    <div id="result-popup" class="result-popup">
        <div class="popup-content">
            <!-- محتوى البوب أب -->
        </div>
    </div>

    <!-- مكتبات JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script>
        // الكود JavaScript الأصلي الخاص بك هنا
document.addEventListener('DOMContentLoaded', function() {
    // عناصر واجهة المستخدم
    const elements = {
        tabButtons: document.querySelectorAll('.tab-btn'),
        tabContents: document.querySelectorAll('.tab-content'),
        barcodeInput: document.getElementById('barcode-input'),
        nameInput: document.getElementById('name-input'),
        popup: document.getElementById('result-popup'),
        startScannerButton: document.getElementById('start-scanner'),
        statusMessage: document.getElementById('status-message'),
        scannerContainer: document.getElementById('scanner-container'),
        barcodeForm: document.getElementById('barcode-form'),
        nameSearchForm: document.getElementById('name-search-form'),
        searchHistory: document.getElementById('search-history'),
        productInfo: document.getElementById('product-info'),
        closePopupBtn: document.getElementById('close-popup'),
        closeResultBtn: document.getElementById('close-result'),
        printResultBtn: document.getElementById('print-result'),
        zoomInBtn: document.getElementById('zoom-in-barcode'),
        zoomOutBtn: document.getElementById('zoom-out-barcode'),
        zoomResetBtn: document.getElementById('zoom-reset-barcode'),
        nameSearchResults: document.getElementById('name-search-results')
    };

    // متغيرات النظام
    const state = {
        lastReadValues: [],
        isProcessing: false,
        scannerActive: false,
        videoTrack: null,
        currentZoom: 1,
        minZoom: 1,
        maxZoom: 5,
        zoomStep: 0.5,
        searchHistoryData: JSON.parse(localStorage.getItem('searchHistory')) || []
    };

    // تهيئة التطبيق
    function init() {
        renderSearchHistory();
        setupEventListeners();
        checkCameraPermissions();
    }

    // التحقق من صلاحيات الكاميرا
    function checkCameraPermissions() {
        navigator.permissions && navigator.permissions.query({name: 'camera'})
            .then(permissionStatus => {
                permissionStatus.onchange = () => {
                    if (permissionStatus.state === 'denied') {
                        showStatusMessage('تم رفض صلاحيات الكاميرا. يرجى تعديل الإعدادات', 'error');
                    }
                };
            });
    }

    // إعداد مستمعات الأحداث
    function setupEventListeners() {
        // تبديل التبويبات
        elements.tabButtons.forEach(button => {
            button.addEventListener('click', () => switchTab(button));
        });
        
        // بدء/إيقاف الماسح الضوئي
        elements.startScannerButton.addEventListener('click', toggleScanner);
        
        // التحكم في التكبير
        elements.zoomInBtn.addEventListener('click', zoomIn);
        elements.zoomOutBtn.addEventListener('click', zoomOut);
        elements.zoomResetBtn.addEventListener('click', resetZoom);
        
        // إدارة النافذة المنبثقة
        elements.closePopupBtn.addEventListener('click', closePopup);
        elements.closeResultBtn.addEventListener('click', closePopup);
        elements.printResultBtn.addEventListener('click', printResult);
        
        // نماذج البحث
        elements.barcodeForm.addEventListener('submit', handleBarcodeSubmit);
        elements.nameSearchForm.addEventListener('submit', handleNameSearchSubmit);
        
        // إغلاق الماسح عند الضغط على ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && state.scannerActive) {
                stopScanner();
            }
        });
    }

    // تبديل التبويبات
    function switchTab(button) {
        elements.tabButtons.forEach(btn => btn.classList.remove('active'));
        elements.tabContents.forEach(content => content.classList.remove('active'));
        
        button.classList.add('active');
        const tabId = button.getAttribute('data-tab');
        document.getElementById(tabId).classList.add('active');
        
        if (state.scannerActive) {
            stopScanner();
        }
    }

    // تبديل حالة الماسح
    function toggleScanner() {
        if (state.scannerActive) {
            stopScanner();
        } else {
            startScanner();
        }
    }

    // بدء الماسح الضوئي
    async function startScanner() {
        try {
            elements.startScannerButton.disabled = true;
            showStatusMessage('جاري تهيئة الماسح الضوئي...', 'success');
            elements.scannerContainer.style.display = 'block';
            
            const constraints = {
                video: {
                    facingMode: 'environment',
                    width: { ideal: 1920 },
                    height: { ideal: 1080 },
                    aspectRatio: { ideal: 16/9 },
                    focusMode: "continuous",
                    zoom: state.currentZoom
                }
            };
            
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            const videoElement = document.querySelector('#interactive video');
            
            if (videoElement) {
                videoElement.srcObject = stream;
                state.videoTrack = stream.getVideoTracks()[0];
                setupCameraCapabilities();
                setupFocusHandlers(videoElement);
            }
            
            await initQuagga(constraints);
            state.scannerActive = true;
            showStatusMessage('الماسح الضوئي جاهز. قم بتوجيه الكاميرا نحو الباركود', 'success');
        } catch (error) {
            handleScannerError(error);
        }
    }

    // إعداد إمكانيات الكاميرا
    function setupCameraCapabilities() {
        if (state.videoTrack) {
            const capabilities = state.videoTrack.getCapabilities();
            if (capabilities.zoom) {
                state.minZoom = capabilities.zoom.min || 1;
                state.maxZoom = capabilities.zoom.max || 5;
                state.zoomStep = capabilities.zoom.step || 0.5;
            }
            updateZoomButtons();
        }
    }

    // إعداد معالجات التركيز
    function setupFocusHandlers(videoElement) {
        videoElement.addEventListener("touchstart", adjustFocus);
        videoElement.addEventListener("click", adjustFocus);
    }

    // تهيئة Quagga.js
    function initQuagga(constraints) {
        return new Promise((resolve, reject) => {
            Quagga.init({
                inputStream: {
                    name: 'Live',
                    type: 'LiveStream',
                    target: document.querySelector('#interactive'),
                    constraints: constraints.video,
                },
                locator: {
                    patchSize: 'medium',
                    halfSample: true
                },
                decoder: {
                    readers: ['code_128_reader', 'ean_reader', 'ean_8_reader', 'code_39_reader', 'code_39_vin_reader', 'codabar_reader'],
                    multiple: false
                },
                locate: true,
                numOfWorkers: navigator.hardwareConcurrency || 4,
                frequency: 10
            }, function(err) {
                if (err) {
                    reject(err);
                    return;
                }
                Quagga.start();
                setupQuaggaDetection();
                resolve();
            });
        });
    }

    // إعداد اكتشاف Quagga
    function setupQuaggaDetection() {
        Quagga.onDetected(function(data) {
            const code = data.codeResult.code;
            if (isValidBarcode(code)) {
                processBarcode(code);
            } else {
                console.warn('باركود غير صالح، جاري محاولة قراءة النص...');
                readBarcodeWithOCR();
            }
        });
    }

    // معالجة أخطاء الماسح
    function handleScannerError(error) {
        console.error('خطأ في تشغيل الماسح:', error);
        showStatusMessage('خطأ في تشغيل الماسح. يرجى التحقق من الصلاحيات', 'error');
        elements.startScannerButton.disabled = false;
        elements.scannerContainer.style.display = 'none';
    }

    // إيقاف الماسح الضوئي
    function stopScanner() {
        if (state.scannerActive) {
            Quagga.stop();
            state.scannerActive = false;
            state.lastReadValues = [];
            elements.startScannerButton.disabled = false;
            
            const videoElement = document.querySelector('#interactive video');
            if (videoElement && videoElement.srcObject) {
                videoElement.srcObject.getTracks().forEach(track => track.stop());
            }
            
            elements.scannerContainer.style.display = 'none';
            showStatusMessage('', '');
        }
    }

    // التحقق من صحة الباركود
    function isValidBarcode(code) {
        if (!code) return false;
        
        if (!isCompleteBarcode(code)) {
            console.warn('الباركود غير مكتمل أو مغطى');
            return false;
        }
        
        if (code.length === 13 && !isValidEAN13Checksum(code)) return false;
        
        state.lastReadValues.push(code);
        if (state.lastReadValues.length > 3) state.lastReadValues.shift();
        
        return state.lastReadValues.every((val) => val === code);
    }

    // التحقق من اكتمال الباركود
    function isCompleteBarcode(code) {
        const minLength = 8;
        const maxLength = 13;
        return code.length >= minLength && code.length <= maxLength;
    }

    // التحقق من checksum لـ EAN-13
    function isValidEAN13Checksum(code) {
        let sum = 0;
        for (let i = 0; i < 12; i++) {
            sum += (i % 2 === 0 ? 1 : 3) * parseInt(code[i]);
        }
        const checksum = (10 - (sum % 10)) % 10;
        return checksum === parseInt(code[12]);
    }

    // معالجة الباركود
    function processBarcode(code) {
        if (state.isProcessing) return;
        state.isProcessing = true;
        
        if (elements.barcodeInput.value !== code) {
            elements.barcodeInput.value = code;
        }
        
        showStatusMessage(`تم اكتشاف باركود: ${code}`, 'success');
        
        setTimeout(() => {
            stopScanner();
            searchProduct(code, 'barcode');
            state.isProcessing = false;
        }, 300);
    }

    // معالجة إرسال نموذج الباركود
    function handleBarcodeSubmit(e) {
        e.preventDefault();
        const barcodeValue = elements.barcodeInput.value.trim();
        if (!barcodeValue) {
            showStatusMessage('الرجاء إدخال الباركود', 'error');
            return;
        }
        searchProduct(barcodeValue, 'barcode');
    }

    // معالجة إرسال نموذج البحث بالاسم
    function handleNameSearchSubmit(e) {
        e.preventDefault();
        const nameValue = elements.nameInput.value.trim();
        if (!nameValue) {
            showStatusMessage('الرجاء إدخال اسم المنتج', 'error');
            return;
        }
        searchProduct(nameValue, 'name');
    }

    // البحث عن المنتج
    async function searchProduct(searchValue, searchType) {
        showStatusMessage('جاري البحث...', 'success');
        
        try {
            const response = await fetch('products.txt');
            if (!response.ok) throw new Error('فشل تحميل ملف البيانات');
            
            const data = await response.text();
            const products = parseProductData(data);
            const foundProducts = filterProducts(products, searchValue, searchType);
            
            if (foundProducts.length > 0) {
                if (searchType === 'barcode') {
                    displayProductInfo(foundProducts[0]);
                    addToSearchHistory(foundProducts[0]);
                } else {
                    displayNameSearchResults(foundProducts);
                }
            } else {
                if (searchType === 'barcode') {
                    displayProductInfo(null);
                } else {
                    displayNameSearchResults([]);
                }
            }
            
            showStatusMessage('', '');
        } catch (error) {
            console.error('Error:', error);
            showStatusMessage(error.message, 'error');
        }
    }

    // تحليل بيانات المنتج
    function parseProductData(data) {
        return data.split('\n').map(line => {
            const [productName, productPrice, barcode] = line.split('/').map(item => item.trim());
            return { productName, productPrice, barcode };
        });
    }

    // تصفية المنتجات حسب البحث
    function filterProducts(products, searchValue, searchType) {
        return products.filter(product => {
            if (searchType === 'barcode') {
                return product.barcode === searchValue;
            } else {
                return product.productName.toLowerCase().includes(searchValue.toLowerCase());
            }
        });
    }

    // عرض معلومات المنتج
    function displayProductInfo(product) {
        if (product) {
            elements.productInfo.innerHTML = `
                <div class="info-row product-name">
                    <span class="info-label">اسم المنتج:</span>
                    <span class="info-value">${product.productName}</span>
                </div>
                <div class="info-row product-price">
                    <span class="info-label">السعر:</span>
                    <span class="info-value">${product.productPrice} ر.س</span>
                </div>
                <div class="info-row product-barcode">
                    <span class="info-label">الباركود:</span>
                    <span class="info-value">${product.barcode}</span>
                </div>
            `;
        } else {
            elements.productInfo.innerHTML = `
                <div class="not-found">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>المنتج غير موجود في قاعدة البيانات</p>
                </div>
            `;
        }
        
        openPopup();
    }

    // عرض نتائج البحث بالاسم
    function displayNameSearchResults(products) {
        if (products.length > 0) {
            let html = '<div class="search-results-list">';
            html += `<h3>تم العثور على ${products.length} نتيجة:</h3>`;
            
            products.forEach(product => {
                html += `
                    <div class="product-result" data-barcode="${product.barcode}">
                        <h4>${product.productName}</h4>
                        <p>السعر: ${product.productPrice} ر.س | الباركود: ${product.barcode}</p>
                        <button class="btn btn-secondary view-product" style="margin-top: 5px;">عرض التفاصيل</button>
                    </div>
                `;
            });
            
            html += '</div>';
            elements.nameSearchResults.innerHTML = html;
            
            document.querySelectorAll('.view-product').forEach(button => {
                button.addEventListener('click', function() {
                    const barcode = this.closest('.product-result').getAttribute('data-barcode');
                    const product = products.find(p => p.barcode === barcode);
                    displayProductInfo(product);
                    addToSearchHistory(product);
                });
            });
        } else {
            elements.nameSearchResults.innerHTML = `
                <div class="not-found">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>لا توجد منتجات مطابقة للبحث</p>
                </div>
            `;
        }
    }

    // إضافة إلى سجل البحث
    function addToSearchHistory(product) {
        if (!product) return;
        
        const existingIndex = state.searchHistoryData.findIndex(item => item.barcode === product.barcode);
        if (existingIndex !== -1) {
            state.searchHistoryData.splice(existingIndex, 1);
        }
        
        state.searchHistoryData.unshift({
            name: product.productName,
            price: product.productPrice,
            barcode: product.barcode,
            date: new Date().toISOString()
        });
        
        if (state.searchHistoryData.length > 10) {
            state.searchHistoryData.pop();
        }
        
        localStorage.setItem('searchHistory', JSON.stringify(state.searchHistoryData));
        renderSearchHistory();
    }

    // عرض سجل البحث
    function renderSearchHistory() {
        elements.searchHistory.innerHTML = '';
        
        if (state.searchHistoryData.length === 0) {
            elements.searchHistory.innerHTML = '<li style="text-align: center; padding: 20px; color: #666;">لا توجد عمليات بحث سابقة</li>';
            return;
        }
        
        state.searchHistoryData.forEach(item => {
            const li = document.createElement('li');
            li.className = 'history-item';
            li.innerHTML = `
                <div class="history-item-info">
                    <div class="history-item-name">${item.name}</div>
                    <div class="history-item-details">
                        <span>${item.price} ر.س</span>
                        <span>${formatDate(item.date)}</span>
                        <span>${item.barcode}</span>
                    </div>
                </div>
                <div class="history-item-actions">
                    <button class="action-btn view" title="عرض"><i class="fas fa-eye"></i></button>
                    <button class="action-btn delete" title="حذف"><i class="fas fa-trash"></i></button>
                </div>
            `;
            
            li.querySelector('.view').addEventListener('click', () => {
                searchProduct(item.barcode, 'barcode');
            });
            
            li.querySelector('.delete').addEventListener('click', () => {
                deleteSearchHistoryItem(item.barcode);
            });
            
            elements.searchHistory.appendChild(li);
        });
    }

    // حذف عنصر من سجل البحث
    function deleteSearchHistoryItem(barcode) {
        state.searchHistoryData = state.searchHistoryData.filter(item => item.barcode !== barcode);
        localStorage.setItem('searchHistory', JSON.stringify(state.searchHistoryData));
        renderSearchHistory();
    }

    // التحكم في التكبير
    async function setZoom(zoomValue) {
        if (state.videoTrack) {
            try {
                await state.videoTrack.applyConstraints({
                    advanced: [{ zoom: zoomValue }]
                });
                state.currentZoom = zoomValue;
                updateZoomButtons();
            } catch (err) {
                console.error("فشل ضبط التكبير:", err);
            }
        }
    }

    function zoomIn() {
        if (state.currentZoom < state.maxZoom) {
            setZoom(Math.min(state.currentZoom + state.zoomStep, state.maxZoom));
        }
    }

    function zoomOut() {
        if (state.currentZoom > state.minZoom) {
            setZoom(Math.max(state.currentZoom - state.zoomStep, state.minZoom));
        }
    }

    function resetZoom() {
        setZoom(1);
    }

    function updateZoomButtons() {
        if (elements.zoomInBtn && elements.zoomOutBtn) {
            elements.zoomInBtn.disabled = state.currentZoom >= state.maxZoom;
            elements.zoomOutBtn.disabled = state.currentZoom <= state.minZoom;
        }
    }

    // ضبط التركيز
    async function adjustFocus(event) {
        if (state.videoTrack) {
            try {
                const rect = event.target.getBoundingClientRect();
                const x = (event.clientX - rect.left) / rect.width;
                const y = (event.clientY - rect.top) / rect.height;

                await state.videoTrack.applyConstraints({
                    advanced: [{ focusMode: "manual", focusPointX: x, focusPointY: y }]
                });
            } catch (err) {
                console.error("فشل ضبط التركيز:", err);
            }
        }
    }

    // قراءة النص باستخدام OCR
    function readBarcodeWithOCR() {
        const videoElement = document.querySelector('#interactive video');
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        const width = videoElement.videoWidth;
        const height = videoElement.videoHeight;
        
        canvas.width = width;
        canvas.height = height;
        context.drawImage(videoElement, 0, 0, width, height);
        
        showStatusMessage('جاري قراءة النص...', 'success');
        
        Tesseract.recognize(
            canvas.toDataURL(),
            'eng',
            { logger: m => console.log(m) }
        ).then(({ data: { text } }) => {
            const extractedText = text.replace(/\s+/g, '').trim();
            if (extractedText) {
                console.log('النص المستخرج:', extractedText);
                if (isValidBarcode(extractedText)) {
                    processBarcode(extractedText);
                } else {
                    showStatusMessage('تعذر قراءة الباركود. يرجى المحاولة مرة أخرى', 'error');
                }
            }
        }).catch(err => {
            console.error('خطأ في OCR:', err);
            showStatusMessage('خطأ في قراءة النص', 'error');
        });
    }

    // تنسيق التاريخ
    function formatDate(isoString) {
        const date = new Date(isoString);
        return date.toLocaleString('ar-SA');
    }

    // عرض رسالة الحالة
    function showStatusMessage(message, type) {
        elements.statusMessage.textContent = message;
        elements.statusMessage.className = 'status-message';
        if (type) {
            elements.statusMessage.classList.add(type);
        }
    }

    // فتح النافذة المنبثقة
    function openPopup() {
        elements.popup.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    // إغلاق النافذة المنبثقة
    function closePopup() {
        elements.popup.style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    // طباعة النتيجة
    function printResult() {
        const printContent = `
            <div style="font-family: 'Tajawal', sans-serif; text-align: right; direction: rtl; padding: 20px;">
                <h2 style="color: #4361ee; border-bottom: 2px solid #4361ee; padding-bottom: 10px; margin-bottom: 20px;">
                    تفاصيل المنتج
                </h2>
                ${elements.productInfo.innerHTML}
                <p style="margin-top: 30px; font-size: 12px; color: #666; text-align: left;">
                    تم الطباعة في ${new Date().toLocaleString('ar-SA')}
                </p>
            </div>
        `;

        const printWindow = window.open('', '_blank');
        printWindow.document.write(`
            <html>
                <head>
                    <title>طباعة تفاصيل المنتج</title>
                    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
                    <style>
                        body { margin: 0; padding: 0; }
                        @media print {
                            @page { size: auto; margin: 10mm; }
                        }
                    </style>
                </head>
                <body>
                    ${printContent}
                    <script>
                        window.onload = function() {
                            setTimeout(function() {
                                window.print();
                                window.close();
                            }, 200);
                        };
                    </script>
                </body>
            </html>

</script>
