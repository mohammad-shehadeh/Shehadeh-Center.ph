<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بحث المنتجات باستخدام الباركود</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            margin: 0;
            padding: 0;
            color: #fff;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background-color: #ffffff;
            color: #333;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #0984e3;
        }
        input[type="text"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
        }
        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #0984e3;
            border: none;
            color: #fff;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        input[type="submit"]:hover {
            background-color: #74b9ff;
        }
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #fff;
            color: #333;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            text-align: left;
            z-index: 1000;
            display: none;
        }
        .popup h2 {
            margin: 0 0 10px;
            color: #0984e3;
        }
        .detail-box {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: #f4f4f4;
            color: #333;
            font-size: 16px;
        }
        .price-box {
            margin: 10px 0;
            padding: 15px;
            border: 2px solid #0984e3;
            border-radius: 6px;
            background-color: #dfe6e9;
            color: #333;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
        .popup .close-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #0984e3;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .popup .close-btn:hover {
            background-color: #74b9ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>بحث المنتجات باستخدام الباركود</h1>

        <!-- نموذج البحث عن المنتج -->
        <form id="barcode-form">
            <input type="text" id="barcode-input" placeholder="أدخل الباركود" required>
            <input type="submit" value="بحث">
        </form>
    </div>

    <!-- النافذة المنبثقة -->
    <div class="popup" id="result-popup">
        <h2>نتائج البحث:</h2>
        <div class="detail-box" id="product-name">الاسم: -</div>
        <div class="price-box" id="product-price">السعر: -</div>
        <div class="detail-box" id="product-barcode">الباركود: -</div>
        <button class="close-btn" onclick="closePopup()">إغلاق</button>
    </div>

    <script>
        const barcodeInput = document.getElementById('barcode-input');
        const popup = document.getElementById('result-popup');

        // تركيز المؤشر على حقل الإدخال دائمًا
        function focusBarcodeInput() {
            barcodeInput.focus();
        }
        document.addEventListener('DOMContentLoaded', focusBarcodeInput);
        document.body.addEventListener('click', focusBarcodeInput);

        // البحث عن المنتج
        document.getElementById('barcode-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const barcodeValue = barcodeInput.value.trim();

            if (!barcodeValue) {
                alert("الرجاء إدخال الباركود.");
                return;
            }

            // قراءة ملف البيانات
            fetch('test.txt')
                .then(response => {
                    if (!response.ok) {
                        throw new Error("فشل تحميل ملف البيانات.");
                    }
                    return response.text();
                })
                .then(data => {
                    const lines = data.split('\n');
                    let found = false;

                    for (let line of lines) {
                        const [productName, productPrice, barcode] = line.split('/');
                        if (barcode && barcode.trim() === barcodeValue) {
                            document.getElementById('product-name').textContent = `الاسم: ${productName}`;
                            document.getElementById('product-price').textContent = `السعر: ${productPrice}`;
                            document.getElementById('product-barcode').textContent = `الباركود: ${barcode}`;
                            found = true;
                            break;
                        }
                    }

                    if (!found) {
                        document.getElementById('product-name').textContent = 'الاسم: المنتج غير موجود';
                        document.getElementById('product-price').textContent = 'السعر: -';
                        document.getElementById('product-barcode').textContent = 'الباركود: -';
                    }

                    barcodeInput.value = '';
                    openPopup();
                })
                .catch(error => {
                    alert(error.message);
                });
        });

        // فتح النافذة المنبثقة
        function openPopup() {
            popup.style.display = 'block';
        }

        // إغلاق النافذة المنبثقة
        function closePopup() {
            popup.style.display = 'none';
            focusBarcodeInput();
        }
    </script>

</body>
</html>
