<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بحث المنتجات باستخدام الباركود</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        input[type="text"], input[type="submit"] {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .error {
            color: red;
            font-weight: bold;
            text-align: center;
        }
        #product-details {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>بحث المنتجات باستخدام الباركود</h1>

        <!-- نموذج البحث عن المنتج -->
        <form id="barcode-form">
            <input type="text" id="barcode-input" placeholder="أدخل الباركود" required>
            <input type="submit" value="بحث">
        </form>

        <!-- عرض تفاصيل المنتج -->
        <div id="product-details">
            <h2>تفاصيل المنتج:</h2>
            <p id="product-name">الاسم: -</p>
            <p id="product-price">السعر: -</p>
            <p id="product-barcode">الباركود: -</p>
        </div>

        <!-- رسائل الخطأ -->
        <div id="error-message" class="error" style="display:none;"></div>
    </div>

    <script>
        document.getElementById('barcode-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const barcodeInput = document.getElementById('barcode-input').value.trim();
            const errorMessage = document.getElementById('error-message');
            errorMessage.style.display = 'none';

            if (!barcodeInput) {
                errorMessage.textContent = "الرجاء إدخال الباركود.";
                errorMessage.style.display = 'block';
                return;
            }

            // قراءة ملف البيانات
            fetch('test.txt')
                .then(response => {
                    if (!response.ok) {
                        throw new Error("فشل تحميل ملف البيانات.");
                    }
                    return response.text();
                })
                .then(data => {
                    const lines = data.split('\n');
                    let found = false;

                    // البحث عن المنتج باستخدام الباركود
                    for (let line of lines) {
                        const [productName, productPrice, barcode] = line.split('/');
                        if (barcode && barcode.trim() === barcodeInput) {
                            document.getElementById('product-name').textContent = `الاسم: ${productName}`;
                            document.getElementById('product-price').textContent = `السعر: ${productPrice}`;
                            document.getElementById('product-barcode').textContent = `الباركود: ${barcode}`;
                            found = true;
                            break;
                        }
                    }

                    if (!found) {
                        document.getElementById('product-name').textContent = 'الاسم: المنتج غير موجود';
                        document.getElementById('product-price').textContent = 'السعر: -';
                        document.getElementById('product-barcode').textContent = 'الباركود: -';
                    }
                })
                .catch(error => {
                    errorMessage.textContent = error.message;
                    errorMessage.style.display = 'block';
                });
        });
    </script>

</body>
</html>
