  <style>
/* General Styles */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #000000, #000000, #8e0e0e);
  margin: 0;
  padding: 0;
  text-align: center;
  color: #333;
  position: relative;
  overflow: hidden;
  animation: backgroundMove 30s linear infinite; /* حركة للخلفية */
}

/* تأثير الشلال المائي */
@keyframes waterfall {
  0% { top: -100%; opacity: 0; }
  50% { top: 50%; opacity: 0.5; }
  100% { top: 100%; opacity: 1; }
}

.waterfall {
  position: absolute;
  top: -100%;
  left: 0;
  width: 100%;
  height: 150px;
  background: rgba(255, 255, 255, 0.5);
  animation: waterfall 3s infinite;
  opacity: 0.8;
  z-index: -1;
}

/* تأثير الأمواج */
@keyframes waves {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.wave {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background: rgba(255, 255, 255, 0.6);
  background-image: url('https://www.transparenttextures.com/patterns/waves.png'); /* يمكنك تغيير الرابط إلى صورة أمواج أخرى */
  animation: waves 5s linear infinite;
  z-index: -2;
}

/* حركة مستمرة للخلفية */
@keyframes backgroundMove {
  0% { background-position: 0 0; }
  50% { background-position: 100% 100%; }
  100% { background-position: 0 0; }
}

/* تحسين مظهر النص */
h1, p {
  color: white;
  text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
}

/* تحسين الأزرار */
button {
  padding: 10px 20px;
  font-size: 18px;
  background-color: #ff6f61;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color 0.3s;
}

button:hover {
  background-color: #ff3e1d;
}

/* تحسين التباين */
.container {
  padding: 30px;
  max-width: 1200px;
  margin: 0 auto;
  border-radius: 20px;
  box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2); /* ظل الحاوية */
  animation: float 3s infinite ease-in-out;
}

/* تأثير طفو خفيف */
@keyframes float {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
}

/* تحسين التوافق مع الأجهزة المحمولة */
@media (max-width: 768px) {

    text-align: left;

h1 {

}

/* Fade-in animation for h1 */
@keyframes fadeIn {
  from {

  }
  to {
    opacity: 1;
  }
}

/* تحسين النصوص الأخرى */
p, button {
  color: #fff;

}

/* Slide-in animation for container */

/* تصميم حديث للماسح */
#scanner-container {
  position: relative;
  width: 100%;
  height: 250px;
  border-radius: 15px;
  overflow: hidden;
  background: linear-gradient(145deg, #000000, #1a1a1a);
  box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.4), inset 0px -2px 8px rgba(255, 255, 255, 0.1);
  animation: scaleUp 0.8s ease-in-out;
}

/* تأثير الذكاء الصناعي على الماسح */
#scanner-container::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 255, 255, 0.1);
  border-radius: 15px;
  box-shadow: 0px 0px 20px rgba(0, 255, 255, 0.6), inset 0px 0px 10px rgba(0, 255, 255, 0.3);
  animation: scannerLight 1.5s infinite ease-in-out;
}

/* تأثير مسح بالضوء */
@keyframes scannerLight {
  0% {
    background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.3), transparent);
    opacity: 0;
  }
  50% {
    opacity: 1;
  }
  100% {
    background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.1), transparent);
    opacity: 0;
  }
}

@media (max-width: 768px) {

button {

    0 0 10px #ffae00,

    0 0 40px #0056b3, 
    0 0 50px #ff5700,

  animation: rotateColors 3s linear infinite, glowing 2s infinite ease-in-out;

@keyframes rotateColors {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

@keyframes glowing {
  0% {
    box-shadow: 0 0 10px rgba(255, 87, 0, 0.5), 0 0 20px rgba(255, 87, 0, 0.4), 0 0 30px rgba(255, 87, 0, 0.3);
  }
  50% {
    box-shadow: 0 0 20px rgba(255, 87, 0, 0.7), 0 0 40px rgba(255, 87, 0, 0.6), 0 0 60px rgba(255, 87, 0, 0.5);
  }
  100% {
    box-shadow: 0 0 10px rgba(255, 87, 0, 0.5), 0 0 20px rgba(255, 87, 0, 0.4), 0 0 30px rgba(255, 87, 0, 0.3);
  }
}

button::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 300%;
  height: 300%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0) 70%);
  transform: translate(-50%, -50%) scale(0);
  transition: transform 0.5s ease;
  opacity: 0.5;
  z-index: 1;
}

button:hover::before {
  transform: translate(-50%, -50%) scale(1);
}

button:hover {
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 8px 25px rgba(255, 87, 0, 0.5), 0 0 40px rgba(255, 87, 0, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.7);
}

button:active {
  transform: translateY(-1px) scale(0.98);
  box-shadow: 0 3px 10px rgba(255, 87, 0, 0.5), 0 0 20px rgba(255, 87, 0, 0.6), inset 0 0 5px rgba(255, 255, 255, 0.4);
}

button:disabled {
  background-color: #aaa;
  cursor: not-allowed;
}

/* Popup Styles */
.popup {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #fff;
  border-radius: 16px;
  padding: 30px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
  z-index: 9999;
  width: 400px;
  animation: popupAnimation 0.5s ease-out;
  overflow: hidden;
}

@keyframes popupAnimation {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.8);
  }
  100% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}

/* Content Frame */
.popup .content-frame {
  border: 2px solid #ddd;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  background: linear-gradient(145deg, #ffffff, #f3f3f3);
  box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.1), -5px -5px 15px rgba(255, 255, 255, 0.9);
}

/* Heading Styles */
.popup h2 {
  font-size: 1.8rem;
  color: #333;
  font-weight: bold;
  margin-bottom: 15px;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 1px;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
}

/* Detail Box */
.detail-box {
  font-size: 1.1rem;

  margin-bottom: 15px;
  text-align: center;
  line-height: 1.6;
}

/* Price Frame */
.price-frame {
  border: 3px solid #2196F3;
  border-radius: 12px;
  padding: 15px;

}

.close-btn:hover {

    #status-message {
        position: absolute;
        top: 10px;
        left: 0;
        right: 0;
        text-align: center;
        color: white;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        z-index: 20;
        font-size: 16px;
    }

  </style>
</head>
<body>

  <div class="container">
    <h1>بحث المنتجات باستخدام الباركود</h1>

    <div id="scanner-container">
        <div id="interactive" class="viewport"></div>
      </div>
    
      <button id="start-scanner">✨AI Scanner</button>
      <p id="status-message"></p>
    
  <div id="zoom-controls-barcode">
    <button id="reset-zoom-barcode" onclick="resetZoom()">🔄 الضبط</button>
    <button id="zoom-out-barcode" onclick="zoomOut()">🔎 تصغير</button>
    <button id="zoom-in-barcode" onclick="zoomIn()">🔍 تكبير</button>
</div>

  <div class="popup" id="result-popup">
    <h2>نتائج البحث:</h2>
    <div class="detail-box" id="product-name">
      <strong>الاسم:</strong> <span id="product-name-result">-</span>
    </div>
    <div class="price-box" id="product-price">
      <strong>السعر:</strong> <span id="product-price-result">-</span>
    </div>
    <div class="detail-box" id="product-barcode">
      <strong>الباركود:</strong> <span id="product-barcode-result">-</span>
    </div>
    <button class="close-btn" onclick="closePopup()">إغلاق</button>
  </div>

  <br>
  <form id="barcode-form">
    <input type="text" id="barcode-input" placeholder=" Start Scanner أدخل الباركود يدويا أو استخدم " required>
    <input type="submit" value="بحث">
  </form>
</div>

  <div class="footer">
    <div class="line">تصميم وتطوير بواسطة محمد شحادة | Designed and Developed by Mohammed Shehadeh</div>
  </div>
  
    </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></<script>
// العناصر الرئيسية في الواجهة
const barcodeInput = document.getElementById('barcode-input');
const popup = document.getElementById('result-popup');
const startScannerButton = document.getElementById('start-scanner');
const statusMessage = document.getElementById('status-message');
const scannerContainer = document.getElementById('scanner-container');
const form = document.getElementById('barcode-form');
const interactiveViewport = document.getElementById('interactive');

// متغيرات حالة الماسح
let videoTrack = null;
let currentZoom = 1;
let minZoom = 1;
let maxZoom = 5;
let zoomStep = 0.5;
let lastReadValues = [];
let isProcessing = false;
let scannerActive = false;
let scanAttempts = 0;
const maxScanAttempts = 5;
let lastDetectionTime = 0;
const detectionCooldown = 1000; // 1 ثانية بين كل مسح

// تهيئة الصفحة
document.addEventListener('DOMContentLoaded', () => {
    scannerContainer.style.display = 'none';
    document.getElementById('zoom-controls-barcode').style.display = 'none';
});

// بدء الماسح الضوئي
function startScanner() {
    if (scannerActive) return;
    
    startScannerButton.disabled = true;
    statusMessage.textContent = 'جاري تهيئة الماسح...';
    scannerContainer.style.display = 'block';
    document.getElementById('zoom-controls-barcode').style.display = 'flex';
    interactiveViewport.innerHTML = '<video autoplay playsinline></video>';
    
    // إعدادات الكاميرا المتقدمة
    const constraints = {
        video: {
            facingMode: 'environment',
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            aspectRatio: { ideal: 16/9 },
            focusMode: "continuous",
            zoom: currentZoom
        }
    };

    // تحسينات لأجهزة سامسونج
    if (/samsung/i.test(navigator.userAgent)) {
        constraints.video.width = { ideal: 3840 };
        constraints.video.height = { ideal: 2160 };
    }

    navigator.mediaDevices.getUserMedia(constraints)
        .then(stream => {
            const videoElement = interactiveViewport.querySelector('video');
            videoElement.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];
            
            // إعداد عناصر التحكم بالتكبير
            setupZoomControls();
            
            // بدء عملية المسح
            initBarcodeScanner();
            
            videoElement.onloadedmetadata = () => {
                statusMessage.textContent = 'جاهز للمسح. ضع الباركود في منتصف الشاشة';
                adjustVideoOrientation(videoElement);
            };
        })
        .catch(error => {
            console.error('خطأ في الكاميرا:', error);
            statusMessage.textContent = 'خطأ في تشغيل الكاميرا. يرجى التأكد من الصلاحيات';
            startScannerButton.disabled = false;
        });
}

// إعداد عناصر التحكم بالتكبير
function setupZoomControls() {
    if (!videoTrack) return;
    
    const capabilities = videoTrack.getCapabilities();
    if (capabilities.zoom) {
        minZoom = capabilities.zoom.min || 1;
        maxZoom = capabilities.zoom.max || 5;
        zoomStep = capabilities.zoom.step || 0.1;
        updateZoomButtons();
    } else {
        document.getElementById('zoom-controls-barcode').style.display = 'none';
    }
}

// تحديث حالة أزرار التكبير
function updateZoomButtons() {
    document.getElementById("zoom-in-barcode").disabled = currentZoom >= maxZoom;
    document.getElementById("zoom-out-barcode").disabled = currentZoom <= minZoom;
}

// تكبير الصورة
function zoomIn() {
    if (currentZoom < maxZoom) {
        setZoom(Math.min(currentZoom + zoomStep, maxZoom));
    }
}

// تصغير الصورة
function zoomOut() {
    if (currentZoom > minZoom) {
        setZoom(Math.max(currentZoom - zoomStep, minZoom));
    }
}

// إعادة ضبط التكبير
function resetZoom() {
    setZoom(1);
}

// تطبيق إعدادات التكبير على الكاميرا
async function setZoom(zoomValue) {
    if (!videoTrack) return;
    
    try {
        await videoTrack.applyConstraints({
            advanced: [{ zoom: zoomValue }]
        });
        currentZoom = zoomValue;
        updateZoomButtons();
    } catch (err) {
        console.error("فشل ضبط التكبير:", err);
    }
}

// تهيئة ماسح الباركود
function initBarcodeScanner() {
    Quagga.init({
        inputStream: {
            name: "Live",
            type: "LiveStream",
            target: interactiveViewport,
            constraints: {
                width: { min: 640 },
                height: { min: 480 },
                facingMode: "environment",
                aspectRatio: { min: 1, max: 2 }
            },
            area: {
                top: "30%",
                right: "20%",
                left: "20%",
                bottom: "30%"
            }
        },
        locator: {
            patchSize: "large",
            halfSample: true
        },
        numOfWorkers: navigator.hardwareConcurrency || 4,
        decoder: {
            readers: [
                "code_128_reader",
                "ean_reader",
                "ean_8_reader",
                "upc_reader",
                "upc_e_reader"
            ]
        },
        locate: true,
        frequency: 5
    }, function(err) {
        if (err) {
            console.error("خطأ في تهيئة الماسح:", err);
            statusMessage.textContent = "خطأ في تشغيل الماسح. جارٍ المحاولة بطريقة بديلة...";
            initAlternativeScanner();
            return;
        }
        
        Quagga.start();
        scannerActive = true;
        
        Quagga.onDetected(handleBarcodeDetection);
    });
}

// التعامل مع اكتشاف الباركود
function handleBarcodeDetection(result) {
    const now = Date.now();
    if (isProcessing || now - lastDetectionTime < detectionCooldown) return;
    
    lastDetectionTime = now;
    const code = result.codeResult.code;
    const codeBounds = result.codeResult.box;
    
    // التحقق من جودة الباركود
    if (!isHighQualityBarcode(codeBounds)) {
        statusMessage.textContent = "جودة الباركود منخفضة. يرجى تثبيت الكاميرا";
        scanAttempts++;
        if (scanAttempts >= maxScanAttempts) {
            statusMessage.textContent = "جارٍ ضبط الإعدادات تلقائيًا...";
            autoAdjustScanner();
        }
        return;
    }
    
    if (isValidBarcode(code)) {
        scanAttempts = 0;
        processBarcode(code);
    } else {
        statusMessage.textContent = "جارٍ التحقق من الباركود...";
        scanAttempts++;
        setTimeout(() => {
            readBarcodeWithOCR();
        }, 500);
    }
}

// التحقق من جودة الباركود
function isHighQualityBarcode(box) {
    const videoElement = interactiveViewport.querySelector('video');
    if (!videoElement) return false;
    
    const videoWidth = videoElement.videoWidth;
    const videoHeight = videoElement.videoHeight;
    
    // حساب مساحة الباركود
    const barcodeArea = calculatePolygonArea(box);
    const videoArea = videoWidth * videoHeight;
    const areaRatio = barcodeArea / videoArea;
    
    // يجب أن يكون الباركود في النطاق المناسب
    return areaRatio >= 0.2 && areaRatio <= 0.8;
}

// حساب مساحة المضلع
function calculatePolygonArea(points) {
    let area = 0;
    for (let i = 0; i < points.length; i++) {
        const j = (i + 1) % points.length;
        area += points[i].x * points[j].y;
        area -= points[j].x * points[i].y;
    }
    return Math.abs(area / 2);
}

// طريقة بديلة للمسح
function initAlternativeScanner() {
    const videoElement = interactiveViewport.querySelector('video');
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    
    const scanInterval = setInterval(() => {
        if (!scannerActive) {
            clearInterval(scanInterval);
            return;
        }
        
        canvas.width = videoElement.videoWidth;
        canvas.height = videoElement.videoHeight;
        context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
        
        // استخدام مكتبة ZXing.js كبديل
        try {
            const barcode = scanBarcodeWithZXing(canvas);
            if (barcode) {
                processBarcode(barcode);
                clearInterval(scanInterval);
            }
        } catch (e) {
            console.log('المحاولة باستخدام ZXing:', e);
        }
    }, 500);
}

// المسح باستخدام OCR
function readBarcodeWithOCR() {
    if (!window.Tesseract) {
        console.warn("Tesseract.js غير محمل");
        return;
    }
    
    const videoElement = interactiveViewport.querySelector('video');
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    
    canvas.width = videoElement.videoWidth;
    canvas.height = videoElement.videoHeight;
    context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
    
    Tesseract.recognize(
        canvas,
        'eng',
        { logger: m => console.log(m) }
    ).then(({ data: { text } }) => {
        const extractedText = text.replace(/\s+/g, '').trim();
        if (extractedText && isValidBarcode(extractedText)) {
            processBarcode(extractedText);
        }
    });
}

// التحقق من صحة الباركود
function isValidBarcode(code) {
    if (!code || code.length < 6) return false;
    
    // التحقق من التكرار لتجنب القراءات الخاطئة
    lastReadValues.push(code);
    if (lastReadValues.length > 5) lastReadValues.shift();
    
    // يجب أن تتطابق جميع القراءات الأخيرة
    const allMatch = lastReadValues.every(val => val === code);
    if (!allMatch) return false;
    
    // التحقق من checksum للباركود
    return validateBarcodeChecksum(code);
}

// التحقق من checksum
function validateBarcodeChecksum(code) {
    // EAN-13
    if (code.length === 13) {
        let sum = 0;
        for (let i = 0; i < 12; i++) {
            sum += parseInt(code[i]) * (i % 2 === 0 ? 1 : 3);
        }
        const checksum = (10 - (sum % 10)) % 10;
        return checksum === parseInt(code[12]);
    }
    
    // UPC-A
    if (code.length === 12) {
        let sum = 0;
        for (let i = 0; i < 11; i++) {
            sum += parseInt(code[i]) * (i % 2 === 0 ? 3 : 1);
        }
        const checksum = (10 - (sum % 10)) % 10;
        return checksum === parseInt(code[11]);
    }
    
    // Code 128
    if (code.length >= 4 && code.length <= 32) {
        return true;
    }
    
    return false;
}

// معالجة الباركود المكتشف
function processBarcode(code) {
    if (isProcessing) return;
    isProcessing = true;
    
    statusMessage.textContent = `تم اكتشاف الباركود: ${code}`;
    barcodeInput.value = code;
    
    // إبراز الباركود المكتشف
    highlightDetectedBarcode();
    
    // تأخير لإظهار التأكيد للمستخدم قبل الإرسال
    setTimeout(() => {
        stopScanner();
        submitBarcodeForm();
        isProcessing = false;
    }, 800);
}

// إبراز الباركود المكتشف
function highlightDetectedBarcode() {
    const highlight = document.createElement('div');
    highlight.className = 'barcode-highlight';
    interactiveViewport.appendChild(highlight);
    
    setTimeout(() => {
        highlight.style.transform = 'scale(1.1)';
        highlight.style.opacity = '0';
        
        setTimeout(() => {
            if (highlight.parentNode) {
                interactiveViewport.removeChild(highlight);
            }
        }, 500);
    }, 50);
}

// إيقاف الماسح الضوئي
function stopScanner() {
    if (scannerActive) {
        Quagga.offDetected(handleBarcodeDetection);
        Quagga.stop();
        scannerActive = false;
    }
    
    if (videoTrack) {
        videoTrack.stop();
        videoTrack = null;
    }
    
    startScannerButton.disabled = false;
    scannerContainer.style.display = 'none';
    document.getElementById('zoom-controls-barcode').style.display = 'none';
    statusMessage.textContent = '';
    
    // إعادة تعيين المتغيرات
    lastReadValues = [];
    scanAttempts = 0;
}

// إرسال النموذج
function submitBarcodeForm() {
    const submitButton = form.querySelector('input[type="submit"], button[type="submit"]');
    if (submitButton) {
        submitButton.click();
    } else {
        form.submit();
    }
}

// ضبط تلقائي للماسح
function autoAdjustScanner() {
    if (currentZoom > minZoom) {
        setZoom(Math.max(currentZoom - zoomStep, minZoom));
    } else {
        setZoom(minZoom + zoomStep);
    }
    
    scanAttempts = 0;
    statusMessage.textContent = "تم ضبط الإعدادات. جرب مرة أخرى";
}

// ضبط اتجاه الفيديو
function adjustVideoOrientation(videoElement) {
    if (window.screen && window.screen.orientation) {
        const orientation = window.screen.orientation.type;
        if (orientation.includes('portrait')) {
            videoElement.style.transform = 'rotate(90deg)';
        }
    }
}

// إغلاق النافذة المنبثقة
function closePopup() {
    popup.style.display = 'none';
    barcodeInput.focus();
}

// البحث عن المنتج
form.addEventListener('submit', function(e) {
    e.preventDefault();
    const barcodeValue = barcodeInput.value.trim();
    if (!barcodeValue) {
        alert('الرجاء إدخال الباركود.');
        return;
    }

    fetch('test.txt')
        .then(response => {
            if (!response.ok) throw new Error('فشل تحميل ملف البيانات.');
            return response.text();
        })
        .then(data => {
            const lines = data.split('\n');
            let found = false;

            for (let line of lines) {
                const [productName, productPrice, barcode] = line.split('/');
                if (barcode && barcode.trim() === barcodeValue) {
                    document.getElementById('product-name-result').textContent = productName;
                    document.getElementById('product-price-result').textContent = productPrice;
                    document.getElementById('product-barcode-result').textContent = barcode;
                    found = true;
                    break;
                }
            }

            if (!found) {
                document.getElementById('product-name-result').textContent = 'المنتج غير موجود';
                document.getElementById('product-price-result').textContent = '-';
                document.getElementById('product-barcode-result').textContent = '-';
            }

            popup.style.display = 'block';
        })
        .catch(error => {
            alert(error.message);
        });
});

// بدء الماسح عند النقر على الزر
startScannerButton.addEventListener('click', startScanner);

// تسجيل Service Worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js')
        .then(registration => {
            console.log('Service Worker مسجل بنجاح:', registration.scope);
        })
        .catch(error => {
            console.log('فشل تسجيل Service Worker:', error);
        });
}
</script>
      </body>
