<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>برنامج البحث بالباركود</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    .input-container {
      margin: 20px 0;
    }
    input[type="text"] {
      padding: 10px;
      width: 250px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: #fff;
      background-color: #007BFF;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #result {
      margin-top: 20px;
      font-size: 18px;
      color: #333;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <h1>برنامج البحث بالباركود</h1>

  <div class="input-container">
    <label for="barcode-input">أدخل الباركود:</label>
    <input type="text" id="barcode-input" placeholder="أدخل الباركود هنا">
    <button onclick="searchBarcode()">بحث</button>
  </div>

  <div id="result"></div>

  <script>
    let excelData = [];

    // قراءة ملف Excel
    fetch('model1.xlsx')
      .then(response => response.arrayBuffer())
      .then(data => {
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        excelData = XLSX.utils.sheet_to_json(sheet);
        console.log("Excel Data Loaded:", excelData);
      })
      .catch(error => {
        console.error("Error loading Excel file:", error);
        document.getElementById('result').textContent = "حدث خطأ في تحميل ملف البيانات.";
      });

    // البحث عن الباركود
    function searchBarcode() {
      const barcode = document.getElementById('barcode-input').value.trim();
      if (!barcode) {
        document.getElementById('result').textContent = "يرجى إدخال الباركود.";
        return;
      }

      const item = excelData.find(row => row['C'] && row['C'].toString() === barcode);

      if (item) {
        document.getElementById('result').innerHTML = `
          <p>الصنف: <strong>${item['A']}</strong></p>
          <p>السعر: <strong>${item['B']} ريال</strong></p>
        `;
      } else {
        document.getElementById('result').textContent = "لم يتم العثور على بيانات للباركود المدخل.";
      }
    }
  </script>
</body>
</html>
