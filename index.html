<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بحث المنتجات باستخدام الباركود</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            margin: 0;
            padding: 0;
            color: #fff;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background-color: #ffffff;
            color: #333;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #0984e3;
        }
        input[type="text"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
        }
        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #0984e3;
            border: none;
            color: #fff;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        input[type="submit"]:hover {
            background-color: #74b9ff;
        }
        #product-details {
            margin-top: 20px;
        }
        .detail-box {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: #f4f4f4;
            color: #333;
            font-size: 16px;
            text-align: left;
        }
        .price-box {
            margin: 10px 0;
            padding: 15px;
            border: 2px solid #0984e3;
            border-radius: 6px;
            background-color: #dfe6e9;
            color: #333;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
        .error {
            color: red;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>بحث المنتجات باستخدام الباركود</h1>

        <!-- نموذج البحث عن المنتج -->
        <form id="barcode-form">
            <input type="text" id="barcode-input" placeholder="أدخل الباركود" required>
            <input type="submit" value="بحث">
        </form>

        <!-- عرض تفاصيل المنتج -->
        <div id="product-details">
            <h2>تفاصيل المنتج:</h2>
            <div class="detail-box" id="product-name">الاسم: -</div>
            <div class="price-box" id="product-price">السعر: -</div>
            <div class="detail-box" id="product-barcode">الباركود: -</div>
        </div>

        <!-- رسائل الخطأ -->
        <div id="error-message" class="error" style="display:none;"></div>
    </div>

    <script>
        document.getElementById('barcode-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const barcodeInput = document.getElementById('barcode-input').value.trim();
            const errorMessage = document.getElementById('error-message');
            errorMessage.style.display = 'none';

            if (!barcodeInput) {
                errorMessage.textContent = "الرجاء إدخال الباركود.";
                errorMessage.style.display = 'block';
                return;
            }

            // قراءة ملف البيانات
            fetch('test.txt')
                .then(response => {
                    if (!response.ok) {
                        throw new Error("فشل تحميل ملف البيانات.");
                    }
                    return response.text();
                })
                .then(data => {
                    const lines = data.split('\n');
                    let found = false;

                    // البحث عن المنتج باستخدام الباركود
                    for (let line of lines) {
                        const [productName, productPrice, barcode] = line.split('/');
                        if (barcode && barcode.trim() === barcodeInput) {
                            document.getElementById('product-name').textContent = `الاسم: ${productName}`;
                            document.getElementById('product-price').textContent = `السعر: ${productPrice}`;
                            document.getElementById('product-barcode').textContent = `الباركود: ${barcode}`;
                            found = true;
                            break;
                        }
                    }

                    if (!found) {
                        document.getElementById('product-name').textContent = 'الاسم: المنتج غير موجود';
                        document.getElementById('product-price').textContent = 'السعر: -';
                        document.getElementById('product-barcode').textContent = 'الباركود: -';
                    }

                    // إعادة ضبط حقل الإدخال
                    document.getElementById('barcode-input').value = '';
                })
                .catch(error => {
                    errorMessage.textContent = error.message;
                    errorMessage.style.display = 'block';
                });
        });

        // البحث عند الضغط على Enter
        document.getElementById('barcode-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('barcode-form').dispatchEvent(new Event('submit'));
            }
        });
    </script>

</body>
</html>
