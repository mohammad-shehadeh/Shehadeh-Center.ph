<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الأصناف - البحث بالباركود</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #4cc9f0;
            --warning-color: #f72585;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: var(--dark-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px 0;
            text-align: center;
            border-radius: var(--border-radius);
            margin-bottom: 30px;
            box-shadow: var(--box-shadow);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .search-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background-color: white;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            margin-bottom: 30px;
        }

        .search-tabs {
            display: flex;
            border-bottom: 2px solid #eee;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 12px 25px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            color: #666;
            position: relative;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: var(--primary-color);
            font-weight: 700;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--primary-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #6c757d;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .btn-danger {
            background-color: var(--warning-color);
        }

        .btn-danger:hover {
            background-color: #d1145a;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .scanner-container {
            display: none;
            position: relative;
            margin: 20px 0;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--box-shadow);
        }

        #interactive {
            position: relative;
            width: 100%;
            height: 300px;
        }

        #interactive video {
            width: 100%;
            height: auto;
            display: block;
        }

        .scanner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .scanner-frame {
            width: 80%;
            max-width: 400px;
            height: 150px;
            border: 3px solid var(--accent-color);
            border-radius: 8px;
            position: relative;
        }

        .scanner-frame::before, .scanner-frame::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: var(--accent-color);
            border-style: solid;
            border-width: 0;
        }

        .scanner-frame::before {
            top: 0;
            left: 0;
            border-top-width: 3px;
            border-left-width: 3px;
            border-top-left-radius: 5px;
        }

        .scanner-frame::after {
            top: 0;
            right: 0;
            border-top-width: 3px;
            border-right-width: 3px;
            border-top-right-radius: 5px;
        }

        .scanner-zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 20;
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.8);
            color: var(--dark-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
        }

        .zoom-btn:hover {
            background-color: white;
            transform: scale(1.1);
        }

        .status-message {
            padding: 10px;
            margin: 10px 0;
            border-radius: var(--border-radius);
            text-align: center;
            font-weight: 500;
        }

        .success {
            background-color: rgba(76, 201, 240, 0.2);
            color: #0d6efd;
        }

        .error {
            background-color: rgba(247, 37, 133, 0.2);
            color: var(--warning-color);
        }

        .info {
            background-color: rgba(255, 193, 7, 0.2);
            color: #ff9800;
        }

        .result-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .popup-content {
            background-color: white;
            width: 90%;
            max-width: 500px;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: popupFadeIn 0.3s ease;
        }

        @keyframes popupFadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .popup-title {
            font-size: 1.5rem;
            color: var(--primary-color);
            font-weight: 700;
        }

        .close-popup {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
            transition: color 0.2s;
        }

        .close-popup:hover {
            color: var(--warning-color);
        }

        .product-info {
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-label {
            font-weight: 500;
            color: #555;
        }

        .info-value {
            font-weight: 600;
            color: var(--dark-color);
        }

        .product-price .info-value {
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        .not-found {
            text-align: center;
            padding: 20px;
            color: var(--warning-color);
            font-weight: 500;
        }

        .history-section {
            background-color: white;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }

        .history-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--primary-color);
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        .history-list {
            list-style: none;
        }

        .history-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
        }

        .history-item:hover {
            background-color: #f8f9fa;
        }

        .history-item-info {
            flex: 1;
        }

        .history-item-name {
            font-weight: 500;
            margin-bottom: 5px;
        }

        .history-item-details {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            color: #666;
        }

        .history-item-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .action-btn:hover {
            color: var(--primary-color);
        }

        .action-btn.delete:hover {
            color: var(--warning-color);
        }

        .ocr-processing {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: var(--border-radius);
        }

        .ocr-spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--accent-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .mode-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            z-index: 25;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .search-section {
                padding: 15px;
            }
            
            .tab-btn {
                padding: 10px 15px;
                font-size: 0.9rem;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
            
            .scanner-frame {
                width: 90%;
                height: 120px;
            }
            
            .popup-content {
                width: 95%;
                padding: 15px;
            }
            
            .info-row {
                flex-direction: column;
                gap: 5px;
            }
        }

        /* Animation for barcode scan */
        @keyframes scanAnimation {
            0% {
                top: 0;
            }
            100% {
                top: calc(100% - 4px);
            }
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: rgba(72, 149, 239, 0.8);
            box-shadow: 0 0 10px rgba(72, 149, 239, 0.8);
            animation: scanAnimation 2s infinite linear;
            z-index: 15;
        }

        /* Dark mode */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
                color: #e0e0e0;
            }
            
            .search-section, .history-section, .popup-content {
                background-color: #1e1e1e;
                color: #e0e0e0;
            }
            
            input[type="text"], input[type="number"] {
                background-color: #2d2d2d;
                color: #e0e0e0;
                border-color: #444;
            }
            
            .info-label, .tab-btn:not(.active), .action-btn {
                color: #aaa;
            }
            
            .info-value {
                color: #e0e0e0;
            }
            
            .history-item:hover {
                background-color: #2a2a2a;
            }
            
            .popup-header, .history-title {
                border-bottom-color: #444;
            }
            
            .info-row, .history-item {
                border-bottom-color: #444;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-barcode"></i> نظام إدارة الأصناف</h1>
            <p>ابحث عن الأصناف باستخدام الباركود أو اسم المنتج</p>
        </header>

        <section class="search-section">
            <div class="search-tabs">
                <button class="tab-btn active" data-tab="barcode-tab"><i class="fas fa-barcode"></i> البحث بالباركود</button>
                <button class="tab-btn" data-tab="name-tab"><i class="fas fa-search"></i> البحث بالاسم</button>
            </div>

            <div id="barcode-tab" class="tab-content active">
                <form id="barcode-form">
                    <div class="form-group">
                        <label for="barcode-input"><i class="fas fa-qrcode"></i> أدخل الباركود:</label>
                        <input type="text" id="barcode-input" placeholder="مسح الباركود أو إدخاله يدويًا" autocomplete="off">
                    </div>
                    
                    <div class="btn-group">
                        <button type="button" id="start-scanner" class="btn"><i class="fas fa-camera"></i> بدء الماسح الضوئي</button>
                        <button type="submit" class="btn btn-secondary"><i class="fas fa-search"></i> بحث</button>
                    </div>
                </form>

                <div id="scanner-container" class="scanner-container">
                    <div id="interactive" class="viewport">
                        <div id="ocr-processing" class="ocr-processing">
                            <div class="ocr-spinner"></div>
                            <p>جاري قراءة الرقم...</p>
                        </div>
                        <video playsinline></video>
                        <div class="scan-line"></div>
                        <div class="scanner-overlay">
                            <div class="scanner-frame"></div>
                        </div>
                        <div id="mode-indicator" class="mode-indicator">وضع القراءة: باركود</div>
                    </div>
                    <div class="scanner-zoom-controls">
                        <button id="zoom-out-barcode" class="zoom-btn" title="تصغير"><i class="fas fa-search-minus"></i></button>
                        <button id="zoom-reset-barcode" class="zoom-btn" title="إعادة الضبط"><i class="fas fa-expand-arrows-alt"></i></button>
                        <button id="zoom-in-barcode" class="zoom-btn" title="تكبير"><i class="fas fa-search-plus"></i></button>
                    </div>
                </div>

                <div id="status-message" class="status-message"></div>
            </div>

            <div id="name-tab" class="tab-content">
                <form id="name-search-form">
                    <div class="form-group">
                        <label for="name-input"><i class="fas fa-tag"></i> أدخل اسم المنتج:</label>
                        <input type="text" id="name-input" placeholder="اسم المنتج أو جزء منه" autocomplete="off">
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn"><i class="fas fa-search"></i> بحث</button>
                    </div>
                </form>

                <div id="name-search-results" class="search-results" style="margin-top: 20px;"></div>
            </div>
        </section>

        <section class="history-section">
            <h2 class="history-title"><i class="fas fa-history"></i> سجل البحث</h2>
            <ul class="history-list" id="search-history">
                <!-- سيتم ملؤه بالنتائج السابقة -->
            </ul>
        </section>
    </div>

    <div id="result-popup" class="result-popup">
        <div class="popup-content">
            <div class="popup-header">
                <h2 class="popup-title"><i class="fas fa-info-circle"></i> تفاصيل المنتج</h2>
                <button class="close-popup" id="close-popup">&times;</button>
            </div>
            
            <div class="product-info" id="product-info">
                <!-- سيتم ملؤه بالنتائج -->
            </div>
            
            <div class="btn-group">
                <button class="btn" id="print-result"><i class="fas fa-print"></i> طباعة</button>
                <button class="btn btn-secondary" id="close-result">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- مكتبات JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // عناصر واجهة المستخدم
            const tabButtons = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');
            const barcodeInput = document.getElementById('barcode-input');
            const nameInput = document.getElementById('name-input');
            const popup = document.getElementById('result-popup');
            const startScannerButton = document.getElementById('start-scanner');
            const statusMessage = document.getElementById('status-message');
            const scannerContainer = document.getElementById('scanner-container');
            const barcodeForm = document.getElementById('barcode-form');
            const nameSearchForm = document.getElementById('name-search-form');
            const searchHistory = document.getElementById('search-history');
            const productInfo = document.getElementById('product-info');
            const closePopupBtn = document.getElementById('close-popup');
            const closeResultBtn = document.getElementById('close-result');
            const printResultBtn = document.getElementById('print-result');
            const zoomInBtn = document.getElementById('zoom-in-barcode');
            const zoomOutBtn = document.getElementById('zoom-out-barcode');
            const zoomResetBtn = document.getElementById('zoom-reset-barcode');
            const ocrProcessing = document.getElementById('ocr-processing');
            const modeIndicator = document.getElementById('mode-indicator');
            
            // متغيرات النظام
            let lastReadValues = [];
            let isProcessing = false;
            let scannerActive = false;
            let videoTrack = null;
            let currentZoom = 1;
            let minZoom = 1;
            let maxZoom = 5;
            let zoomStep = 0.5;
            let searchHistoryData = JSON.parse(localStorage.getItem('searchHistory')) || [];
            let barcodeAttempts = 0;
            const maxBarcodeAttempts = 3;
            let currentMode = 'barcode'; // 'barcode' أو 'ocr'
            let ocrWorker = null;
            
            // تهيئة Tesseract.js
            Tesseract.createWorker({
                logger: m => console.log(m),
            }).then(worker => {
                ocrWorker = worker;
                console.log('Tesseract worker جاهز');
            });
            
            // تهيئة سجل البحث
            renderSearchHistory();
            
            // تبديل التبويبات
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // إزالة النشاط من جميع الأزرار والمحتويات
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    tabContents.forEach(content => content.classList.remove('active'));
                    
                    // إضافة النشاط للعناصر المحددة
                    button.classList.add('active');
                    const tabId = button.getAttribute('data-tab');
                    document.getElementById(tabId).classList.add('active');
                    
                    // إيقاف الماسح إذا كان نشطًا
                    if (scannerActive) {
                        stopScanner();
                    }
                });
            });
            
            // بدء الماسح الضوئي
            startScannerButton.addEventListener('click', startScanner);
            
            // التحكم في التكبير
            zoomInBtn.addEventListener('click', zoomIn);
            zoomOutBtn.addEventListener('click', zoomOut);
            zoomResetBtn.addEventListener('click', resetZoom);
            
            // إدارة النافذة المنبثقة
            closePopupBtn.addEventListener('click', closePopup);
            closeResultBtn.addEventListener('click', closePopup);
            printResultBtn.addEventListener('click', printResult);
            
            // البحث بالباركود
            barcodeForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const barcodeValue = barcodeInput.value.trim();
                if (!barcodeValue) {
                    showStatusMessage('الرجاء إدخال الباركود', 'error');
                    return;
                }
                searchProduct(barcodeValue, 'barcode');
            });
            
            // البحث بالاسم
            nameSearchForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const nameValue = nameInput.value.trim();
                if (!nameValue) {
                    showStatusMessage('الرجاء إدخال اسم المنتج', 'error');
                    return;
                }
                searchProduct(nameValue, 'name');
            });
            
            // بدء الماسح الضوئي
            function startScanner() {
                startScannerButton.disabled = true;
                showStatusMessage('جاري تهيئة الماسح الضوئي...', 'success');
                scannerContainer.style.display = 'block';
                barcodeAttempts = 0;
                currentMode = 'barcode';
                updateModeIndicator();
                
                // قيود الكاميرا مع تحسينات للقراءة
                const constraints = {
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        aspectRatio: { ideal: 16/9 },
                        focusMode: "continuous",
                        zoom: currentZoom
                    }
                };
                
                navigator.mediaDevices.getUserMedia(constraints)
                    .then(function(stream) {
                        const videoElement = document.querySelector('#interactive video');
                        if (videoElement) {
                            videoElement.srcObject = stream;
                            videoTrack = stream.getVideoTracks()[0];
                            
                            // التحقق من إمكانيات الكاميرا
                            const capabilities = videoTrack.getCapabilities();
                            if (capabilities.zoom) {
                                minZoom = capabilities.zoom.min || 1;
                                maxZoom = capabilities.zoom.max || 5;
                                zoomStep = capabilities.zoom.step || 0.5;
                            }
                            
                            updateZoomButtons();
                            
                            // إضافة مستمعات للتركيز
                            videoElement.addEventListener("touchstart", adjustFocus);
                            videoElement.addEventListener("click", adjustFocus);
                        }
                    })
                    .catch(function(error) {
                        console.error('خطأ في تشغيل الكاميرا:', error);
                        showStatusMessage('خطأ في تشغيل الكاميرا. يرجى التحقق من الصلاحيات', 'error');
                        startScannerButton.disabled = false;
                        scannerContainer.style.display = 'none';
                    });
                
                // تهيئة Quagga.js
                Quagga.init({
                    inputStream: {
                        name: 'Live',
                        type: 'LiveStream',
                        target: document.querySelector('#interactive'),
                        constraints: constraints.video,
                    },
                    locator: {
                        patchSize: 'medium',
                        halfSample: true
                    },
                    decoder: {
                        readers: [
                            'code_128_reader', 
                            'ean_reader', 
                            'ean_8_reader', 
                            'code_39_reader', 
                            'code_39_vin_reader', 
                            'codabar_reader',
                            'upc_reader',
                            'upc_e_reader'
                        ],
                        multiple: false
                    },
                    locate: true,
                    numOfWorkers: navigator.hardwareConcurrency || 4,
                    frequency: 5
                }, function(err) {
                    if (err) {
                        console.error('Error initializing Quagga:', err);
                        showStatusMessage('خطأ في تشغيل الماسح الضوئي', 'error');
                        startScannerButton.disabled = false;
                        scannerContainer.style.display = 'none';
                        return;
                    }
                    Quagga.start();
                    scannerActive = true;
                    showStatusMessage('الماسح الضوئي جاهز. قم بتوجيه الكاميرا نحو الباركود', 'success');
                });
                
                Quagga.onDetected(function(data) {
                    if (isProcessing) return;
                    
                    const code = data.codeResult.code;
                    console.log('تم اكتشاف باركود:', code);
                    
                    if (validateAndProcessBarcode(code)) {
                        processBarcode(code, 'quagga');
                    }
                });
                
                Quagga.onProcessed(function(data) {
                    if (data && data.codeResult && data.codeResult.code) {
                        // تقليل عدد المحاولات للتفعيل التلقائي للـ OCR
                        barcodeAttempts++;
                        if (barcodeAttempts >= maxBarcodeAttempts && currentMode === 'barcode') {
                            showStatusMessage('جاري التحويل إلى وضع قراءة الرقم...', 'info');
                            setTimeout(() => {
                                switchToOCRMode();
                            }, 1000);
                        }
                    }
                });
            }
            
            // التحقق من صحة الباركود
            function validateAndProcessBarcode(code) {
                if (!code) return false;
                
                // التحقق من طول الباركود
                const length = code.length;
                if (length < 8 || length > 13) {
                    console.warn('طول الباركود غير مناسب:', length);
                    return false;
                }
                
                // التحقق من أن الباركود يحتوي على أرقام فقط
                if (!/^\d+$/.test(code)) {
                    console.warn('البحكود يحتوي على أحرف غير رقمية');
                    return false;
                }
                
                // التحقق من checksum لـ EAN-13 إذا كان الطول 13
                if (length === 13 && !isValidEAN13Checksum(code)) {
                    console.warn('checksum لـ EAN-13 غير صحيح');
                    return false;
                }
                
                // التحقق من checksum لـ EAN-8 إذا كان الطول 8
                if (length === 8 && !isValidEAN8Checksum(code)) {
                    console.warn('checksum لـ EAN-8 غير صحيح');
                    return false;
                }
                
                // إضافة إلى قائمة القيم المقروءة مؤخراً
                lastReadValues.push(code);
                if (lastReadValues.length > 5) lastReadValues.shift();
                
                // التحقق من الاتساق
                const lastValueCount = lastReadValues.filter(val => val === code).length;
                return lastValueCount >= 2; // يحتاج إلى قراءتين متطابقتين على الأقل
            }
            
            // التحقق من checksum لـ EAN-13
            function isValidEAN13Checksum(code) {
                try {
                    let sum = 0;
                    for (let i = 0; i < 12; i++) {
                        sum += (i % 2 === 0 ? 1 : 3) * parseInt(code[i]);
                    }
                    const checksum = (10 - (sum % 10)) % 10;
                    return checksum === parseInt(code[12]);
                } catch {
                    return false;
                }
            }
            
            // التحقق من checksum لـ EAN-8
            function isValidEAN8Checksum(code) {
                try {
                    let sum = 0;
                    for (let i = 0; i < 7; i++) {
                        sum += (i % 2 === 0 ? 3 : 1) * parseInt(code[i]);
                    }
                    const checksum = (10 - (sum % 10)) % 10;
                    return checksum === parseInt(code[7]);
                } catch {
                    return false;
                }
            }
            
            // التحول إلى وضع OCR
            function switchToOCRMode() {
                if (currentMode === 'ocr') return;
                
                currentMode = 'ocr';
                updateModeIndicator();
                Quagga.stop();
                
                showStatusMessage('الآن في وضع قراءة الرقم. قم بتوجيه الكاميرا نحو الرقم تحت الباركود', 'info');
                
                // بدء فحص مستمر للـ OCR
                startContinuousOCRScan();
            }
            
            // التحول إلى وضع الباركود
            function switchToBarcodeMode() {
                if (currentMode === 'barcode') return;
                
                currentMode = 'barcode';
                updateModeIndicator();
                stopContinuousOCRScan();
                Quagga.start();
                
                showStatusMessage('الآن في وضع قراءة الباركود. قم بتوجيه الكاميرا نحو الباركود', 'info');
            }
            
            // بدء فحص OCR مستمر
            function startContinuousOCRScan() {
                const videoElement = document.querySelector('#interactive video');
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                
                function scanFrame() {
                    if (currentMode !== 'ocr' || !scannerActive || isProcessing) return;
                    
                    const width = videoElement.videoWidth;
                    const height = videoElement.videoHeight;
                    
                    if (width === 0 || height === 0) {
                        setTimeout(scanFrame, 500);
                        return;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    
                    // رسم منطقة محددة في وسط الشاشة (حيث يوجد الرقم عادة)
                    const regionWidth = Math.floor(width * 0.8);
                    const regionHeight = Math.floor(height * 0.3);
                    const regionX = Math.floor((width - regionWidth) / 2);
                    const regionY = Math.floor(height * 0.6); // الجزء السفلي حيث يوجد الرقم
                    
                    context.drawImage(
                        videoElement, 
                        regionX, regionY, regionWidth, regionHeight,
                        0, 0, regionWidth, regionHeight
                    );
                    
                    // تحسين الصورة للـ OCR
                    const imageData = context.getImageData(0, 0, regionWidth, regionHeight);
                    enhanceImageForOCR(imageData, context);
                    
                    // تحليل باستخدام Tesseract
                    processOCR(canvas.toDataURL());
                    
                    setTimeout(scanFrame, 1000); // فحص كل ثانية
                }
                
                scanFrame();
            }
            
            // تحسين الصورة للـ OCR
            function enhanceImageForOCR(imageData, context) {
                const data = imageData.data;
                
                // تحسين التباين
                for (let i = 0; i < data.length; i += 4) {
                    const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                    const contrast = 2; // زيادة التباين
                    const newValue = ((avg - 128) * contrast) + 128;
                    
                    data[i] = newValue;     // الأحمر
                    data[i + 1] = newValue; // الأخضر
                    data[i + 2] = newValue; // الأزرق
                    // data[i + 3] تبقى كما هي (الشفافية)
                }
                
                context.putImageData(imageData, 0, 0);
            }
            
            // معالجة OCR
            function processOCR(imageDataUrl) {
                if (isProcessing || !ocrWorker) return;
                
                isProcessing = true;
                ocrProcessing.style.display = 'flex';
                
                // تحسين إعدادات Tesseract للتعرف على الأرقام
                ocrWorker.recognize(imageDataUrl, 'eng', {
                    tessedit_char_whitelist: '0123456789',
                    tessedit_pageseg_mode: 7, // تعامل مع سطر واحد من النص
                    tessjs_create_hocr: '0',
                    tessjs_create_tsv: '0',
                    tessjs_create_box: '0',
                    preserve_interword_spaces: '0'
                }).then(({ data: { text } }) => {
                    ocrProcessing.style.display = 'none';
                    isProcessing = false;
                    
                    // تنظيف النص واستخراج الأرقام فقط
                    const extractedNumbers = text.replace(/[^\d]/g, '').trim();
                    
                    if (extractedNumbers.length >= 8 && extractedNumbers.length <= 13) {
                        console.log('رقم مستخرج من OCR:', extractedNumbers);
                        
                        // التحقق من صحة الرقم
                        if (validateAndProcessBarcode(extractedNumbers)) {
                            processBarcode(extractedNumbers, 'ocr');
                            showStatusMessage(`تم قراءة الرقم: ${extractedNumbers}`, 'success');
                        } else {
                            // محاولة تصحيح الرقم
                            const correctedNumber = attemptNumberCorrection(extractedNumbers);
                            if (correctedNumber && validateAndProcessBarcode(correctedNumber)) {
                                processBarcode(correctedNumber, 'ocr');
                                showStatusMessage(`تم قراءة الرقم بعد التصحيح: ${correctedNumber}`, 'success');
                            }
                        }
                    }
                }).catch(err => {
                    console.error('خطأ في OCR:', err);
                    ocrProcessing.style.display = 'none';
                    isProcessing = false;
                });
            }
            
            // محاولة تصحيح الرقم المقروء
            function attemptNumberCorrection(number) {
                if (!number || number.length < 8) return null;
                
                // محاولة إصلاح الأرقام المشتبه بها
                let corrected = number;
                
                // استبدال الأحرف المشابهة للأرقام
                corrected = corrected.replace(/O|o/g, '0');
                corrected = corrected.replace(/I|l/g, '1');
                corrected = corrected.replace(/Z/g, '2');
                corrected = corrected.replace(/S/g, '5');
                corrected = corrected.replace(/B/g, '8');
                
                // إزالة الأرقام الزائدة في البداية والنهاية
                if (corrected.length > 13) {
                    corrected = corrected.substring(corrected.length - 13);
                }
                
                // التحقق من checksum وإصلاحه إذا لزم الأمر
                if (corrected.length === 13 && !isValidEAN13Checksum(corrected)) {
                    corrected = fixChecksum(corrected, 13);
                } else if (corrected.length === 8 && !isValidEAN8Checksum(corrected)) {
                    corrected = fixChecksum(corrected, 8);
                }
                
                return corrected !== number ? corrected : null;
            }
            
            // إصلاح checksum
            function fixChecksum(number, length) {
                if (length === 13) {
                    let sum = 0;
                    for (let i = 0; i < 12; i++) {
                        sum += (i % 2 === 0 ? 1 : 3) * parseInt(number[i]);
                    }
                    const checksum = (10 - (sum % 10)) % 10;
                    return number.substring(0, 12) + checksum;
                } else if (length === 8) {
                    let sum = 0;
                    for (let i = 0; i < 7; i++) {
                        sum += (i % 2 === 0 ? 3 : 1) * parseInt(number[i]);
                    }
                    const checksum = (10 - (sum % 10)) % 10;
                    return number.substring(0, 7) + checksum;
                }
                return number;
            }
            
            // إيقاف فحص OCR المستمر
            function stopContinuousOCRScan() {
                // يتم إيقافه تلقائياً عند تغيير الوضع
            }
            
            // تحديث مؤشر الوضع
            function updateModeIndicator() {
                if (modeIndicator) {
                    modeIndicator.textContent = `وضع القراءة: ${currentMode === 'barcode' ? 'باركود' : 'رقم'}`;
                }
            }
            
            // معالجة الباركود
            function processBarcode(code, source) {
                if (isProcessing) return;
                isProcessing = true;
                
                console.log(`معالجة الباركود من ${source}:`, code);
                
                if (barcodeInput.value !== code) {
                    barcodeInput.value = code;
                }
                
                showStatusMessage(`تم اكتشاف ${source === 'ocr' ? 'رقم' : 'باركود'}: ${code}`, 'success');
                
                setTimeout(() => {
                    stopScanner();
                    searchProduct(code, 'barcode');
                    isProcessing = false;
                }, 500);
            }
            
            // إيقاف الماسح الضوئي
            function stopScanner() {
                if (scannerActive) {
                    if (currentMode === 'barcode') {
                        Quagga.stop();
                    }
                    scannerActive = false;
                    lastReadValues = [];
                    startScannerButton.disabled = false;
                    
                    // إيقاف تدفق الفيديو
                    const videoElement = document.querySelector('#interactive video');
                    if (videoElement && videoElement.srcObject) {
                        videoElement.srcObject.getTracks().forEach(track => track.stop());
                    }
                    
                    scannerContainer.style.display = 'none';
                    showStatusMessage('', '');
                }
            }
            
            // البحث عن المنتج
            function searchProduct(searchValue, searchType) {
                showStatusMessage('جاري البحث...', 'success');
                
                fetch('test.txt')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('فشل تحميل ملف البيانات');
                        }
                        return response.text();
                    })
                    .then(data => {
                        const lines = data.split('\n');
                        let foundProducts = [];
                        
                        for (let line of lines) {
                            const [productName, productPrice, barcode] = line.split('/').map(item => item.trim());
                            if (searchType === 'barcode' && barcode === searchValue) {
                                foundProducts.push({ productName, productPrice, barcode });
                                break;
                            } else if (searchType === 'name' && productName.toLowerCase().includes(searchValue.toLowerCase())) {
                                foundProducts.push({ productName, productPrice, barcode });
                            }
                        }
                        
                        if (foundProducts.length > 0) {
                            if (searchType === 'barcode') {
                                displayProductInfo(foundProducts[0]);
                                addToSearchHistory(foundProducts[0]);
                            } else {
                                displayNameSearchResults(foundProducts);
                            }
                        } else {
                            if (searchType === 'barcode') {
                                displayProductInfo(null);
                            } else {
                                displayNameSearchResults([]);
                            }
                        }
                        
                        showStatusMessage('', '');
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        showStatusMessage(error.message, 'error');
                    });
            }
            
            // عرض معلومات المنتج
            function displayProductInfo(product) {
                const productInfo = document.getElementById('product-info');
                
                if (product) {
                    productInfo.innerHTML = `
                        <div class="info-row product-name">
                            <span class="info-label">اسم المنتج:</span>
                            <span class="info-value">${product.productName}</span>
                        </div>
                        <div class="info-row product-price">
                            <span class="info-label">السعر:</span>
                            <span class="info-value">${product.productPrice} ₪</span>
                        </div>
                        <div class="info-row product-barcode">
                            <span class="info-label">الباركود:</span>
                            <span class="info-value">${product.barcode}</span>
                        </div>
                    `;
                } else {
                    productInfo.innerHTML = `
                        <div class="not-found">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>المنتج غير موجود في قاعدة البيانات</p>
                        </div>
                    `;
                }
                
                openPopup();
            }
            
            // عرض نتائج البحث بالاسم
            function displayNameSearchResults(products) {
                const resultsContainer = document.getElementById('name-search-results');
                
                if (products.length > 0) {
                    let html = '<div class="search-results-list">';
                    html += `<h3>تم العثور على ${products.length} نتيجة:</h3>`;
                    
                    products.forEach(product => {
                        html += `
                            <div class="product-result" data-barcode="${product.barcode}">
                                <h4>${product.productName}</h4>
                                <p>السعر: ${product.productPrice} ₪ | الباركود: ${product.barcode}</p>
                                <button class="btn btn-secondary view-product" style="margin-top: 5px;">عرض التفاصيل</button>
                            </div>
                        `;
                    });
                    
                    html += '</div>';
                    resultsContainer.innerHTML = html;
                    
                    // إضافة مستمعات الأحداث للأزرار
                    document.querySelectorAll('.view-product').forEach(button => {
                        button.addEventListener('click', function() {
                            const barcode = this.closest('.product-result').getAttribute('data-barcode');
                            const product = products.find(p => p.barcode === barcode);
                            displayProductInfo(product);
                            addToSearchHistory(product);
                        });
                    });
                } else {
                    resultsContainer.innerHTML = `
                        <div class="not-found">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>لا توجد منتجات مطابقة للبحث</p>
                        </div>
                    `;
                }
            }
            
            // إضافة إلى سجل البحث
            function addToSearchHistory(product) {
                if (!product) return;
                
                // تجنب التكرار
                const existingIndex = searchHistoryData.findIndex(item => item.barcode === product.barcode);
                if (existingIndex !== -1) {
                    searchHistoryData.splice(existingIndex, 1);
                }
                
                // إضافة إلى بداية المصفوفة
                searchHistoryData.unshift({
                    name: product.productName,
                    price: product.productPrice,
                    barcode: product.barcode,
                    date: new Date().toISOString()
                });
                
                // الحفاظ على آخر 10 عمليات بحث فقط
                if (searchHistoryData.length > 10) {
                    searchHistoryData.pop();
                }
                
                // حفظ في localStorage
                localStorage.setItem('searchHistory', JSON.stringify(searchHistoryData));
                
                // تحديث العرض
                renderSearchHistory();
            }
            
            // عرض سجل البحث
            function renderSearchHistory() {
                searchHistory.innerHTML = '';
                
                if (searchHistoryData.length === 0) {
                    searchHistory.innerHTML = '<li style="text-align: center; padding: 20px; color: #666;">لا توجد عمليات بحث سابقة</li>';
                    return;
                }
                
                searchHistoryData.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'history-item';
                    li.innerHTML = `
                        <div class="history-item-info">
                            <div class="history-item-name">${item.name}</div>
                            <div class="history-item-details">
                                <span>${item.price} ₪</span>
                                <span>${formatDate(item.date)}</span>
                                <span>${item.barcode}</span>
                            </div>
                        </div>
                        <div class="history-item-actions">
                            <button class="action-btn view" title="عرض"><i class="fas fa-eye"></i></button>
                            <button class="action-btn delete" title="حذف"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    
                    // إضافة مستمعات الأحداث
                    li.querySelector('.view').addEventListener('click', () => {
                        searchProduct(item.barcode, 'barcode');
                    });
                    
                    li.querySelector('.delete').addEventListener('click', () => {
                        deleteSearchHistoryItem(item.barcode);
                    });
                    
                    searchHistory.appendChild(li);
                });
            }
            
            // حذف عنصر من سجل البحث
            function deleteSearchHistoryItem(barcode) {
                searchHistoryData = searchHistoryData.filter(item => item.barcode !== barcode);
                localStorage.setItem('searchHistory', JSON.stringify(searchHistoryData));
                renderSearchHistory();
            }
            
            // تنسيق التاريخ
            function formatDate(isoString) {
                const date = new Date(isoString);
                return date.toLocaleString('ar-SA');
            }
            
            // عرض رسالة الحالة
            function showStatusMessage(message, type) {
                statusMessage.textContent = message;
                statusMessage.className = 'status-message';
                if (type) {
                    statusMessage.classList.add(type);
                }
            }
            
            // فتح النافذة المنبثقة
            function openPopup() {
                popup.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }
            
            // إغلاق النافذة المنبثقة
            function closePopup() {
                popup.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
            
            // طباعة النتيجة
            function printResult() {
                const printContent = `
                    <div style="font-family: 'Tajawal', sans-serif; text-align: right; direction: rtl; padding: 20px;">
                        <h2 style="color: #4361ee; border-bottom: 2px solid #4361ee; padding-bottom: 10px; margin-bottom: 20px;">
                            تفاصيل المنتج
                        </h2>
                        ${document.getElementById('product-info').innerHTML}
                        <p style="margin-top: 30px; font-size: 12px; color: #666; text-align: left;">
                            تم الطباعة في ${new Date().toLocaleString('ar-SA')}
                        </p>
                    </div>
                `;
                
                const printWindow = window.open('', '_blank');
                printWindow.document.write(`
                    <html>
                        <head>
                            <title>طباعة تفاصيل المنتج</title>
                            <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
                            <style>
                                body { margin: 0; padding: 0; }
                                @media print {
                                    @page { size: auto; margin: 10mm; }
                                }
                            </style>
                        </head>
                        <body>
                            ${printContent}
                        </body>
                    </html>
                `);
                printWindow.document.close();
                printWindow.focus();
                setTimeout(() => {
                    printWindow.print();
                    printWindow.close();
                }, 500);
            }
            
            // التحكم في التكبير
            async function setZoom(zoomValue) {
                if (videoTrack) {
                    try {
                        await videoTrack.applyConstraints({
                            advanced: [{ zoom: zoomValue }]
                        });
                        currentZoom = zoomValue;
                        updateZoomButtons();
                    } catch (err) {
                        console.error("فشل ضبط التكبير:", err);
                    }
                }
            }
            
            // تكبير
            function zoomIn() {
                if (currentZoom < maxZoom) {
                    setZoom(Math.min(currentZoom + zoomStep, maxZoom));
                }
            }
            
            // تصغير
            function zoomOut() {
                if (currentZoom > minZoom) {
                    setZoom(Math.max(currentZoom - zoomStep, minZoom));
                }
            }
            
            // إعادة الضبط
            function resetZoom() {
                setZoom(1);
            }
            
            // تحديث أزرار التكبير
            function updateZoomButtons() {
                zoomInBtn.disabled = currentZoom >= maxZoom;
                zoomOutBtn.disabled = currentZoom <= minZoom;
            }
            
            // ضبط التركيز
            async function adjustFocus(event) {
                if (videoTrack) {
                    try {
                        const rect = event.target.getBoundingClientRect();
                        const x = (event.clientX - rect.left) / rect.width;
                        const y = (event.clientY - rect.top) / rect.height;
                        
                        await videoTrack.applyConstraints({
                            advanced: [{ focusMode: "manual", focusPointX: x, focusPointY: y }]
                        });
                    } catch (err) {
                        console.error("فشل ضبط التركيز:", err);
                    }
                }
            }
            
            // إضافة زر للتبديل بين الوضعين يدوياً
            function addManualModeSwitch() {
                const switchButton = document.createElement('button');
                switchButton.className = 'btn';
                switchButton.id = 'switch-mode';
                switchButton.innerHTML = '<i class="fas fa-exchange-alt"></i> تبديل الوضع';
                switchButton.style.marginTop = '10px';
                
                switchButton.addEventListener('click', () => {
                    if (currentMode === 'barcode') {
                        switchToOCRMode();
                    } else {
                        switchToBarcodeMode();
                    }
                });
                
                const scannerControls = document.querySelector('.scanner-zoom-controls');
                if (scannerControls) {
                    scannerControls.parentNode.insertBefore(switchButton, scannerControls.nextSibling);
                }
            }
            
            // إنشاء زر التبديل عند بدء الماسح
            startScannerButton.addEventListener('click', () => {
                setTimeout(addManualModeSwitch, 100);
            });
            
            // تنظيف عند إغلاق الصفحة
            window.addEventListener('beforeunload', () => {
                stopScanner();
                if (ocrWorker) {
                    ocrWorker.terminate();
                }
            });
        });
    </script>
