<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode Scanner and Search</title>
  <style>
/* General Styles */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #00b4d8, #0077b6, #90e0ef);
  margin: 0;
  padding: 0;
  text-align: center;
  color: #333;
  position: relative;
  overflow: hidden;
  animation: backgroundMove 30s linear infinite; /* حركة للخلفية */
}

/* تأثير الشلال المائي */
@keyframes waterfall {
  0% { top: -100%; opacity: 0; }
  50% { top: 50%; opacity: 0.5; }
  100% { top: 100%; opacity: 1; }
}

.waterfall {
  position: absolute;
  top: -100%;
  left: 0;
  width: 100%;
  height: 150px;
  background: rgba(255, 255, 255, 0.5);
  animation: waterfall 3s infinite;
  opacity: 0.8;
  z-index: -1;
}

/* تأثير الأمواج */
@keyframes waves {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.wave {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background: rgba(255, 255, 255, 0.6);
  background-image: url('https://www.transparenttextures.com/patterns/waves.png'); /* يمكنك تغيير الرابط إلى صورة أمواج أخرى */
  animation: waves 5s linear infinite;
  z-index: -2;
}

/* حركة مستمرة للخلفية */
@keyframes backgroundMove {
  0% { background-position: 0 0; }
  50% { background-position: 100% 100%; }
  100% { background-position: 0 0; }
}

/* تحسين مظهر النص */
h1, p {
  color: white;
  text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
}

/* تحسين الأزرار */
button {
  padding: 10px 20px;
  font-size: 18px;
  background-color: #ff6f61;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color 0.3s;
}

button:hover {
  background-color: #ff3e1d;
}

/* تحسين التباين */
.container {
  padding: 20px;
  max-width: 1200px;
  margin: 0 auto;
}

/* تحسين التوافق مع الأجهزة المحمولة */
@media (max-width: 768px) {
  body {
    text-align: left;
    padding: 10px;
  }

  h1 {
    font-size: 24px;
  }

  p {
    font-size: 16px;
  }

  button {
    font-size: 16px;
    padding: 8px 16px;
  }
}

h1 {
  color: #020000;  /* Gold color for the heading */
  font-size: 2.8rem;
  text-shadow: 2px 2px 15px rgba(0, 0, 0, 0.6);
  margin-top: 30px;
  animation: fadeIn 2s ease-in-out;
}

/* Fade-in animation for h1 */
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

/* Container Styling */
.container {
  max-width: 800px;
  width: 90%;
  margin: 30px auto;
  padding: 30px;
  background-color: rgba(255, 255, 255, 0.9); /* Transparent white background */
  border-radius: 20px;
  box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
  animation: slideIn 1.5s ease-out;
}

/* Slide-in animation for container */
@keyframes slideIn {
  from {
    transform: translateY(20px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

/* Scanner Styles */
#scanner-container {
  position: relative;
  width: 100%;
  border-radius: 15px;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.5);
  box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.2);
  animation: scaleUp 0.8s ease-in-out;
}

@keyframes scaleUp {
  from {
    transform: scale(0.95);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

#scanner-container video {
  width: 100%;
  height: auto;
  border-radius: 15px;
  opacity: 0.9;
}

/* Input and Button Styles */
input[type="text"] {
  width: 100%;
  max-width: 100%; /* لضمان أن العرض لا يتجاوز العرض الكامل */
  padding: 12px;
  font-size: 18px;
  border: 2px solid #ddd;
  border-radius: 10px;
  margin-top: 20px;
  outline: none;
  transition: border 0.3s ease, box-shadow 0.3s ease;
  box-sizing: border-box; /* لتضمين الحدود والمسافات الداخلية ضمن العرض الكلي */
}

/* تحسين التوافق مع الأجهزة المحمولة */
@media (max-width: 768px) {
  input[type="text"] {
    font-size: 16px; /* تصغير الخط في الشاشات الصغيرة */
    padding: 10px; /* تقليل المسافات الداخلية لتناسب الشاشة الصغيرة */
  }
}

input[type="text"]:focus {
  border-color: #ff9900;
  box-shadow: 0 0 10px rgba(255, 136, 0, 0.5);
}

button {
  margin-top: 20px;
  padding: 12px 30px;
  font-size: 18px;
  color: rgb(0, 0, 0);
  background-color: #ffae00;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: background-color 0.3s ease, transform 0.2s ease;
}

button:hover {
  background-color: #0056b3;
  transform: translateY(-3px);
}

button:disabled {
  background-color: #aaa;
  cursor: not-allowed;
}

/* Submit Button Style */
input[type="submit"] {
  width: 90%;
  padding: 12px 0;
  font-size: 18px;
  color: white;
  background-color: #0058bde7;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: background-color 0.3s ease;
  margin-top: 20px;
}

input[type="submit"]:hover {
  background-color: #047bca;
  transform: translateY(-3px);
}

input[type="submit"]:disabled {
  background-color: #aaa;
  cursor: not-allowed;
}

/* Status Message */
#status-message {
  margin-top: 10px;
  font-weight: bold;
}

.success {
  color: #28a745;
}

.error {
  color: #dc3545;
}

/* Responsive Design */
@media screen and (max-width: 768px) {
  .container {
    padding: 15px;
  }

  h1 {
  font-size: 1.2rem;
  text-align: center; /* لمحاذاة النص أفقيًا */
  display: flex; /* استخدام flexbox */
  align-items: center; /* محاذاة النص عموديًا */
  justify-content: center; /* محاذاة النص في المنتصف أفقياً وعمودياً */
  height: 100%; /* لضمان أن الحاوية تمتلك ارتفاعًا كافيًا لمحاذاة العنصر عموديًا */
}

  input[type="text"], button, input[type="submit"] {
    width: 100%;
    font-size: 16px;
  }
}

/* Popup Styles */
.popup {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #fff;
  border-radius: 16px;
  padding: 30px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
  z-index: 9999;
  width: 400px;
  animation: popupAnimation 0.5s ease-out;
  overflow: hidden;
}

@keyframes popupAnimation {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.8);
  }
  100% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}

/* Content Frame */
.popup .content-frame {
  border: 2px solid #ddd;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  background-color: #f9f9f9;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

/* Heading Styles */
.popup h2 {
  font-size: 1.8rem;
  color: #333;
  font-weight: bold;
  margin-bottom: 15px;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* Detail Box */
.detail-box {
  font-size: 1.1rem;
  color: #666;
  margin-bottom: 15px;
  text-align: center;
}

/* Price Frame */
.price-frame {
  border: 3px solid #2196F3;
  border-radius: 10px;
  padding: 15px;
  background: linear-gradient(145deg, #2196F3, #0d47a1);
  box-shadow: 0 0 10px rgba(33, 150, 243, 0.5);
  text-align: center;
  margin-top: 15px;
}

.price-frame .price {
  font-size: 1.6rem;
  font-weight: bold;
  color: #fff;
  text-shadow: 0 0 10px rgba(33, 150, 243, 0.8);
}

/* Barcode Frame */
.barcode-frame {
  border: 2px solid #4CAF50;
  border-radius: 10px;
  padding: 15px;
  background-color: #e8f5e9;
  margin-top: 20px;
  box-shadow: 0 0 10px rgba(76, 175, 80, 0.4);
}

.barcode-frame img {
  width: 100%;
  max-width: 250px;
  display: block;
  margin: 0 auto;
}

/* Close Button */
.close-btn {
  background: #FF5722;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 12px 25px;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.3s ease, transform 0.2s ease;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  margin-top: 20px;
  display: block;
  width: 100%;
}

.close-btn:hover {
  background: #e64a19;
  transform: scale(1.05);
}

.close-btn:active {
  transform: scale(0.98);
}

/* Mobile Responsiveness */
@media (max-width: 768px) {
  .popup {
    width: 90%;
    padding: 20px;
    text-align: center; /* توسيط النصوص داخل الحاوية */
  }

  .popup h2 {
    font-size: 1.5rem;
    text-align: center; /* توسيط العنوان */
  }

  .detail-box {
    font-size: 1rem;
    text-align: center; /* توسيط النصوص */
  }

  .price-frame .price {
    font-size: 1.4rem;
    text-align: center; /* توسيط النص */
  }

  .barcode-frame img {
    max-width: 200px;
    display: block; /* لجعل الصورة عنصر بلوك */
    margin: 0 auto; /* لتوسيط الصورة أفقياً */
  }

  .close-btn {
    padding: 10px 20px;
    font-size: 0.9rem;
    display: block; /* جعل الزر عنصر بلوك */
    margin: 10px auto; /* لتوسيط الزر أفقياً */
    text-align: center; /* توسيط النص داخل الزر */
  }
}
.footer {
      background-color: #00f7ea15; /* خلفية سوداء */
      color: #fff; /* النص باللون الأبيض */
      text-align: center; /* توسيط النص */
      padding: 20px; /* مسافة داخلية من الأعلى والأسفل */
      font-family: Arial, sans-serif; /* خط النص */
      font-size: 10px; /* حجم النص */
      line-height: 1.5; /* تباعد بين الأسطر */
    }
    .footer .line {
      margin: 5px 0; /* مسافة صغيرة بين الأسطر */
    }
  </style>
</head>
<body>

  <div id="scanner-container">
    <div id="interactive" class="viewport"></div>
  </div>

  <div class="container">
    <h1>بحث المنتجات باستخدام الباركود</h1>

    <form id="barcode-form">
      <input type="text" id="barcode-input" placeholder=" Start Scanner أدخل الباركود يدويا أو استخدم " required>
      <input type="submit" value="بحث">
    </form>
  </div>

  <div class="popup" id="result-popup">
    <h2>نتائج البحث:</h2>
    <div class="detail-box" id="product-name">
      <strong>الاسم:</strong> <span id="product-name-result">-</span>
    </div>
    <div class="price-box" id="product-price">
      <strong>السعر:</strong> <span id="product-price-result">-</span>
    </div>
    <div class="detail-box" id="product-barcode">
      <strong>الباركود:</strong> <span id="product-barcode-result">-</span>
    </div>
    <button class="close-btn" onclick="closePopup()">إغلاق</button>
  </div>

  <button id="start-scanner">Start Scanner</button>
  <p id="status-message"></p>

  <div class="footer">
    <div class="line">جميع الحقوق محفوظة © 2024 | All Rights Reserved</div>
    <div class="line">تصميم وتطوير بواسطة محمد شحادة | Designed and Developed by Mohammed Shehadeh</div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <script>
    const barcodeInput = document.getElementById('barcode-input');
    const popup = document.getElementById('result-popup');
    const startScannerButton = document.getElementById('start-scanner');
    const statusMessage = document.getElementById('status-message');
    const scannerContainer = document.getElementById('scanner-container');
    const form = document.getElementById('barcode-form');
  
    let lastReadValues = [];
    let isProcessing = false;
    let scannerActive = false;
  
    document.addEventListener('DOMContentLoaded', () => {
      scannerContainer.style.display = 'none'; // إخفاء واجهة الماسح عند تحميل الصفحة
    });
  
// بدء الماسح
function startScanner() {
  startScannerButton.disabled = true;
  statusMessage.textContent = '';
  scannerContainer.style.display = 'block';

  // إعداد الكاميرا
  navigator.mediaDevices
    .getUserMedia({
      video: {
        facingMode: 'environment',
        width: { ideal: 1920 },
        height: { ideal: 1080 },
      },
    })
    .then((stream) => {
      const videoElement = document.querySelector('#interactive');
      videoElement.srcObject = stream;
      videoElement.play();

      // إعداد زر التقاط الصورة
      captureButton.addEventListener('click', () => {
        captureAndDecode(videoElement, stream);
      });
    })
    .catch((err) => {
      console.error('Error accessing camera:', err);
      statusMessage.textContent = 'خطأ في تشغيل الكاميرا.';
      startScannerButton.disabled = false;
    });
}

// التقاط الصورة وتحليلها
function captureAndDecode(videoElement, stream) {
  const canvas = document.createElement('canvas');
  canvas.width = videoElement.videoWidth;
  canvas.height = videoElement.videoHeight;

  // رسم إطار الفيديو على الـCanvas
  const context = canvas.getContext('2d');
  context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

  // تحويل الصورة إلى بيانات
  const imageData = canvas.toDataURL('image/png');

  // تمرير الصورة إلى Quagga لتحليلها
  Quagga.decodeSingle(
    {
      src: imageData, // الصورة التي تم التقاطها
      decoder: {
        readers: ['code_128_reader', 'ean_reader', 'ean_8_reader'],
      },
    },
    function (result) {
      if (result && result.codeResult) {
        console.log('Barcode detected:', result.codeResult.code);
        processBarcode(result.codeResult.code);
      } else {
        console.log('No barcode detected. Try again.');
        statusMessage.textContent = 'لم يتم اكتشاف أي باركود. حاول مرة أخرى.';
      }
    }
  );
}

// التحقق من صحة الباركود
function isValidBarcode(code) {
  if (!code) return false;

  lastReadValues.push(code);
  if (lastReadValues.length > 3) lastReadValues.shift();

  return lastReadValues.every((val) => val === code);
}

// معالجة الباركود
function processBarcode(code) {
  if (isProcessing) return;
  isProcessing = true;

  setTimeout(() => {
    barcodeInput.value = code; // إدخال الباركود في الحقل
    stopScanner();
    form.querySelector('input[type="submit"]').click(); // تنفيذ الضغط على زر البحث تلقائيًا
    isProcessing = false;
  }, 500);
}

// إيقاف الكاميرا
function stopScanner() {
  const videoElement = document.querySelector('#interactive');
  const stream = videoElement.srcObject;

  if (stream) {
    const tracks = stream.getTracks();
    tracks.forEach((track) => track.stop());
  }

  videoElement.srcObject = null;
  scannerActive = false;
}
  
    // التحقق من صحة الباركود
    function isValidBarcode(code) {
      if (!code) return false;
  
      lastReadValues.push(code);
      if (lastReadValues.length > 3) lastReadValues.shift();
  
      return lastReadValues.every((val) => val === code);
    }
  
    // معالجة الباركود
    function processBarcode(code) {
      if (isProcessing) return;
      isProcessing = true;
  
      setTimeout(() => {
        barcodeInput.value = code; // إدخال الباركود في الحقل
        stopScanner();
        form.querySelector('input[type="submit"]').click(); // تنفيذ الضغط على زر البحث تلقائيًا
        isProcessing = false;
      }, 500);
    }
  
    // إيقاف الماسح
    function stopScanner() {
      if (scannerActive) {
        Quagga.stop();
        scannerActive = false;
        lastReadValues = [];
        startScannerButton.disabled = false;
      }
    }
  
    // قراءة النصوص أسفل الباركود باستخدام Tesseract.js
    function readBarcodeWithOCR() {
      const videoElement = document.querySelector('#interactive video');
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      const width = videoElement.videoWidth;
      const height = videoElement.videoHeight;
  
      canvas.width = width;
      canvas.height = height;
  
      // رسم الإطار الحالي للكاميرا على الـ canvas
      context.drawImage(videoElement, 0, 0, width, height);
  
      // استخدام Tesseract.js لقراءة النصوص من الصورة
      Tesseract.recognize(
        canvas.toDataURL(),
        'eng', // تحديد اللغة (يمكنك إضافة المزيد من اللغات هنا)
        {
          logger: (m) => console.log(m), // لعرض التقدم
        }
      ).then(({ data: { text } }) => {
        const extractedText = text.replace(/\s+/g, '').trim();
        if (extractedText) {
          // إضافة الرقم المستخرج في حال وجوده
          console.log('النص المستخرج باستخدام OCR:', extractedText);
          if (isValidBarcode(extractedText)) {
            processBarcode(extractedText); // إذا كان النص المستخرج هو باركود صحيح، يعالجونه
          }
        }
      });
    }
  
    // البحث عن المنتج
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const barcodeValue = barcodeInput.value.trim();
      if (!barcodeValue) {
        alert('الرجاء إدخال الباركود.');
        return;
      }
  
      fetch('test.txt')
        .then((response) => {
          if (!response.ok) {
            throw new Error('فشل تحميل ملف البيانات.');
          }
          return response.text();
        })
        .then((data) => {
          const lines = data.split('\n');
          let found = false;
  
          for (let line of lines) {
            const [productName, productPrice, barcode] = line.split('/');
            if (barcode && barcode.trim() === barcodeValue) {
              document.getElementById('product-name-result').textContent = productName;
              document.getElementById('product-price-result').textContent = productPrice;
              document.getElementById('product-barcode-result').textContent = barcode;
              found = true;
              break;
            }
          }
  
          if (!found) {
            document.getElementById('product-name-result').textContent = 'المنتج غير موجود';
            document.getElementById('product-price-result').textContent = '-';
            document.getElementById('product-barcode-result').textContent = '-';
          }
  
          openPopup();
          scannerContainer.style.display = 'none'; // إخفاء واجهة الماسح بعد البحث
        })
        .catch((error) => {
          alert(error.message);
        });
    });
  
    // عرض النافذة المنبثقة
    function openPopup() {
      popup.style.display = 'block';
    }
  
    // إغلاق النافذة المنبثقة
    function closePopup() {
      popup.style.display = 'none';
      barcodeInput.focus();
    }
  
    // إضافة مستمع لزر بدء الماسح
    startScannerButton.addEventListener('click', startScanner);
  </script>
      </body>
</html>
