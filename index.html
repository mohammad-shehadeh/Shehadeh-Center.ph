<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام مسح الباركود المتقدم</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        #scanner-container {
            position: relative;
            margin: 20px 0;
            border: 2px solid #3498db;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }
        #interactive {
            position: relative;
            width: 100%;
            height: 300px;
        }
        #interactive video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #barcode-box {
            position: absolute;
            border: 3px solid #e74c3c;
            border-radius: 5px;
            box-shadow: 0 0 0 10000px rgba(0,0,0,0.5);
            display: none;
            z-index: 10;
        }
        #start-scanner {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin: 20px 0;
            transition: background-color 0.3s;
        }
        #start-scanner:hover {
            background-color: #2980b9;
        }
        #start-scanner:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #status-message {
            text-align: center;
            margin: 10px 0;
            color: #e74c3c;
            font-weight: bold;
            min-height: 20px;
        }
        #barcode-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #barcode-input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        #barcode-form input[type="submit"] {
            padding: 12px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #barcode-form input[type="submit"]:hover {
            background-color: #27ae60;
        }
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            z-index: 100;
            width: 90%;
            max-width: 500px;
        }
        .popup h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
        }
        .detail-box, .price-box {
            background-color: #f9f9f9;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .price-box {
            background-color: #e8f8f5;
            border-left: 4px solid #2ecc71;
        }
        .close-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        .close-btn:hover {
            background-color: #c0392b;
        }
        #zoom-controls-barcode {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }
        #zoom-controls-barcode button {
            padding: 8px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #zoom-controls-barcode button:hover {
            background-color: #2980b9;
        }
        #zoom-controls-barcode button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 10px;
            color: #7f8c8d;
            font-size: 14px;
        }
        .flash {
            animation: flash 0.5s;
        }
        @keyframes flash {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>بحث المنتجات باستخدام الباركود</h1>

        <div id="scanner-container">
            <div id="interactive" class="viewport"></div>
            <div id="barcode-box"></div>
        </div>
        
        <button id="start-scanner">✨AI Scanner</button>
        <p id="status-message"></p>
        
        <div id="zoom-controls-barcode">
            <button id="reset-zoom-barcode" onclick="resetZoom()">🔄 الضبط</button>
            <button id="zoom-out-barcode" onclick="zoomOut()">🔎 تصغير</button>
            <button id="zoom-in-barcode" onclick="zoomIn()">🔍 تكبير</button>
            <button id="toggle-flash" onclick="toggleFlash()">💡 فلاش</button>
        </div>

        <div class="popup" id="result-popup">
            <h2>نتائج البحث:</h2>
            <div class="detail-box" id="product-name">
                <strong>الاسم:</strong> <span id="product-name-result">-</span>
            </div>
            <div class="price-box" id="product-price">
                <strong>السعر:</strong> <span id="product-price-result">-</span>
            </div>
            <div class="detail-box" id="product-barcode">
                <strong>الباركود:</strong> <span id="product-barcode-result">-</span>
            </div>
            <button class="close-btn" onclick="closePopup()">إغلاق</button>
        </div>

        <br>
        <form id="barcode-form">
            <input type="text" id="barcode-input" placeholder="Start Scanner أدخل الباركود يدويا أو استخدم " required>
            <input type="submit" value="بحث">
        </form>
    </div>

    <div class="footer">
        <div class="line">تصميم وتطوير بواسطة محمد شحادة | Designed and Developed by Mohammed Shehadeh</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script>
        const barcodeInput = document.getElementById('barcode-input');
        const popup = document.getElementById('result-popup');
        const startScannerButton = document.getElementById('start-scanner');
        const statusMessage = document.getElementById('status-message');
        const scannerContainer = document.getElementById('scanner-container');
        const barcodeBox = document.getElementById('barcode-box');
        const form = document.getElementById('barcode-form');
        const toggleFlashBtn = document.getElementById('toggle-flash');

        let lastReadValues = [];
        let isProcessing = false;
        let scannerActive = false;
        let videoTrack = null;
        let currentZoom = 1;
        let minZoom = 1;
        let maxZoom = 5;
        let zoomStep = 0.5;
        let flashOn = false;
        let barcodeDetectionInterval;

        document.addEventListener('DOMContentLoaded', () => {
            scannerContainer.style.display = 'none';
        });

        // بدء الماسح الضوئي
        async function startScanner() {
            startScannerButton.disabled = true;
            statusMessage.textContent = 'جاري تهيئة الماسح...';
            scannerContainer.style.display = 'block';

            try {
                const constraints = {
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        focusMode: "continuous",
                        zoom: currentZoom
                    }
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                const videoElement = document.querySelector('#interactive video') || createVideoElement();
                videoElement.srcObject = stream;
                
                videoTrack = stream.getVideoTracks()[0];
                const capabilities = videoTrack.getCapabilities();
                
                if (capabilities.zoom) {
                    minZoom = capabilities.zoom.min || 1;
                    maxZoom = capabilities.zoom.max || 5;
                    zoomStep = capabilities.zoom.step || 0.5;
                }

                updateZoomButtons();
                setupBarcodeDetection();
                
                videoElement.addEventListener("click", adjustFocus);
                videoElement.addEventListener("touchstart", adjustFocus);

                statusMessage.textContent = 'جاهز للمسح. ركز الكاميرا على الباركود.';
            } catch (error) {
                console.error('خطأ في تشغيل الكاميرا:', error);
                statusMessage.textContent = 'خطأ في تشغيل الكاميرا. تأكد من السماح بالوصول إلى الكاميرا.';
                startScannerButton.disabled = false;
            }
        }

        function createVideoElement() {
            const video = document.createElement('video');
            video.setAttribute('autoplay', '');
            video.setAttribute('playsinline', '');
            document.getElementById('interactive').appendChild(video);
            return video;
        }

        function setupBarcodeDetection() {
            Quagga.init({
                inputStream: {
                    name: 'Live',
                    type: 'LiveStream',
                    target: document.querySelector('#interactive'),
                    constraints: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                },
                locator: {
                    patchSize: 'medium',
                    halfSample: true
                },
                decoder: {
                    readers: ['code_128_reader', 'ean_reader', 'ean_8_reader', 'upc_reader', 'upc_e_reader'],
                    multiple: false
                },
                locate: true,
                numOfWorkers: navigator.hardwareConcurrency || 4,
                frequency: 10
            }, function(err) {
                if (err) {
                    console.error('Error initializing Quagga:', err);
                    statusMessage.textContent = 'خطأ في تشغيل الماسح.';
                    startScannerButton.disabled = false;
                    return;
                }
                Quagga.start();
                scannerActive = true;
                startBarcodeBoxDetection();
            });

            Quagga.onDetected(async (data) => {
                const code = data.codeResult.code;
                if (isValidBarcode(code)) {
                    showBarcodeBox(data.codeResult.box);
                    processBarcode(code);
                } else {
                    statusMessage.textContent = 'جاري التحقق من الباركود...';
                    try {
                        const ocrResult = await readBarcodeWithOCR();
                        if (ocrResult && isValidBarcode(ocrResult)) {
                            processBarcode(ocrResult);
                        }
                    } catch (error) {
                        console.error('OCR Error:', error);
                    }
                }
            });
        }

        function startBarcodeBoxDetection() {
            barcodeDetectionInterval = setInterval(() => {
                if (Quagga && Quagga.canvas && Quagga.canvas.ctx) {
                    const canvas = Quagga.canvas.dom.overlay;
                    const ctx = Quagga.canvas.ctx.overlay;
                    
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    if (Quagga.selectedBox) {
                        const box = Quagga.selectedBox;
                        showBarcodeBox(box);
                    }
                }
            }, 100);
        }

        function showBarcodeBox(box) {
            if (!box || box.length !== 4) return;
            
            const videoElement = document.querySelector('#interactive video');
            if (!videoElement) return;
            
            const videoWidth = videoElement.videoWidth;
            const videoHeight = videoElement.videoHeight;
            const containerWidth = scannerContainer.offsetWidth;
            const containerHeight = scannerContainer.offsetHeight;
            
            // حساب موضع الصندوق
            const left = Math.min(...box.map(p => p[0])) / videoWidth * 100;
            const top = Math.min(...box.map(p => p[1])) / videoHeight * 100;
            const width = (Math.max(...box.map(p => p[0])) / videoWidth * 100 - left;
            const height = (Math.max(...box.map(p => p[1])) / videoHeight * 100 - top;
            
            barcodeBox.style.display = 'block';
            barcodeBox.style.left = `${left}%`;
            barcodeBox.style.top = `${top}%`;
            barcodeBox.style.width = `${width}%`;
            barcodeBox.style.height = `${height}%`;
        }

        // التحكم في التكبير
        async function setZoom(zoomValue) {
            if (!videoTrack) return;
            
            try {
                await videoTrack.applyConstraints({
                    advanced: [{ zoom: zoomValue }]
                });
                currentZoom = zoomValue;
                updateZoomButtons();
            } catch (err) {
                console.error("فشل ضبط التكبير:", err);
            }
        }

        function updateZoomButtons() {
            document.getElementById("zoom-in-barcode").disabled = currentZoom >= maxZoom;
            document.getElementById("zoom-out-barcode").disabled = currentZoom <= minZoom;
        }

        function zoomIn() {
            if (currentZoom < maxZoom) {
                setZoom(Math.min(currentZoom + zoomStep, maxZoom));
            }
        }

        function zoomOut() {
            if (currentZoom > minZoom) {
                setZoom(Math.max(currentZoom - zoomStep, minZoom));
            }
        }

        function resetZoom() {
            setZoom(1);
        }

        // التحكم في الفلاش
        async function toggleFlash() {
            if (!videoTrack) return;
            
            const capabilities = videoTrack.getCapabilities();
            if (!capabilities.torch) {
                statusMessage.textContent = 'الفلاش غير مدعوم في هذا الجهاز';
                return;
            }
            
            try {
                flashOn = !flashOn;
                await videoTrack.applyConstraints({
                    advanced: [{ torch: flashOn }]
                });
                toggleFlashBtn.textContent = flashOn ? '💡 إطفاء' : '💡 فلاش';
            } catch (err) {
                console.error("فشل التحكم في الفلاش:", err);
            }
        }

        // ضبط التركيز
        async function adjustFocus(event) {
            if (!videoTrack) return;
            
            try {
                const rect = event.target.getBoundingClientRect();
                const x = (event.clientX - rect.left) / rect.width;
                const y = (event.clientY - rect.top) / rect.height;
                
                await videoTrack.applyConstraints({
                    advanced: [{ focusMode: "manual", focusPointOfInterest: [x, y] }]
                });
                
                statusMessage.textContent = 'تم ضبط التركيز';
                setTimeout(() => statusMessage.textContent = '', 2000);
            } catch (err) {
                console.error("فشل ضبط التركيز:", err);
            }
        }

        // التحقق من صحة الباركود
        function isValidBarcode(code) {
            if (!code || code.length < 8) return false;
            
            // تحقق من التكرار لتأكيد القراءة
            lastReadValues.push(code);
            if (lastReadValues.length > 3) lastReadValues.shift();
            
            // يجب أن تكون جميع القراءات متطابقة
            const allSame = lastReadValues.every(val => val === code);
            if (!allSame) return false;
            
            // تحقق من checksum للباركود EAN-13
            if (code.length === 13) {
                let sum = 0;
                for (let i = 0; i < 12; i++) {
                    sum += (i % 2 === 0 ? 1 : 3) * parseInt(code[i]);
                }
                const checksum = (10 - (sum % 10)) % 10;
                return checksum === parseInt(code[12]);
            }
            
            return true;
        }

        // معالجة الباركود
        function processBarcode(code) {
            if (isProcessing) return;
            isProcessing = true;
            
            statusMessage.textContent = `تم اكتشاف الباركود: ${code}`;
            statusMessage.classList.add('flash');
            
            if (barcodeInput.value !== code) {
                barcodeInput.value = code;
            }
            
            setTimeout(() => {
                stopScanner();
                form.querySelector('input[type="submit"]').click();
                statusMessage.textContent = '';
                statusMessage.classList.remove('flash');
                isProcessing = false;
            }, 500);
        }

        // قراءة النص باستخدام OCR
        async function readBarcodeWithOCR() {
            const videoElement = document.querySelector('#interactive video');
            if (!videoElement) return null;
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            
            try {
                const { data: { text } } = await Tesseract.recognize(
                    canvas.toDataURL(),
                    'eng',
                    { logger: m => console.log(m) }
                );
                
                const extractedCode = text.replace(/\s+/g, '').trim();
                if (extractedCode && extractedCode.length >= 8) {
                    return extractedCode;
                }
                return null;
            } catch (error) {
                console.error('OCR Error:', error);
                return null;
            }
        }

        // إيقاف الماسح
        function stopScanner() {
            if (scannerActive) {
                Quagga.stop();
                clearInterval(barcodeDetectionInterval);
                scannerActive = false;
                
                if (videoTrack) {
                    videoTrack.stop();
                    videoTrack = null;
                }
                
                const videoElement = document.querySelector('#interactive video');
                if (videoElement) {
                    videoElement.srcObject = null;
                }
                
                barcodeBox.style.display = 'none';
                startScannerButton.disabled = false;
            }
        }

        // البحث عن المنتج
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const barcodeValue = barcodeInput.value.trim();
            
            if (!barcodeValue) {
                alert('الرجاء إدخال الباركود.');
                return;
            }
            
            // هنا يمكنك إضافة الكود للبحث في قاعدة البيانات أو الملف
            // هذا مثال للتوضيح فقط
            fetch('test.txt')
                .then(response => {
                    if (!response.ok) throw new Error('فشل تحميل ملف البيانات.');
                    return response.text();
                })
                .then(data => {
                    const lines = data.split('\n');
                    let found = false;
                    
                    for (let line of lines) {
                        const [productName, productPrice, barcode] = line.split('/');
                        if (barcode && barcode.trim() === barcodeValue) {
                            document.getElementById('product-name-result').textContent = productName;
                            document.getElementById('product-price-result').textContent = productPrice;
                            document.getElementById('product-barcode-result').textContent = barcode;
                            found = true;
                            break;
                        }
                    }
                    
                    if (!found) {
                        document.getElementById('product-name-result').textContent = 'المنتج غير موجود';
                        document.getElementById('product-price-result').textContent = '-';
                        document.getElementById('product-barcode-result').textContent = '-';
                    }
                    
                    openPopup();
                })
                .catch(error => {
                    alert(error.message);
                });
        });

        // عرض وإغلاق النافذة المنبثقة
        function openPopup() {
            popup.style.display = 'block';
        }

        function closePopup() {
            popup.style.display = 'none';
            barcodeInput.focus();
        }

        // إضافة مستمع لزر بدء الماسح
        startScannerButton.addEventListener('click', startScanner);

        // تسجيل Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(registration => {
                    console.log('Service Worker registered:', registration);
                })
                .catch(error => {
                    console.log('Service Worker registration failed:', error);
                });
        }
    </script>
</body>
</html>
