<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="نظام البحث الذكي عن المنتجات باستخدام الباركود أو اسم المنتج">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <title>نظام البحث الذكي - شحادة</title>

  <link rel="icon" href="https://www.shutterstock.com/image-vector/generate-ai-artificial-intelligence-logo-600nw-2492648971.jpg">
  <link rel="apple-touch-icon" href="https://www.shutterstock.com/image-vector/generate-ai-artificial-intelligence-logo-600nw-2492648971.jpg">
  <link rel="manifest" href="/manifest.json">
  
  <!-- إضافة خطوط Google -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- مكتبة SweetAlert2 للإشعارات الجميلة -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  
  <style>
    :root {
      --primary-color: #8e0e0e;
      --secondary-color: #000000;
      --accent-color: #ff6f61;
      --text-color: #ffffff;
      --light-gray: #f5f5f5;
      --dark-gray: #333333;
      --success-color: #28a745;
      --error-color: #dc3545;
      --warning-color: #ffc107;
      --info-color: #17a2b8;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
      color: var(--text-color);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      text-align: center;
    }
    
    /* تأثيرات الخلفية */
    .bg-pattern {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: -1;
      opacity: 0.5;
    }
    
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }
    
    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      animation: float 15s infinite linear;
    }
    
    @keyframes float {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) translateX(100px);
        opacity: 0;
      }
    }
    
    /* التصميم العام */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
    }
    
    .header {
      margin-bottom: 30px;
      position: relative;
    }
    
    .logo {
      max-width: 150px;
      height: auto;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
      animation: pulse 2s infinite ease-in-out;
    }
    
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }
    
    h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
      color: var(--text-color);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      position: relative;
      display: inline-block;
    }
    
    h1::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 3px;
      background: var(--accent-color);
      border-radius: 3px;
    }
    
    /* تصميم الماسح الضوئي */
    .scanner-section {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }
    
    .scanner-section:hover {
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      transform: translateY(-5px);
    }
    
    #scanner-container {
      position: relative;
      width: 100%;
      height: 300px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      background: #000;
      display: none;
    }
    
    #scanner-container.active {
      display: block;
    }
    
    #interactive {
      width: 100%;
      height: 100%;
      position: relative;
    }
    
    #interactive video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .scanner-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.7) 0%,
        rgba(0, 0, 0, 0) 20%,
        rgba(0, 0, 0, 0) 80%,
        rgba(0, 0, 0, 0.7) 100%
      );
      pointer-events: none;
    }
    
    .scanner-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 150px;
      border: 3px solid var(--accent-color);
      border-radius: 10px;
      box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5),
                  0 0 20px var(--accent-color);
      animation: scanner-frame-pulse 2s infinite ease-in-out;
    }
    
    @keyframes scanner-frame-pulse {
      0%, 100% {
        box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5),
                    0 0 20px var(--accent-color);
      }
      50% {
        box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5),
                    0 0 40px var(--accent-color);
      }
    }
    
    .scanner-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-color);
      animation: scanner-line 2s infinite linear;
    }
    
    @keyframes scanner-line {
      0% {
        top: 0;
      }
      100% {
        top: 100%;
      }
    }
    
    /* أزرار التحكم */
    .scanner-controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 12px 25px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
      color: white;
      box-shadow: 0 5px 15px rgba(142, 14, 14, 0.4);
    }
    
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(142, 14, 14, 0.6);
    }
    
    .btn-primary:active {
      transform: translateY(1px);
    }
    
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
    }
    
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .btn-icon {
      font-size: 20px;
    }
    
    /* تصميم البحث */
    .search-section {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .search-tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .tab-btn {
      padding: 10px 20px;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 700;
      cursor: pointer;
      position: relative;
      transition: all 0.3s ease;
    }
    
    .tab-btn.active {
      color: white;
    }
    
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--accent-color);
      border-radius: 3px 3px 0 0;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
      animation: fadeIn 0.5s ease;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .search-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .form-group {
      position: relative;
    }
    
    .search-input {
      width: 100%;
      padding: 15px 20px;
      font-size: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      background: rgba(0, 0, 0, 0.3);
      color: white;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }
    
    .search-input:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(142, 14, 14, 0.3);
    }
    
    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }
    
    .search-btn {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(142, 14, 14, 0.4);
    }
    
    .search-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(142, 14, 14, 0.6);
    }
    
    .search-btn:active {
      transform: translateY(1px);
    }
    
    /* نتائج البحث */
    .results-section {
      display: none;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeIn 0.5s ease;
    }
    
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .results-title {
      font-size: 1.5rem;
      color: var(--text-color);
    }
    
    .results-count {
      background: var(--primary-color);
      color: white;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
    }
    
    .product-card {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 20px;
      transition: all 0.3s ease;
      border-left: 3px solid var(--primary-color);
    }
    
    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      background: rgba(0, 0, 0, 0.4);
    }
    
    .product-image {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .product-image i {
      font-size: 30px;
      color: rgba(255, 255, 255, 0.3);
    }
    
    .product-info {
      flex: 1;
      text-align: right;
    }
    
    .product-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--text-color);
    }
    
    .product-details {
      display: flex;
      gap: 15px;
      margin-bottom: 5px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }
    
    .product-price {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-color);
    }
    
    .product-barcode {
      background: rgba(255, 255, 255, 0.1);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-family: monospace;
    }
    
    .no-results {
      text-align: center;
      padding: 30px;
      color: rgba(255, 255, 255, 0.7);
    }
    
    /* النافذة المنبثقة */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    
    .popup-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    
    .popup {
      background: linear-gradient(145deg, #1a1a1a, #000000);
      border-radius: 15px;
      width: 90%;
      max-width: 500px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      transform: scale(0.9);
      opacity: 0;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }
    
    .popup-overlay.active .popup {
      transform: scale(1);
      opacity: 1;
    }
    
    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .popup-title {
      font-size: 1.5rem;
      color: var(--text-color);
      font-weight: 700;
    }
    
    .close-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      font-size: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .close-btn:hover {
      color: var(--accent-color);
      transform: rotate(90deg);
    }
    
    .popup-content {
      margin-bottom: 25px;
    }
    
    .popup-row {
      display: flex;
      justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .popup-label {
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
    }
    
    .popup-value {
      color: var(--text-color);
      font-weight: 700;
    }
    
    .popup-price {
      font-size: 2rem;
      color: var(--accent-color);
      font-weight: 700;
      text-align: center;
      margin: 20px 0;
      text-shadow: 0 0 10px rgba(142, 14, 14, 0.5);
    }
    
    .barcode-image {
      width: 100%;
      max-width: 300px;
      height: auto;
      margin: 0 auto;
      display: block;
      background: white;
      padding: 15px;
      border-radius: 8px;
    }
    
    .popup-actions {
      display: flex;
      gap: 10px;
    }
    
    .popup-btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .popup-btn-primary {
      background: var(--primary-color);
      color: white;
    }
    
    .popup-btn-primary:hover {
      background: var(--accent-color);
    }
    
    .popup-btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }
    
    .popup-btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    /* التكيف مع الشاشات الصغيرة */
    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }
      
      h1 {
        font-size: 1.8rem;
      }
      
      .scanner-controls {
        flex-direction: column;
      }
      
      .btn {
        width: 100%;
      }
      
      .product-card {
        flex-direction: column;
        text-align: center;
      }
      
      .product-info {
        text-align: center;
      }
      
      .product-details {
        justify-content: center;
      }
      
      .popup {
        padding: 20px;
      }
      
      .popup-actions {
        flex-direction: column;
      }
    }
    
    /* الرسائل والتنبيهات */
    .status-message {
      padding: 10px 15px;
      border-radius: 8px;
      margin: 10px 0;
      font-weight: 500;
      display: none;
    }
    
    .status-message.success {
      background: rgba(40, 167, 69, 0.2);
      border: 1px solid var(--success-color);
      color: var(--success-color);
      display: block;
    }
    
    .status-message.error {
      background: rgba(220, 53, 69, 0.2);
      border: 1px solid var(--error-color);
      color: var(--error-color);
      display: block;
    }
    
    .status-message.warning {
      background: rgba(255, 193, 7, 0.2);
      border: 1px solid var(--warning-color);
      color: var(--warning-color);
      display: block;
    }
    
    .status-message.info {
      background: rgba(23, 162, 184, 0.2);
      border: 1px solid var(--info-color);
      color: var(--info-color);
      display: block;
    }
    
    /* التذييل */
    .footer {
      text-align: center;
      padding: 20px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
      margin-top: 50px;
    }
    
    .footer a {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      transition: all 0.3s ease;
    }
    
    .footer a:hover {
      color: var(--accent-color);
    }
    
    /* تأثيرات خاصة */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0);
      animation: ripple 0.6s linear;
      pointer-events: none;
    }
    
    @keyframes ripple {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }
    
    /* تحسينات للوضوح */
    .focus-enhance {
      position: relative;
    }
    
    .focus-enhance::after {
      content: '';
      position: absolute;
      top: -5px;
      left: -5px;
      right: -5px;
      bottom: -5px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: inherit;
      pointer-events: none;
      animation: focus-pulse 2s infinite ease-in-out;
    }
    
    @keyframes focus-pulse {
      0%, 100% {
        opacity: 0.5;
      }
      50% {
        opacity: 1;
      }
    }
    
    /* تأثيرات الكاميرا المحسنة */
    .camera-enhance {
      position: relative;
      overflow: hidden;
    }
    
    .camera-enhance::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.3) 0%,
        rgba(0, 0, 0, 0) 20%,
        rgba(0, 0, 0, 0) 80%,
        rgba(0, 0, 0, 0.3) 100%
      );
      pointer-events: none;
      z-index: 1;
    }
    
    /* تحسينات للوضوح التلقائي */
    .auto-focus {
      animation: auto-focus 3s infinite ease-in-out;
    }
    
    @keyframes auto-focus {
      0%, 100% {
        filter: contrast(1) brightness(1) saturate(1);
      }
      50% {
        filter: contrast(1.2) brightness(1.1) saturate(1.2);
      }
    }
  </style>
</head>
<body>
  <!-- تأثيرات الخلفية -->
  <div class="bg-pattern"></div>
  <div class="particles" id="particles"></div>
  
  <div class="container">
    <header class="header">
      <img src="https://miro.medium.com/v2/resize:fit:996/0*cryUnGm37uA1poft.gif" alt="Shehadeh AI Logo" class="logo">
      <h1>نظام البحث الذكي عن المنتجات</h1>
    </header>
    
    <!-- قسم الماسح الضوئي -->
    <section class="scanner-section">
      <div id="scanner-container">
        <div id="interactive" class="viewport camera-enhance auto-focus">
          <div class="scanner-overlay"></div>
          <div class="scanner-frame"></div>
          <div class="scanner-line"></div>
        </div>
      </div>
      
      <div id="status-message" class="status-message"></div>
      
      <div class="scanner-controls">
        <button id="start-scanner" class="btn btn-primary">
          <span class="btn-icon">✨</span> بدء المسح الضوئي
        </button>
        <button id="stop-scanner" class="btn btn-secondary" disabled>
          <span class="btn-icon">⏹️</span> إيقاف المسح
        </button>
      </div>
      
      <div id="zoom-controls" class="scanner-controls" style="display: none;">
        <button id="zoom-out" class="btn btn-secondary">
          <span class="btn-icon">🔎</span> تصغير
        </button>
        <button id="zoom-reset" class="btn btn-secondary">
          <span class="btn-icon">🔄</span> إعادة ضبط
        </button>
        <button id="zoom-in" class="btn btn-secondary">
          <span class="btn-icon">🔍</span> تكبير
        </button>
      </div>
    </section>
    
    <!-- قسم البحث -->
    <section class="search-section">
      <div class="search-tabs">

  <script>
    // تهيئة المتغيرات
    const barcodeInput = document.getElementById('barcode-input');
    const productNameInput = document.getElementById('product-name-input');
    const startScannerBtn = document.getElementById('start-scanner');
    const stopScannerBtn = document.getElementById('stop-scanner');
    const zoomControls = document.getElementById('zoom-controls');
    const zoomInBtn = document.getElementById('zoom-in');
    const zoomOutBtn = document.getElementById('zoom-out');
    const zoomResetBtn = document.getElementById('zoom-reset');
    const statusMessage = document.getElementById('status-message');
    const scannerContainer = document.getElementById('scanner-container');
    const barcodeForm = document.getElementById('barcode-form');
    const nameSearchForm = document.getElementById('name-search-form');
    const resultsSection = document.getElementById('results-section');
    const resultsContainer = document.getElementById('results-container');
    const resultsCount = document.getElementById('results-count');
    const popupOverlay = document.getElementById('popup-overlay');
    const closePopupBtn = document.getElementById('close-popup');
    const closePopupBtn2 = document.getElementById('close-popup-btn');
    const printBtn = document.getElementById('print-btn');
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');
    
    let scannerActive = false;
    let videoTrack = null;
    let currentZoom = 1;
    let minZoom = 1;
    let maxZoom = 5;
    let zoomStep = 0.5;
    let lastReadValues = [];
    let isProcessing = false;
    let productsDatabase = [];
    
    // تحميل قاعدة البيانات عند بدء الصفحة
    document.addEventListener('DOMContentLoaded', function() {
      // تعيين سنة التذييل
      document.getElementById('current-year').textContent = new Date().getFullYear();
      
      // إنشاء تأثير الجسيمات
      createParticles();

      // إضافة تأثير النقرة على الأزرار
      addRippleEffect();
      
      // تبديل علامات التبويب
      tabBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          const tabId = this.getAttribute('data-tab');
          
          // إزالة النشاط من جميع الأزرار والمحتويات
          tabBtns.forEach(b => b.classList.remove('active'));
          tabContents.forEach(c => c.classList.remove('active'));

          this.classList.add('active');
          document.getElementById(tabId).classList.add('active');
        });
      });
      
      // إغلاق النافذة المنبثقة
      closePopupBtn.addEventListener('click', closePopup);
      closePopupBtn2.addEventListener('click', closePopup);
      
      // طباعة النتيجة
      printBtn.addEventListener('click', function() {
        window.print();
      });
      
      // إيقاف الماسح عند النقر على
      // تحميل قاعدة البيانات
async function loadDatabase() {
  try {
    const response = await fetch('products-database.txt');
    if (!response.ok) throw new Error('فشل تحميل قاعدة البيانات');
    
    const data = await response.text();
    productsDatabase = data.split('\n').map(line => {
      const [name, category, manufacturer, price, barcode] = line.split('|');
      return { name, category, manufacturer, price, barcode: barcode?.trim() };
    }).filter(product => product.barcode);
    
    console.log('تم تحميل قاعدة البيانات بنجاح:', productsDatabase.length, 'منتج');
  } catch (error) {
    console.error('خطأ في تحميل قاعدة البيانات:', error);
    showAlert('error', 'خطأ', 'تعذر تحميل قاعدة البيانات');
  }
}

// بدء الماسح الضوئي
async function startScanner() {
  try {
    startScannerBtn.disabled = true;
    stopScannerBtn.disabled = false;
    statusMessage.textContent = '';
    statusMessage.className = 'status-message';
    
    // إظهار عناصر التحكم في التكبير
    zoomControls.style.display = 'flex';
    scannerContainer.classList.add('active');
    
    // إعداد قيود الكاميرا
    const constraints = {
      video: {
        facingMode: 'environment',
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        aspectRatio: { ideal: 16/9 },
        focusMode: 'continuous',
        zoom: currentZoom
      }
    };

    // الحصول على إذن الكاميرا
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    videoTrack = stream.getVideoTracks()[0];
    
    // ضبط حدود التكبير
    const capabilities = videoTrack.getCapabilities();
    if (capabilities.zoom) {
      minZoom = capabilities.zoom.min || 1;
      maxZoom = capabilities.zoom.max || 5;
      zoomStep = capabilities.zoom.step || 0.5;
    }
    
    updateZoomButtons();
    
    // تهيئة QuaggaJS
    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: document.querySelector('#interactive'),
        constraints: constraints.video,
      },
      decoder: {
        readers: ['ean_reader', 'ean_8_reader', 'code_128_reader', 'upc_reader', 'upc_e_reader'],
        multiple: false
      },
      locate: true,
      numOfWorkers: navigator.hardwareConcurrency || 4,
      frequency: 10
    }, function(err) {
      if (err) {
        console.error('خطأ في تهيئة الماسح:', err);
        showAlert('error', 'خطأ', 'تعذر تهيئة الماسح الضوئي');
        resetScanner();
        return;
      }
      
      Quagga.start();
      scannerActive = true;
      showAlert('success', 'تم التشغيل', 'الماسح الضوئي جاهز للاستخدام');
    });

    // عند اكتشاف الباركود
    Quagga.onDetected(async function(result) {
      const code = result.codeResult.code;
      
      if (!isValidBarcode(code)) {
        console.warn('باركود غير صالح:', code);
        return;
      }
      
      // معالجة الباركود
      await processBarcode(code);
    });

  } catch (error) {
    console.error('خطأ في تشغيل الماسح:', error);
    showAlert('error', 'خطأ', 'تعذر الوصول إلى الكاميرا');
    resetScanner();
  }
}

// إيقاف الماسح الضوئي
function stopScanner() {
  if (scannerActive) {
    Quagga.stop();
    scannerActive = false;
  }
  
  if (videoTrack) {
    videoTrack.stop();
    videoTrack = null;
  }
  
  resetScanner();
  showAlert('info', 'تم الإيقاف', 'تم إيقاف الماسح الضوئي');
}

// إعادة تعيين الماسح
function resetScanner() {
  startScannerBtn.disabled = false;
  stopScannerBtn.disabled = true;
  zoomControls.style.display = 'none';
  scannerContainer.classList.remove('active');
  currentZoom = 1;
}

// التحكم في التكبير
async function setZoom(zoomValue) {
  if (!videoTrack) return;
  
  try {
    await videoTrack.applyConstraints({
      advanced: [{ zoom: zoomValue }]
    });
    currentZoom = zoomValue;
    updateZoomButtons();
  } catch (err) {
    console.error('فشل ضبط التكبير:', err);
  }
}

// تكبير الصورة
function zoomIn() {
  if (currentZoom < maxZoom) {
    setZoom(Math.min(currentZoom + zoomStep, maxZoom));
  }
}

// تصغير الصورة
function zoomOut() {
  if (currentZoom > minZoom) {
    setZoom(Math.max(currentZoom - zoomStep, minZoom));
  }
}

// إعادة ضبط التكبير
function resetZoom() {
  setZoom(1);
}

// تحديث حالة أزرار التكبير
function updateZoomButtons() {
  zoomInBtn.disabled = currentZoom >= maxZoom;
  zoomOutBtn.disabled = currentZoom <= minZoom;
}

// التحقق من صحة الباركود
function isValidBarcode(code) {
  if (!code || code.length < 8) return false;
  
  // استخدام خوارزمية checksum لبعض أنواع الباركود
  if (code.length === 13 && !isValidEAN13Checksum(code)) return false;
  if (code.length === 8 && !isValidEAN8Checksum(code)) return false;
  
  // تجنب تكرار القراءة
  lastReadValues.push(code);
  if (lastReadValues.length > 3) lastReadValues.shift();
  
  return lastReadValues.every(val => val === code);
}

// خوارزمية التحقق من EAN-13
function isValidEAN13Checksum(code) {
  let sum = 0;
  for (let i = 0; i < 12; i++) {
    sum += (i % 2 === 0 ? 1 : 3) * parseInt(code[i]);
  }
  const checksum = (10 - (sum % 10)) % 10;
  return checksum === parseInt(code[12]);
}

// خوارزمية التحقق من EAN-8
function isValidEAN8Checksum(code) {
  let sum = 0;
  for (let i = 0; i < 7; i++) {
    sum += (i % 2 === 0 ? 3 : 1) * parseInt(code[i]);
  }
  const checksum = (10 - (sum % 10)) % 10;
  return checksum === parseInt(code[7]);
}

// معالجة الباركود
async function processBarcode(code) {
  if (isProcessing) return;
  isProcessing = true;
  
  // إظهار الباركود في حقل الإدخال
  barcodeInput.value = code;
  
  // إظهار رسالة الحالة
  showStatusMessage(`تم اكتشاف الباركود: ${code}`, 'success');
  
  // إيقاف الماسح مؤقتًا
  stopScanner();
  
  // البحث عن المنتج
  searchProductByBarcode(code);
  
  // إعادة تعيين العلم بعد تأخير
  setTimeout(() => {
    isProcessing = false;
  }, 1000);
}

// البحث عن المنتج بالباركود
function searchProductByBarcode(barcode) {
  const product = productsDatabase.find(p => p.barcode === barcode);
  
  if (product) {
    showProductResult(product);
  } else {
    showAlert('warning', 'غير موجود', 'لم يتم العثور على المنتج في قاعدة البيانات');
  }
}

// البحث عن المنتج بالاسم
function searchProductByName(name) {
  const searchTerm = name.toLowerCase();
  const results = productsDatabase.filter(p => 
    p.name.toLowerCase().includes(searchTerm) ||
    p.category.toLowerCase().includes(searchTerm) ||
    p.manufacturer.toLowerCase().includes(searchTerm)
  );
  
  if (results.length > 0) {
    showSearchResults(results);
  } else {
    showAlert('warning', 'غير موجود', 'لم يتم العثور على منتجات تطابق البحث');
  }
}

// عرض نتيجة منتج واحد
function showProductResult(product) {
  // ملء بيانات النافذة المنبثقة
  document.getElementById('popup-product-name').textContent = product.name;
  document.getElementById('popup-product-category').textContent = product.category;
  document.getElementById('popup-product-manufacturer').textContent = product.manufacturer;
  document.getElementById('popup-product-barcode').textContent = product.barcode;
  document.getElementById('popup-product-price').textContent = `${product.price} ر.س`;
  
  // إنشاء صورة الباركود
  const barcodeImg = document.getElementById('barcode-image');
  JsBarcode(barcodeImg, product.barcode, {
    format: "CODE128",
    lineColor: "#000",
    width: 2,
    height: 60,
    displayValue: true
  });
  barcodeImg.style.display = 'block';
  
  // عرض النافذة المنبثقة
  openPopup();
}

// عرض نتائج البحث المتعددة
function showSearchResults(results) {
  resultsContainer.innerHTML = '';
  
  results.forEach(product => {
    const productCard = document.createElement('div');
    productCard.className = 'product-card';
    productCard.innerHTML = `
      <div class="product-image">
        <i class="fas fa-box-open"></i>
      </div>
      <div class="product-info">
        <h3 class="product-name">${product.name}</h3>
        <div class="product-details">
          <span>${product.category}</span>
          <span>${product.manufacturer}</span>
        </div>
        <div class="product-details">
          <span class="product-price">${product.price} ر.س</span>
          <span class="product-barcode">${product.barcode}</span>
        </div>
      </div>
    `;
    
    productCard.addEventListener('click', () => showProductResult(product));
    resultsContainer.appendChild(productCard);
  });
  
  resultsCount.textContent = `${results.length} منتجات`;
  resultsSection.style.display = 'block';
}

// فتح النافذة المنبثقة
function openPopup() {
  popupOverlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

// إغلاق النافذة المنبثقة
function closePopup() {
  popupOverlay.classList.remove('active');
  document.body.style.overflow = '';
}

// عرض رسالة الحالة
function showStatusMessage(message, type) {
  statusMessage.textContent = message;
  statusMessage.className = `status-message ${type}`;
}

// عرض تنبيه جميل
function showAlert(icon, title, text) {
  Swal.fire({
    icon: icon,
    title: title,
    text: text,
    timer: 3000,
    showConfirmButton: false
  });
}

// إنشاء تأثير الجسيمات
function createParticles() {
  const particlesContainer = document.getElementById('particles');
  const particleCount = 30;
  
  for (let i = 0; i < particleCount; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    
    // تحديد حجم عشوائي
    const size = Math.random() * 5 + 2;
    particle.style.width = `${size}px`;
    particle.style.height = `${size}px`;
    
    // تحديد موقع عشوائي
    particle.style.left = `${Math.random() * 100}%`;
    particle.style.top = `${Math.random() * 100}%`;
    
    // تحديد تأخير عشوائي للحركة
    particle.style.animationDelay = `${Math.random() * 15}s`;
    
    // تحديد الشفافية
    particle.style.opacity = Math.random() * 0.5 + 0.1;
    
    particlesContainer.appendChild(particle);
  }
}

// إضافة تأثير النقرة على الأزرار
function addRippleEffect() {
  const buttons = document.querySelectorAll('.btn, .search-btn, .popup-btn');
  
  buttons.forEach(button => {
    button.addEventListener('click', function(e) {
      const rect = this.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;
      
      this.appendChild(ripple);
      
      setTimeout(() => {
        ripple.remove();
      }, 600);
    });
  });
}

// أحداث النماذج
barcodeForm.addEventListener('submit', function(e) {
  e.preventDefault();
  const barcode = barcodeInput.value.trim();
  
  if (!barcode) {
    showAlert('warning', 'تحذير', 'الرجاء إدخال باركود صحيح');
    return;
  }
  
  searchProductByBarcode(barcode);
});

nameSearchForm.addEventListener('submit', function(e) {
  e.preventDefault();
  const name = productNameInput.value.trim();
  
  if (!name || name.length < 3) {
    showAlert('warning', 'تحذير', 'الرجاء إدخال اسم منتج صحيح (3 أحرف على الأقل)');
    return;
  }
  
  searchProductByName(name);
});
