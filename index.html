<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بحث المنتجات باستخدام الباركود</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            margin: 0;
            padding: 0;
            color: #fff;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background-color: #ffffff;
            color: #333;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #0984e3;
        }
        input[type="text"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
        }
        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #0984e3;
            border: none;
            color: #fff;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        input[type="submit"]:hover {
            background-color: #74b9ff;
        }
        .switch-container {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .switch-container label {
            font-size: 16px;
            margin-right: 10px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 25px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 25px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 19px;
            width: 19px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #0984e3;
        }
        input:checked + .slider:before {
            transform: translateX(25px);
        }
        #status-message {
            margin-top: 20px;
            color: #0984e3;
            font-size: 16px;
            display: none;
            font-weight: bold;
        }
        #product-details {
            margin-top: 20px;
        }
        .detail-box {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: #f4f4f4;
            color: #333;
            font-size: 16px;
            text-align: left;
        }
        .price-box {
            margin: 10px 0;
            padding: 15px;
            border: 2px solid #0984e3;
            border-radius: 6px;
            background-color: #dfe6e9;
            color: #333;
            font-size: 20px;
            font-weight: bold;
            text-align: left;
        }
        label {
        font-size: 16px;
        font-weight: bold;
        color: #0984e3;
        text-align: center;
        display: block;
    }
    </style>
</head>
<body>

    <div class="container">
        <h1>بحث المنتجات باستخدام الباركود</h1>

        <!-- مفتاح اختيار الوضعية -->
        <div class="switch-container">
            <label>mode</label>
            <label class="switch">
                <input type="checkbox" id="mode-switch">
                <span class="slider"></span>
            </label>
        </div>

        <!-- رسالة الوضعية -->
        <div id="status-message"></div>

        <!-- نموذج البحث عن المنتج -->
        <form id="barcode-form">
            <input type="text" id="barcode-input" placeholder="أدخل الباركود" required>
            <input type="submit" value="بحث">
        </form>

        <!-- عرض تفاصيل المنتج -->
        <div id="product-details">
            <h2>تفاصيل المنتج:</h2>
            <div class="detail-box" id="product-name">الاسم: -</div>
            <div class="price-box" id="product-price">السعر: -</div>
            <div class="detail-box" id="product-barcode">الباركود: -</div>
        </div>
    </div>

    <script>
        const modeSwitch = document.getElementById('mode-switch');
        const barcodeInput = document.getElementById('barcode-input');
        const statusMessage = document.getElementById('status-message');

        // تحميل الوضعية من التخزين المحلي
        document.addEventListener('DOMContentLoaded', () => {
            const savedMode = localStorage.getItem('inputMode');
            if (savedMode === 'barcode') {
                modeSwitch.checked = true;
                setBarcodeMode();
            } else {
                setKeyboardMode();
            }
        });

// تبديل الوضعية عند تغيير المفتاح
modeSwitch.addEventListener('change', () => {
    if (modeSwitch.checked) {
        setBarcodeMode();
        localStorage.setItem('inputMode', 'barcode');
        showStatusMessage('تم التغيير إلى وضعية استخدام الباركود');
    } else {
        setKeyboardMode();
        localStorage.setItem('inputMode', 'keyboard');
        showStatusMessage('تم التغيير إلى وضعية استخدام لوحة المفاتيح');
    }
});

// ضبط الوضعية على "استخدام باركود"
function setBarcodeMode() {
    barcodeInput.setAttribute('inputmode', 'none'); // منع ظهور لوحة المفاتيح الافتراضية
    barcodeInput.placeholder = "استخدم جهاز قارئ الباركود";
}

// ضبط الوضعية على "استخدام لوحة المفاتيح"
function setKeyboardMode() {
    barcodeInput.setAttribute('inputmode', 'text'); // السماح بظهور لوحة المفاتيح الافتراضية
    barcodeInput.placeholder = "أدخل الباركود";
}

        // عرض رسالة تأكيد تغيير الوضعية
        function showStatusMessage(message) {
            statusMessage.textContent = message;
            statusMessage.style.display = 'block';
            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 5000);
        }

        // البحث عن المنتج
        document.getElementById('barcode-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const barcodeInputValue = barcodeInput.value.trim();

            if (!barcodeInputValue) {
                alert("الرجاء إدخال الباركود.");
                return;
            }

            // قراءة ملف البيانات
            fetch('test.txt')
                .then(response => {
                    if (!response.ok) {
                        throw new Error("فشل تحميل ملف البيانات.");
                    }
                    return response.text();
                })
                .then(data => {
                    const lines = data.split('\n');
                    let found = false;

                    for (let line of lines) {
                        const [productName, productPrice, barcode] = line.split('/');
                        if (barcode && barcode.trim() === barcodeInputValue) {
                            document.getElementById('product-name').textContent = `الاسم: ${productName}`;
                            document.getElementById('product-price').textContent = `السعر: ${productPrice}`;
                            document.getElementById('product-barcode').textContent = `الباركود: ${barcode}`;
                            found = true;
                            break;
                        }
                    }

                    if (!found) {
                        document.getElementById('product-name').textContent = 'الاسم: المنتج غير موجود';
                        document.getElementById('product-price').textContent = 'السعر: -';
                        document.getElementById('product-barcode').textContent = 'الباركود: -';
                    }

                    barcodeInput.value = '';
                })
                .catch(error => {
                    alert(error.message);
                });
        });
    </script>

</body>
</html>
