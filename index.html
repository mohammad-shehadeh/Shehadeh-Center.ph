<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode Scanner and Search</title>
  <style>
/* General Styles */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: #f7f7f7;
  margin: 0;
  padding: 0;
  text-align: center;
  color: #333;
}

h1 {
  color: #333;
  font-size: 2.2rem;
  margin-top: 40px;
}

.container {
  max-width: 800px;
  margin: 30px auto;
  padding: 25px;
  background-color: #fff;
  border-radius: 15px;
  box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.1);
}

/* Scanner Styles */
#scanner-container {
  position: relative;
  width: 100%;
  border-radius: 15px;
  overflow: hidden;
  background-color: #000;
  box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.2);
}

#scanner-container video {
  width: 100%;
  height: auto;
  border-radius: 15px;
}

/* Barcode Input and Button Styles */
input[type="text"] {
  width: 85%;
  padding: 12px;
  font-size: 18px;
  border: 2px solid #ddd;
  border-radius: 10px;
  margin-top: 20px;
  outline: none;
  transition: border 0.3s ease;
}

input[type="text"]:focus {
  border-color: #007bff;
}

button {
  margin-top: 20px;
  padding: 12px 30px;
  font-size: 18px;
  color: white;
  background-color: #007bff;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

button:hover {
  background-color: #0056b3;
}

button:disabled {
  background-color: #aaa;
  cursor: not-allowed;
}

/* Submit Button Style */
input[type="submit"] {
  width: 90%;
  padding: 12px 0;
  font-size: 18px;
  color: white;
  background-color: #0058bde7;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: background-color 0.3s ease;
  margin-top: 20px;
}

input[type="submit"]:hover {
  background-color: #047bca;
}

input[type="submit"]:disabled {
  background-color: #aaa;
  cursor: not-allowed;
}

/* Status Message */
#status-message {
  margin-top: 10px;
  font-weight: bold;
}

.success {
  color: #28a745;
}

.error {
  color: #dc3545;
}

/* Popup Styles */
.popup {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: linear-gradient(145deg, #ffffff, #f0f0f0);
  border: 1px solid #ddd;
  border-radius: 16px;
  padding: 30px;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
  z-index: 9999;
  animation: popupAnimation 0.5s ease-out;
}

@keyframes popupAnimation {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.8);
  }
  100% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}

.popup h2 {
  margin: 0 0 20px;
  font-size: 1.8rem;
  color: #333;
  font-weight: bold;
  text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
}

.detail-box {
  margin-bottom: 20px;
  font-size: 1.2rem;
  color: #666;
}

.price {
  font-size: 1.5rem;
  font-weight: bold;
  color: #ff5722;
  text-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  display: inline-block;
  margin-top: 10px;
}

.close-btn {
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 12px 25px;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.3s ease, transform 0.2s ease;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

.close-btn:hover {
  background: #45a049;
  transform: scale(1.05);
}

.close-btn:active {
  transform: scale(0.98);
}

/* Mobile Responsiveness */
@media (max-width: 768px) {
  .popup {
    width: 80%;
    padding: 20px;
  }

  .popup h2 {
    font-size: 1.5rem;
  }

  .detail-box {
    font-size: 1rem;
  }

  .close-btn {
    padding: 10px 20px;
    font-size: 0.9rem;
  }

  .price {
    font-size: 1.3rem;
  }
}
  </style>
</head>
<body>

  <div id="scanner-container">
    <div id="interactive" class="viewport"></div>
  </div>

  <div class="container">
    <h1>بحث المنتجات باستخدام الباركود</h1>

    <form id="barcode-form">
      <input type="text" id="barcode-input" placeholder="أدخل الباركود" required>
      <input type="submit" value="بحث">
    </form>
  </div>

  <div class="popup" id="result-popup">
    <h2>نتائج البحث:</h2>
    <div class="detail-box" id="product-name">
      <strong>الاسم:</strong> <span id="product-name-result">-</span>
    </div>
    <div class="price-box" id="product-price">
      <strong>السعر:</strong> <span id="product-price-result">-</span>
    </div>
    <div class="detail-box" id="product-barcode">
      <strong>الباركود:</strong> <span id="product-barcode-result">-</span>
    </div>
    <button class="close-btn" onclick="closePopup()">إغلاق</button>
  </div>

  <button id="start-scanner">Start Scanner</button>
  <p id="status-message"></p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <script>
    const barcodeInput = document.getElementById('barcode-input');
    const popup = document.getElementById('result-popup');
    const startScannerButton = document.getElementById('start-scanner');
    const statusMessage = document.getElementById('status-message');
    const scannerContainer = document.getElementById('scanner-container'); // العنصر الذي يحتوي على الفيديو
    const form = document.getElementById('barcode-form');
  
    let lastReadValues = [];
    let isProcessing = false;
    let scannerActive = false;
  
    // إخفاء واجهة الماسح عند تحميل الصفحة
    document.addEventListener('DOMContentLoaded', () => {
      barcodeInput.focus();
      scannerContainer.style.display = 'none'; // إخفاء واجهة الماسح عند تحميل الصفحة
    });
  
    // بدء الماسح
    function startScanner() {
      startScannerButton.disabled = true;
      statusMessage.textContent = '';
  
      // إظهار واجهة الماسح (scanner-container) عند بدء القراءة
      scannerContainer.style.display = 'block';
  
      Quagga.init(
        {
          inputStream: {
            name: 'Live',
            type: 'LiveStream',
            target: document.querySelector('#interactive'),
            constraints: {
              facingMode: 'environment',
              width: { ideal: 1920 },
              height: { ideal: 1080 },
              aspectRatio: { ideal: 16 / 9 },
              advanced: [{ focusMode: 'continuous' }],
            },
          },
          decoder: {
            readers: ['code_128_reader', 'ean_reader', 'ean_8_reader'],
          },
          locate: true,
          numOfWorkers: navigator.hardwareConcurrency || 4,
          frequency: 10,
        },
        function (err) {
          if (err) {
            console.error('Error initializing Quagga:', err);
            statusMessage.textContent = 'خطأ في تشغيل الماسح.';
            startScannerButton.disabled = false;
            return;
          }
          Quagga.start();
          scannerActive = true;
        }
      );
  
      Quagga.onDetected(function (data) {
        const code = data.codeResult.code;
        if (isValidBarcode(code)) {
          processBarcode(code);
        }
      });
    }
  
    // التحقق من صحة الباركود
    function isValidBarcode(code) {
      if (!code) return false;
  
      lastReadValues.push(code);
      if (lastReadValues.length > 3) lastReadValues.shift();
  
      return lastReadValues.every((val) => val === code);
    }
  
    // معالجة الباركود
    function processBarcode(code) {
      if (isProcessing) return;
      isProcessing = true;
  
      setTimeout(() => {
        barcodeInput.value = code; // إدخال الباركود في الحقل
        stopScanner();
        form.querySelector('input[type="submit"]').click(); // تنفيذ الضغط على زر البحث تلقائيًا
        isProcessing = false;
      }, 500);
    }
  
    // إيقاف الماسح
    function stopScanner() {
      if (scannerActive) {
        Quagga.stop();
        scannerActive = false;
        lastReadValues = [];
        startScannerButton.disabled = false;
      }
    }
  
    // البحث عن المنتج
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const barcodeValue = barcodeInput.value.trim();
      if (!barcodeValue) {
        alert('الرجاء إدخال الباركود.');
        return;
      }
  
      fetch('test.txt')
        .then((response) => {
          if (!response.ok) {
            throw new Error('فشل تحميل ملف البيانات.');
          }
          return response.text();
        })
        .then((data) => {
          const lines = data.split('\n');
          let found = false;
  
          for (let line of lines) {
            const [productName, productPrice, barcode] = line.split('/');
            if (barcode && barcode.trim() === barcodeValue) {
              document.getElementById('product-name-result').textContent = productName;
              document.getElementById('product-price-result').textContent = productPrice;
              document.getElementById('product-barcode-result').textContent = barcode;
              found = true;
              break;
            }
          }
  
          if (!found) {
            document.getElementById('product-name-result').textContent = 'المنتج غير موجود';
            document.getElementById('product-price-result').textContent = '-';
            document.getElementById('product-barcode-result').textContent = '-';
          }
  
          openPopup();
          scannerContainer.style.display = 'none'; // إخفاء واجهة الماسح بعد البحث
        })
        .catch((error) => {
          alert(error.message);
        });
    });
  
    // عرض النافذة المنبثقة
    function openPopup() {
      popup.style.display = 'block';
    }
  
    // إغلاق النافذة المنبثقة
    function closePopup() {
      popup.style.display = 'none';
      barcodeInput.focus();
    }
  
    // إضافة مستمع لزر بدء الماسح
    startScannerButton.addEventListener('click', startScanner);
  </script>
    </body>
</html>
